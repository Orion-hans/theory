<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>음악이론 48 · 전공 기초</title>
<style>
:root{
  /* 배경 위계 */
  --bg:#0c1116;--surface:#18212a;--surface2:#212c36;--raised:#26333f;
  --line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);
  /* 글자 위계 — 대비 강화 */
  --text:#f4f8f9;      /* 제목·강조 (최고 대비) */
  --body:#dbe4e8;      /* 본문 (읽는 글, 밝게) */
  --muted:#a7b4bc;     /* 보조 (AA 통과) */
  --faint:#75818b;     /* 장식용만 */
  /* 강조색 — 텍스트로도 읽히게 살짝 밝힘 */
  --mint:#6fe9cd;--mint2:#3cc4a4;--coral:#ff8575;--amber:#f5d18f;--slate:#a2b3de;
  --mono:ui-monospace,'SF Mono','Roboto Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--body);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:16px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.6;letter-spacing:-.003em;}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 64px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

/* header */
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
header h1{font-size:1.6rem;font-weight:800;margin:0;letter-spacing:-.02em;color:var(--text);}header h1 b{color:var(--mint);}
header .sub{font-size:.78rem;color:var(--muted);font-family:var(--mono);font-weight:600;}

/* progress */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;}
.prog-pct{font-size:1.7rem;font-weight:800;font-family:var(--mono);color:var(--mint);letter-spacing:-.02em;}
.prog-pct small{font-size:.8rem;color:var(--muted);font-weight:600;margin-left:5px;}
.prog-stats{display:flex;gap:16px;font-size:.8rem;color:var(--muted);font-family:var(--mono);font-weight:600;}.prog-stats b{color:var(--text);font-weight:800;}
.bar{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden;}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mint2),var(--mint));border-radius:5px;transition:width .5s;}

/* today */
.today{background:linear-gradient(135deg,rgba(111,233,205,.16),rgba(162,179,222,.09));border:1px solid var(--line2);border-radius:16px;padding:18px;margin-bottom:22px;}
.today .lab{font-size:.72rem;color:var(--mint);font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;font-weight:700;}
.today .day{font-size:1.22rem;font-weight:800;margin:6px 0 3px;color:var(--text);letter-spacing:-.01em;}
.today .ph{font-size:.82rem;color:var(--muted);margin-bottom:14px;font-weight:500;}
.today .go{display:block;width:100%;background:var(--mint);color:#0a1013;font-size:1rem;font-weight:800;border-radius:11px;padding:13px;text-align:center;}
.today.done{background:var(--surface);}.today.done .go{background:var(--surface2);color:var(--muted);}

/* map */
.map-h{font-size:.78rem;color:var(--muted);font-family:var(--mono);letter-spacing:.08em;margin:0 2px 12px;text-transform:uppercase;font-weight:700;}
.wk{margin-bottom:13px;}
.wk-lab{display:flex;gap:8px;font-size:.8rem;color:var(--muted);margin-bottom:6px;padding-left:2px;font-weight:500;}.wk-lab b{color:var(--text);font-weight:800;}
.wk-days{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;}
.cell{aspect-ratio:1;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--muted);position:relative;transition:transform .1s;}
.cell:active{transform:scale(.94);}
.cell.done{background:var(--mint);color:#0a1013;border-color:var(--mint);font-weight:800;}.cell.done::after{content:'✓';position:absolute;top:2px;right:5px;font-size:.58rem;opacity:.75;}
.cell.exam{border-color:var(--amber);color:var(--amber);}.cell.exam.done{background:var(--amber);color:#0a1013;}
.cell.cur{border-color:var(--mint);box-shadow:0 0 0 2px rgba(111,233,205,.4);color:var(--mint);}.cell.cur.done{color:#0a1013;}

/* lesson */
#lesson{display:none;}
.back{font-size:.9rem;color:var(--muted);padding:8px 0;margin-bottom:6px;font-weight:600;}
.l-head{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.l-day{font-size:.72rem;color:var(--mint);font-family:var(--mono);letter-spacing:.1em;font-weight:700;}
.l-t{font-size:1.45rem;font-weight:800;margin:6px 0 9px;letter-spacing:-.015em;color:var(--text);line-height:1.25;}
.l-chain{display:flex;gap:8px;justify-content:space-between;margin-top:10px;font-size:.68rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.l-chain span{max-width:47%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-n{text-align:right;color:var(--slate)}
.l-lead{font-size:.98rem;color:var(--body);line-height:1.7;}
.sec{margin-bottom:26px;}
.sec-h{display:flex;align-items:center;gap:9px;font-size:.95rem;font-weight:800;color:var(--text);margin-bottom:12px;}
.sec-h .n{width:24px;height:24px;border-radius:50%;background:var(--mint);color:#0a1013;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;font-family:var(--mono);flex:0 0 auto;}
.sec-h .tag{font-size:.66rem;font-weight:700;color:var(--faint);font-family:var(--mono);letter-spacing:.05em;}
.read{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.read li{padding:13px 16px;font-size:.95rem;line-height:1.68;color:var(--body);border-bottom:1px solid var(--line);}.read li:last-child{border-bottom:none;}

/* beat trainer */
.bt-focus{font-size:.92rem;color:var(--body);background:var(--surface2);border-radius:11px;padding:12px 14px;margin-bottom:14px;line-height:1.6;border-left:3px solid var(--mint);}.bt-focus b{color:var(--mint);font-weight:700;}
.bt-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 14px;}
.btsvg{width:100%;max-width:250px;display:block;margin:0 auto 12px;}
  .bt-sublab{font-size:.72rem;color:var(--muted);align-self:center;margin-right:4px;white-space:nowrap}
  #btAx{background:var(--surface2);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:6px 9px;font-size:.8rem;font-family:var(--mono)}
  #e66sel,#e66words select{background:var(--surface2);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:5px 8px}
.km-keys{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.km-k{padding:7px 13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;font-size:.86rem;font-weight:700;cursor:pointer}
.km-k.on{background:var(--mint);color:#0e1418;border-color:var(--mint)}
.km-k.fav{border-color:rgba(95,224,192,.5)}
.km-lab{font-size:.74rem;color:var(--muted);margin:12px 0 5px;letter-spacing:.04em}
.km-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.km-seg{padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;font-size:.8rem;font-weight:700;cursor:pointer}
.km-seg.on{background:var(--mint);color:#0e1418;border-color:var(--mint)}
.km-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:9px}
.km-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.km-rn{font-family:Georgia,serif;font-size:1.24rem;font-weight:700;color:var(--mint);min-width:2.6em}
.km-nm{font-size:1.06rem;font-weight:800;color:var(--text)}
.km-fn{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(95,224,192,.13);color:var(--mint)}
.km-pcs{font-size:.82rem;color:var(--muted);margin-top:3px;letter-spacing:.06em}
.km-staff{background:#f7f5ef;border-radius:10px;margin:9px 0 7px;padding:6px 2px}
.km-staff svg{display:block;margin:0 auto;max-width:100%}
.km-feel{font-size:.85rem;line-height:1.6;color:var(--text);opacity:.92}
.km-arp{margin-left:4px}
.km-play{margin-left:auto;padding:6px 13px;border:1px solid var(--line);background:var(--bg);color:var(--mint);border-radius:9px;font-size:.8rem;font-weight:700;cursor:pointer}
.km-note{font-size:.78rem;color:var(--muted);line-height:1.65;margin-top:12px}
.gs-filt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gs-f{padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;font-size:.8rem;font-weight:700;cursor:pointer}
.gs-f.on{background:var(--mint);color:#0e1418;border-color:var(--mint)}
.gs-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.gs-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.gs-n{font-size:1.05rem;font-weight:800;color:var(--text)}
.gs-ax{font-size:.73rem;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(95,224,192,.13);color:var(--mint)}
.gs-g{font-size:.7rem;color:var(--muted);margin-left:auto}
.gs-rows{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.gs-r{display:flex;gap:8px;font-size:.83rem;line-height:1.55}
.gs-k{flex:0 0 4.4em;color:var(--muted);font-size:.75rem;font-weight:700;padding-top:2px}
.gs-v{flex:1;color:var(--text);opacity:.93}
.gs-tbl{width:100%;border-collapse:collapse;margin:8px 0}
.gs-tbl th,.gs-tbl td{border:1px solid var(--line);padding:7px 9px;font-size:.83rem;text-align:left}
.gs-tbl th{color:var(--mint);font-weight:700;background:rgba(95,224,192,.07)}

.bt-ctrl{display:flex;flex-direction:column;gap:12px;align-items:center;}
.bt-meters{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:100%;}
.btm{padding:6px 11px;border:1px solid var(--line2);background:var(--surface2);border-radius:9px;font-size:.8rem;font-weight:700;color:var(--muted);font-family:var(--mono);white-space:nowrap;flex:0 0 auto;}
.btm.on{background:var(--slate);color:#0a1013;border-color:var(--slate);}
.bt-play{background:var(--mint);color:#0a1013;font-weight:800;border-radius:10px;padding:11px 34px;font-size:.95rem;}
.bt-bpm{display:flex;align-items:center;gap:11px;font-size:.82rem;color:var(--muted);font-family:var(--mono);font-weight:600;width:100%;max-width:250px;}
.bt-bpm input{flex:1;accent-color:var(--mint);}
.bt-beatn{font-family:var(--mono);font-size:.82rem;color:var(--muted);}.bt-beatn b{color:var(--mint);font-size:1.05rem;font-weight:800;}

/* left hand */
.bt-lh-toggle{margin-top:2px;font-size:.85rem;color:var(--slate);background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:9px 18px;font-weight:700;}
.bt-lh-toggle.on{background:var(--slate);color:#0a1013;border-color:var(--slate);}
.lh-box{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);width:100%;max-width:256px;}
.lh-box.on{display:block;}
.lh-head{font-size:.85rem;color:var(--slate);font-weight:700;margin-bottom:10px;text-align:center;}.lh-head b{color:var(--text);}
.lh-main{display:flex;gap:15px;align-items:flex-end;justify-content:center;}
.lh-track{width:30px;height:100px;background:var(--surface2);border:1px solid var(--line2);border-radius:7px;position:relative;overflow:hidden;flex:0 0 auto;}
.lh-fill{position:absolute;bottom:0;left:0;right:0;height:8%;background:linear-gradient(180deg,#b6c4ea,#5a7bc0);}
.lh-col{display:flex;flex-direction:column;align-items:center;gap:7px}
.lh-sig{display:flex;flex-direction:column;align-items:center;gap:3px}
.sigdot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);transition:transform .08s,background .08s,border-color .08s}
.sigdot.prep{border-color:var(--amber,#e8c98a);border-style:dashed;color:var(--amber,#e8c98a)}
.sigdot.cue{background:var(--amber,#e8c98a);border-color:var(--amber,#e8c98a);color:#0a1013;transform:scale(1.28)}
.sigcap{font-size:.62rem;font-weight:700;color:var(--muted)}
.lh-track{width:44px;height:150px}
.ltgt{position:absolute;left:2px;right:2px;height:3px;border-radius:2px;background:#e8c98a;bottom:0%;transition:bottom .08s linear;z-index:3;box-shadow:0 0 6px rgba(232,201,138,.5)}
.lmark{position:absolute;left:50%;z-index:2;transform:translate(-50%,50%);width:20px;height:20px;border-radius:50%;background:var(--bg,#0a1013);border:3px solid var(--text);bottom:45%;transition:bottom .07s ease-out,transform .08s}
.lmark.hot{border-color:#e8c98a;transform:translate(-50%,50%) scale(1.28);animation:mkbl66 .3s steps(2,end) infinite}
@keyframes mkbl66{50%{opacity:.25}}
.cutdot{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#ff8f7a;z-index:4;animation:cutbl66 .28s steps(2,end) infinite}
@keyframes cutbl66{50%{opacity:.15}}
.hide{display:none!important}
#e66tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
#e66tabs .btm,#e66words .btm{white-space:nowrap;font-size:.7rem;padding:5px 9px}
#lhOpt66{background:var(--surface2);color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:5px 9px;font-size:.78rem;font-family:var(--mono)}
#e66words{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
#e66wrap{max-width:100%}
.lh-fill.flash{background:var(--coral);}
.lh-exs{display:flex;flex-direction:column;gap:6px;}
.lhx{font-size:.8rem;padding:7px 12px;border:1px solid var(--line2);background:var(--surface2);border-radius:8px;color:var(--muted);font-weight:600;text-align:left;}
.lhx.on{border-color:var(--slate);color:var(--slate);background:rgba(162,179,222,.14);}
.lh-note{font-size:.76rem;color:var(--muted);text-align:center;margin-top:11px;line-height:1.5;}

/* ear */
.ear-tgt{font-size:.92rem;color:var(--body);background:var(--surface2);border-radius:11px;padding:12px 14px;margin-bottom:14px;border-left:3px solid var(--amber);line-height:1.6;}.ear-tgt b{color:var(--amber);font-weight:700;}
.ear-q{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px;}
.ear-play{background:var(--raised);border:1px solid var(--line2);border-radius:9px;padding:10px 20px;font-size:.9rem;font-weight:700;color:var(--text);margin-bottom:11px;}
.ear-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.ear-opt{background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:11px 8px;font-size:.88rem;color:var(--body);font-weight:600;}
.ear-opt.ok{background:rgba(111,233,205,.2);border-color:var(--mint);color:var(--mint);}
.ear-opt.no{background:rgba(255,133,117,.18);border-color:var(--coral);color:var(--coral);}
.ear-r{margin-top:10px;font-size:.86rem;color:var(--muted);display:none;line-height:1.55;}.ear-r.on{display:block;}.ear-r b{color:var(--mint);font-weight:700;}

/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:11px;}
.q-tag{font-size:.66rem;font-family:var(--mono);font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.03em;}
.q-tag.mc{background:rgba(162,179,222,.22);color:var(--slate);}.q-tag.sa{background:rgba(245,209,143,.22);color:var(--amber);}
.q-q{font-size:.98rem;font-weight:700;margin:10px 0 13px;line-height:1.55;color:var(--text);}
.opt{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:.92rem;color:var(--body);font-weight:500;}
.opt.correct{background:rgba(111,233,205,.2);border-color:var(--mint);color:var(--mint);font-weight:700;}
.opt.wrong{background:rgba(255,133,117,.18);border-color:var(--coral);color:var(--coral);}.opt.dim{opacity:.45;}
.sa-in{width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font-size:.95rem;color:var(--text);font-family:inherit;}
.sa-in:focus{outline:none;border-color:var(--amber);}
.sa-btn{margin-top:9px;background:var(--raised);border:1px solid var(--line2);border-radius:9px;padding:9px 18px;font-size:.86rem;font-weight:700;color:var(--text);}
.reveal{margin-top:11px;padding:12px 14px;background:var(--surface2);border-radius:10px;border-left:3px solid var(--mint);display:none;}.reveal.on{display:block;}
.reveal .ans{font-size:.9rem;font-weight:800;color:var(--mint);margin-bottom:5px;}.reveal .exp{font-size:.86rem;color:var(--body);line-height:1.6;}
.selfmark{margin-top:10px;display:flex;gap:8px;}.selfmark button{flex:1;border-radius:9px;padding:9px;font-size:.85rem;font-weight:700;border:1px solid var(--line2);}
.selfmark .ok{color:var(--mint);}.selfmark .no{color:var(--coral);}.selfmark button.sel{background:var(--raised);}
.explain{margin-top:10px;font-size:.86rem;color:var(--body);line-height:1.6;padding-left:12px;border-left:3px solid var(--line2);display:none;}.explain.on{display:block;}

.task.hand{border-left-color:var(--mint);margin-top:9px}
.task.hand b{color:var(--mint)}
.task{background:rgba(245,209,143,.1);border:1px solid rgba(245,209,143,.3);border-radius:13px;padding:14px 16px;font-size:.94rem;line-height:1.65;color:#f0e3c6;}.task b{color:var(--amber);font-weight:700;}
.done-btn{display:block;width:100%;background:var(--mint);color:#0a1013;font-size:1rem;font-weight:800;border-radius:12px;padding:15px;margin-top:10px;}
.done-btn.saved{background:var(--surface2);color:var(--mint);border:1px solid var(--mint);}
.scoreline{text-align:center;font-size:.86rem;color:var(--muted);font-family:var(--mono);font-weight:600;margin:14px 0 6px;}.scoreline b{color:var(--mint);font-weight:800;}
.ref-btn{display:block;width:100%;margin-top:18px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:15px;font-size:.98rem;font-weight:700;color:var(--text);text-align:center;}
.ref-btn b{color:var(--mint);}
.ref-nav{display:flex;gap:7px;margin-bottom:18px;}
.ref-nav button{flex:1;padding:9px 4px;border:1px solid var(--line2);background:var(--surface2);border-radius:10px;font-size:.82rem;font-weight:700;color:var(--muted);}
.ref-nav button.on{background:var(--mint);color:#0a1013;border-color:var(--mint);}
.ref-cat{font-size:.85rem;font-weight:800;color:var(--slate);margin:18px 0 9px;padding-left:3px;border-left:3px solid var(--slate);padding-left:9px;}
.ref-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;}
.ref-list li{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);font-size:.92rem;line-height:1.6;}
.ref-list li:last-child{border-bottom:none;}
.ref-list .term{flex:0 0 36%;font-weight:700;color:var(--text);}
.ref-list .desc{flex:1;color:var(--body);}
.lesson-card{background:linear-gradient(135deg,rgba(111,233,205,.1),rgba(162,179,222,.06));border:1px solid var(--line2);border-radius:12px;padding:13px 15px;margin-bottom:12px;}
.lesson-h{font-size:.92rem;font-weight:800;color:var(--mint);margin-bottom:9px;letter-spacing:-.01em;}
.lesson-ul{list-style:none;margin:0;padding:0;}
.lesson-ul li{font-size:.9rem;line-height:1.62;color:var(--body);padding:4px 0 4px 15px;position:relative;}
.lesson-ul li::before{content:'▪';position:absolute;left:2px;color:var(--mint);font-size:.7rem;top:7px;}
.cex{background:var(--surface2);border:1px solid var(--line2);border-radius:11px;padding:12px 14px;margin:13px 0;}
.cex-t{font-size:.87rem;font-weight:800;color:var(--amber);margin-bottom:9px;}

<script>
function mc(q,c,a,e){return{k:'mc',q:q,c:c,a:a,e:e};}
function sa(q,a,e){return{k:'sa',q:q,a:a,e:e};}
var CUR=[// ── 1주: 화성 기초 I ──
{d:1,wk:1,ph:'화성 기초',t:'화음의 종류 — 3·7화음',lead:'화음마다 색과 역할이 달라요. 오늘은 기본 화음 10종을 귀와 손으로 익혀요.',concept:'<p><b>화음</b>은 밑음(근음)에서 <b>3도씩</b> 쌓은 음의 묶음이에요. 3도 둘을 쌓으면 <b>3화음</b>, 하나 더 쌓아 7도까지면 <b>7화음</b>이 됩니다. 어떤 3도(장3도=4반음 / 단3도=3반음)를 어떤 순서로 쌓느냐가 화음의 <b>질(質)</b>과 색을 결정해요.</p><h4>3화음 4종</h4><table class="ctbl"><tr><th>화음</th><th>쌓기</th><th>구성(도수)</th><th>색 · 자리</th></tr><tr><td>장3화음</td><td>장3+단3</td><td>1·3·5</td><td>밝고 안정 · I·IV·V</td></tr><tr><td>단3화음</td><td>단3+장3</td><td>1·♭3·5</td><td>어둡고 서정 · ii·iii·vi</td></tr><tr><td>증3화음</td><td>장3+장3</td><td>1·3·♯5</td><td>불안·부유(대칭)</td></tr><tr><td>감3화음</td><td>단3+단3</td><td>1·♭3·♭5</td><td>긴장·불안정 · vii°</td></tr></table><h4>7화음 5종</h4><p class="warn">이름 짓는 방식이 달라요 — <b>3화음</b>은 <b>음의 개수</b>(triad, 셋)이고, <b>7화음</b>부터는 <b>가장 넓은 음정</b>이 이름이 됩니다(seventh chord). 그래서 9·11·13화음도 최상단 음정으로 불러요.</p><table class="ctbl"><tr><th>화음</th><th>구성(도수)</th><th>색 · 쓰임</th></tr><tr><td>maj7</td><td>1·3·5·7</td><td>세련·부유 · I·IV</td></tr><tr><td>7 <span style="opacity:.7">= V7</span></td><td>1·3·5·♭7</td><td>해결 요구 · V</td></tr><tr><td>m7</td><td>1·♭3·5·♭7</td><td>부드러운 단 · ii·vi</td></tr><tr><td>m7♭5</td><td>1·♭3·♭5·♭7</td><td>반감7 · ii°·vii</td></tr><tr><td>dim7</td><td>1·♭3·♭5·♭♭7</td><td>감7 · 대칭 · 고긴장</td></tr></table><p><b>해석 · </b>3화음의 밝기는 <b>3음</b>(장/단)이 가르고, 안정/불안은 <b>5음</b>(완전/증/감)이 가릅니다.</p><h4>대칭 구조란 — 무엇이 대칭인가</h4><p><b>쌓인 음정이 전부 같다</b>는 뜻이에요. 그러면 <b>옥타브가 균등하게 나뉘어</b> 어느 음도 뿌리로 서지 못합니다. 그래서 어느 음을 밑에 두어도 같은 화음이 됩니다.</p><table class="ctbl"><tr><th>화음</th><th>쌓인 음정</th><th>결과</th></tr><tr><td>증3화음</td><td><b>장3도 + 장3도</b> (4+4반음)</td><td>C–E–G♯ = E–G♯–C = G♯–C–E — 셋 다 같은 소리. 옥타브(12)를 <b>3등분</b>. 서로 다른 증3화음은 <b>4개</b>뿐.</td></tr><tr><td>감7화음</td><td><b>단3도 ×3</b> (3+3+3반음)</td><td>C–E♭–G♭–B♭♭ 어느 음을 근음 삼아도 같은 모양. 옥타브를 <b>4등분</b>. 서로 다른 감7화음은 <b>3개</b>뿐.</td></tr><tr><td>온음음계</td><td>장2도만 쌓음</td><td>같은 원리 — 근음이 서지 않아 부유한다. 드뷔시.</td></tr></table><p class="warn">근음이 모호하다는 건 <b>어느 음이 뿌리인지 소리로 판단할 수 없다</b>는 뜻이에요. 장3화음은 완전5도가 뿌리를 가리키는데, 대칭 화음엔 그 5도가 없습니다. 그래서 <b>어느 조로든 갈 수 있는 문</b>이 되어 반음계·전조의 경첩으로 쓰여요.</p><div class="cex"><div class="cex-t">🎧 예시 — 화음의 질 (근음 C)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playChord([60,64,67],1.3)">장3화음</button><button class="cex-b" onclick="ac();playChord([60,63,67],1.3)">단3화음</button><button class="cex-b" onclick="ac();playChord([60,64,68],1.3)">증3화음</button><button class="cex-b" onclick="ac();playChord([60,63,66],1.3)">감3화음</button><button class="cex-b" onclick="ac();playChord([60,64,67,71],1.4)">maj7</button><button class="cex-b" onclick="ac();playChord([60,64,67,70],1.4)">딸림7</button></div><div class="cex-d">3음(장/단)이 밝기를, 5음(완전/증/감)이 안정을 가릅니다. 증·감의 부유·긴장을 귀로 구별해보세요.</div></div>'+stfBlock('3화음 4종 (근음 C)',[[60,64,67],[60,63,67],[60,63,66],[60,64,68]],['C','Cm','C\u00b0','C+'],'3음이 밝기를, 5음이 안정을 가른다. 왼쪽 둘은 완전5도, 오른쪽 둘은 감\u00b7증5도.')+'',think:['증3화음은 장3도만, 감7화음은 단3도만 쌓여 옥타브를 균등 분할해요. 근음이 서지 않는 소리는 왜 어디로든 갈 수 있는 문이 될까?','같은 장3화음이라도 배치·악기에 따라 전혀 다르게 들려요. 화음의 질 말고 색을 만드는 요인을 세 가지만 꼽아보기.'],listen:['바그너 「트리스탄과 이졸데」 전주곡 (첫 3분)','첫 화음 하나가 여는 갈망의 세계. 이름 붙이지 말고, 그 화음이 몸 어디에 닿는지만 느껴보세요.'],read:[
'장3화음 1-3-5 (장3+단3): 밝고 안정 · I·IV·V','단3화음 1-♭3-5: 어둡고 서정 · ii·iii·vi','증3화음 1-3-♯5: 불안·부유','감3화음 1-♭3-♭5: 긴장·불안정 · vii°','maj7 1-3-5-7: 세련·부유 / 7(=V7) 1-3-5-♭7: 해결 요구','m7 / m7♭5(반감7) / dim7(감7·대칭)'],

{d:2,wk:1,ph:'화성 기초',t:'화성 기능 T–S–D',lead:'모든 화음은 셋 중 하나의 역할을 해요. 이 밀고 당김이 조성음악의 엔진.',concept:'<p>화음은 저마다 <b>역할(기능)</b>이 있어요. 이 역할의 밀고 당김이 조성음악을 굴리는 <b>엔진</b>입니다.</p><table class="ctbl"><tr><th>기능</th><th>대표 화음</th><th>느낌</th><th>경향</th></tr><tr><td>토닉 T</td><td>I · vi</td><td>집 · 안정 · 도착</td><td>어디로든</td></tr><tr><td>서브도미넌트 S</td><td>IV · ii</td><td>떠남 · 준비</td><td>→ D</td></tr><tr><td>도미넌트 D</td><td>V · vii°</td><td>긴장 · 해결 요구</td><td>→ T (강하게)</td></tr></table><svg class="cdia" viewBox="0 0 300 165"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a7b4bc"/></marker></defs><path d="M80,100 Q102,54 126,56" fill="none" stroke="#a7b4bc" stroke-width="2" marker-end="url(#ar)"/><path d="M174,56 Q198,54 220,100" fill="none" stroke="#a7b4bc" stroke-width="2" marker-end="url(#ar)"/><path d="M212,126 L90,126" fill="none" stroke="#ff8575" stroke-width="2.6" marker-end="url(#ar)"/><circle cx="60" cy="118" r="26" fill="rgba(111,233,205,.16)" stroke="#6fe9cd" stroke-width="2"/><text x="60" y="124" text-anchor="middle" font-size="18" font-weight="800" fill="#6fe9cd">T</text><circle cx="150" cy="42" r="26" fill="rgba(162,179,222,.16)" stroke="#a2b3de" stroke-width="2"/><text x="150" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="#a2b3de">S</text><circle cx="240" cy="118" r="26" fill="rgba(255,133,117,.16)" stroke="#ff8575" stroke-width="2"/><text x="240" y="124" text-anchor="middle" font-size="18" font-weight="800" fill="#ff8575">D</text><text x="150" y="152" text-anchor="middle" font-size="9.5" fill="#ff8575" font-weight="700">D→T = 가장 강한 해결</text></svg><p><b>해석 · </b>분석의 첫 질문은 늘 <b>"지금 어느 기능인가?"</b>예요. 화음 이름보다 기능이 먼저입니다. 예로 Dm(ii)과 F(IV)는 다른 화음이지만 <b>둘 다 S</b> — 같은 "떠남"의 역할이에요. <b>토니시제이션</b>은 부속화음(V/V 등)으로 잠깐 다른 음을 으뜸음처럼 강조하되 조는 유지하는 것입니다.</p><div class="cex"><div class="cex-t">🎧 예시 — T–S–D 진행 (C장조)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[60,64,67],[65,69,72],[67,71,74],[60,64,67]],0.8)">I–IV–V–I</button></div><div class="cex-d">토닉(도미솔) → 서브도미넌트(파라도) → 도미넌트(솔시레) → 토닉. V의 긴장이 I로 풀리는 순간에 귀를 두세요.</div></div><h4>기능화성의 반대말은 무엇인가</h4><p>하나로 떨어지는 반대말은 없어요. <b>무엇을 부정하느냐</b>에 따라 층위가 갈립니다.</p><table class="ctbl"><tr><th>층위</th><th>대립쌍</th></tr><tr><td>조성이 있나</td><td><b>조성</b> tonality \u2194 <b>무조</b> atonality</td></tr><tr><td>화음이 기능하나</td><td><b>기능화성</b> \u2194 <b>비기능화성</b> non-functional</td></tr><tr><td>화음이 무엇으로 존재하나</td><td><b>기능적</b> \u2194 <b>색채적</b> coloristic</td></tr></table><p class="warn">드뷔시는 <b>조성 안에 있으면서 기능을 흐린</b> 것이라 무조가 아니에요. 쇤베르크 후기의 무조와는 다른 자리입니다. 실무에서는 「기능화성 \u2194 색채화성」으로 대비하는 게 가장 통해요.</p>'+stfBlock('T\u2013S\u2013D\u2013T',[[60,64,67],[65,69,72],[67,71,74],[60,64,67]],['I','IV','V','I'],'V의 시(B)가 도(C)로, 파(F)가 미(E)로 좁혀지며 I에 도착한다.')+'',think:['T–S–D를 중력에 비유한다면, 무중력처럼 기능이 흐려진 음악(드뷔시·명상 음악)은 무엇으로 흐름을 만들까? (힌트 — 음색·음역·밀도·시간. 22일차에서 자세히 다뤄요)','한 곡에서 D가 유난히 길게 끄는 순간을 찾아, 작곡가가 해결을 미룬 이유를 추측해보기.'],listen:['베토벤 교향곡 5번 4악장 도입','어둠(3악장 끝)에서 빛(C장조)으로 문이 열리는 순간 — 해결이 몸에 주는 안도를 그대로 겪어보세요.'],read:[

{d:3,wk:1,ph:'화성 기초',t:'종지 (Cadence)',lead:'악구가 어떻게 끝나는가. 문장의 마침표·물음표·쉼표예요.',concept:'<p>악구가 <b>어떻게 끝나는가</b>를 보는 게 종지예요. 문장의 마침표·물음표·쉼표처럼, 종결 방식이 음악의 <b>숨과 구획</b>을 만들어요.</p><table class="ctbl"><tr><th>종지</th><th>진행</th><th>강도</th><th>느낌</th></tr><tr><td>완전정격 PAC</td><td>V→I (근음+소프라노 으뜸)</td><td>★★★</td><td>확실한 마침</td></tr><tr><td>불완전정격 IAC</td><td>V→I (전위·3·5음)</td><td>★★</td><td>약한 마침</td></tr><tr><td>반종지 HC</td><td>…→V</td><td>★</td><td>쉼표·질문</td></tr><tr><td>변격</td><td>IV→I</td><td>★★</td><td>아멘·여운</td></tr><tr><td>위종지</td><td>V→vi</td><td>—</td><td>끝날 듯 안 끝남</td></tr></table><p><b>해석 · </b>PAC는 "완전히 끝났다"는 도착점이라 <b>악절·악장의 경계</b>를 만들어요. 반종지는 선행구 끝에서 "질문"을 남겨 후속구를 부르고, 위종지는 도착을 미뤄 곡을 끌고 갑니다. 종지의 <b>강도 위계</b>를 알아야 어디서 크게, 어디서 살짝 숨 쉴지 정해요.</p><div class="cex"><div class="cex-t">🎧 예시 — 종지 비교 (C장조)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[67,71,74],[60,64,67]],0.95)">정격 V→I</button><button class="cex-b" onclick="ac();playSeq([[67,71,74],[69,72,76]],0.95)">위종지 V→vi</button><button class="cex-b" onclick="ac();playSeq([[65,69,72],[60,64,67]],0.95)">변격 IV→I</button></div><div class="cex-d">정격은 확실히 닫히고, 위종지(V→vi)는 끝날 듯 안 끝나며, 변격(IV→I)은 아멘처럼 부드러워요. 종결감의 차이를 들어보세요.</div></div>'+stfBlock('종지 4종',[[67,71,74],[60,64,67],[67,71,74],[69,72,76]],['V','I','V','vi'],'앞 둘은 정격(닫힘), 뒤 둘은 위종지(끝날 듯 안 끝남).')+'',think:['위종지가 연달아 나오면 청중의 기대는 어떻게 변할까? 연주자는 그 지연을 어디까지 밀 수 있을까?','문장의 마침표·쉼표·물음표를 종지에 대응시켜보고, 대응이 안 되는 종지가 있는지 생각해보기.'],listen:['모차르트 「아베 베룸 코르푸스」','종지마다 내려앉는 숨. 어디서 함께 숨을 쉬게 되는지, 몸이 먼저 알아요.'],read:[
'정격 V→I: 가장 확실한 마침. PAC(근음+소프라노 으뜸=최강)/IAC(전위·3·5음=약함)','반종지 HC: V에서 멈춤 = 쉼표·질문','변격 IV→I: 아멘·부드러운 여운','위종지 V→vi: 끝날 듯 안 끝나는 속임수','피카르디 3도: 단조 곡 마지막만 장3화음 = 빛나는 종결'],

{d:4,wk:1,ph:'화성 기초',t:'부가·확장·변화 화음(텐션)',lead:'기본 화음에 색을 더하는 음들. 재즈·낭만의 풍부함이 여기서.',concept:'<p>기본 3·7화음 위에 음을 더 얹어 <b>색과 긴장</b>을 더하는 게 텐션이에요. 재즈·낭만의 풍부함이 여기서 나옵니다.</p><table class="ctbl"><tr><th>종류</th><th>얹는 음</th><th>효과</th></tr><tr><td>6 · add9 · 6/9</td><td>6, 9 (7 없이)</td><td>투명 · 풍성</td></tr><tr><td>9 · 11 · 13</td><td>상위 텐션</td><td>풍성 · 긴장 고조</td></tr><tr><td>7♭9 · 7♯9</td><td>변형 9도</td><td>단조 해결 · 블루지</td></tr><tr><td>7♯11 · 7♭13</td><td>변형 11·13</td><td>부유 · 어두운 딸림</td></tr><tr><td>7alt</td><td>♭9·♯9·♯11·♭13</td><td>최대 긴장 → i</td></tr></table><p><b>해석 · </b>텐션은 화음의 <b>기능은 유지</b>하면서 색만 짙게 해요. 딸림7에 텐션이 많을수록 해결을 향한 긴장이 커집니다. add9·6/9처럼 7 없는 텐션은 "긴장 없는 색"이라 종지의 포근한 여운에 좋아요.</p><div class="cex"><div class="cex-t">🎧 예시 — 딸림7의 긴장 (근음 C)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playChord([60,64,67,70],1.5)">C7</button><button class="cex-b" onclick="ac();playChord([60,64,67,70,61],1.5)">C7♭9</button><button class="cex-b" onclick="ac();playChord([60,64,67,70,66],1.5)">C7♯11</button></div><div class="cex-d">기본 딸림7에서 텐션이 늘수록 긴장이 커지는 걸 들어보세요. 이 긴장이 해결(→I)을 강하게 원해요.</div></div>'+stfBlock('7화음 5종 (근음 C)',[[60,64,67,71],[60,64,67,70],[60,63,67,70],[60,63,66,70],[60,63,66,69]],['maj7','7','m7','m7\u266d5','\u00b07'],'\ub9e8 오른쪽 감7은 단3도만 쌓여 어느 음도 뿌리로 서지 않는다.')+'',think:['텐션이 많아질수록 긴장이 커진다면, 텐션이 포화되면(모든 음이 울리면) 오히려 긴장이 사라질까? 왜?','add9의 투명함이 어울리는 장면과 7♭9의 어두움이 어울리는 장면을 각각 하나씩 상상해 묘사해보기.'],listen:['라벨 「죽은 왕녀를 위한 파반」','텐션이 드리우는 그늘과 부드러움 — 슬픔인지 다정함인지 정하지 말고 머물러보세요.'],read:[
'6/add9/6-9: 7 없이 색만 더함','9·11·13: 딸림 위 상위 텐션(풍성·긴장)','7♭9/7♯9: 단조 해결·블루지','7♯11: 리디안♭7·부유 / 7♭13: 어두운 딸림','7alt(♭9·♯9·♯11·♭13): 최대 긴장 → i (재즈 리하모니)'],

{d:5,wk:1,ph:'화성 기초',t:'전위·자리표(Figured Bass)',lead:'같은 화음도 어느 음이 베이스냐로 무게가 달라져요. 자리표로 읽어요.',concept:'<p>같은 화음도 <b>어느 음이 베이스</b>냐로 무게와 안정감이 달라져요. 이걸 <b>자리표(figured bass)</b>로 읽습니다.</p><table class="ctbl"><tr><th>위치</th><th>베이스</th><th>자리표</th></tr><tr><td>3화음 기본</td><td>근음</td><td>5/3 (생략)</td></tr><tr><td>3화음 1전위</td><td>3음</td><td>6</td></tr><tr><td>3화음 2전위</td><td>5음</td><td>6/4</td></tr><tr><td>7화음 기본</td><td>근음</td><td>7</td></tr><tr><td>7화음 1전위</td><td>3음</td><td>6/5</td></tr><tr><td>7화음 2전위</td><td>5음</td><td>4/3</td></tr><tr><td>7화음 3전위</td><td>7음</td><td>4/2</td></tr></table><p><b>해석 · </b>기본 위치(근음 베이스)가 가장 안정적이고, <b>6/4(2전위)</b>는 불안정해 종지 6/4처럼 해결로 이어져요. 자리표는 <b>베이스 라인을 매끄럽게</b> 만드는 도구 — I → V6 → I는 베이스가 도-시-도로 도약 없이 흐릅니다.</p><div class="cex"><div class="cex-t">🎧 예시 — C장3화음 전위 (베이스 변화)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playChord([60,64,67],1.4)">근음 (5/3)</button><button class="cex-b" onclick="ac();playChord([64,67,72],1.4)">1전위 (6)</button><button class="cex-b" onclick="ac();playChord([67,72,76],1.4)">2전위 (6/4)</button></div><div class="cex-d">베이스가 근음→3음(미)→5음(솔)로 바뀌며 무게가 달라져요. 2전위(6/4)의 불안정함이 해결을 부릅니다.</div></div>',think:['같은 화음의 전위만 바꿔도 베이스 선율이 생겨요. 화성이 선율이 되는 순간이란 무엇일까?','6/4가 유독 불안정한 이유를 배음(음향)의 관점에서 설명해본다면?'],listen:['바흐 「G선상의 아리아」','베이스가 한 걸음씩 내려가는 길을 눈 감고 따라 걷기. 선율보다 낮은 목소리를 먼저.'],read:[

{d:6,wk:1,ph:'화성 기초',t:'복습 — 화성 기초 I',lead:'1주차를 문제로 다져요. 틀린 건 해당 날로 돌아가 다시.',concept:'<p><b>1주차 종합.</b> 화음의 질 → 기능(T-S-D) → 종지 → 텐션 → 전위. 이 다섯이 <b>화성 읽기의 기본 문법</b>이에요.</p><table class="ctbl"><tr><th>개념</th><th>핵심 질문</th></tr><tr><td>화음의 질</td><td>장/단/증/감? 3·5·7음의 성격은?</td></tr><tr><td>기능</td><td>지금 T·S·D 중 무엇? (집/떠남/긴장)</td></tr><tr><td>종지</td><td>어떻게 끝나나? 강도는?</td></tr><tr><td>텐션</td><td>색을 더하나, 긴장을 더하나?</td></tr><tr><td>전위</td><td>누가 베이스? 안정/불안?</td></tr></table><div class="cnote"><b>복습법 · </b>좋아하는 곡 한 악구를 골라 이 다섯 질문을 한 장에 적어보세요. "화음 이름"이 아니라 "기능과 역할"로 읽는 눈이 화성 분석의 시작이에요.</div>',think:['이번 주 다섯 개념 중 서로 가장 깊게 연결된 두 개를 골라 하나의 문장으로 잇기.','화성을 전혀 모르는 사람에게 T–S–D를 30초 안에 비유로 설명한다면 어떤 비유를 쓸까?'],listen:['쇼팽 전주곡 e단조 Op.28-4','왼손 화성이 반음씩 무너져 내리는 슬픔 — 오늘만은 분석하지 말고 그냥 무너져보세요.'],read:[
'화음 10종·기능 T-S-D·종지·텐션·자리표를 한 번에 점검','핵심: 기능은 "지금 어디쯤(떠남/긴장/도착)?"','종지는 "어떻게 끝나나", 자리표는 "누가 베이스냐"'],

{d:7,wk:2,ph:'화성 기초',t:'화성 시퀀스',lead:'같은 화음 패턴이 한 칸씩 규칙적으로 이동. 계단처럼 방향·추진력을 만들어요.',concept:'<p><b>시퀀스</b>는 같은 화성 <b>모형</b>이 일정 간격으로 규칙적으로 반복 이동하는 것이에요. <b>방향</b>(상행/하행)과 <b>간격</b>(5도·3도·2도)이 색과 추진력을 결정합니다.</p><table class="ctbl"><tr><th>시퀀스</th><th>근음 이동</th><th>특징</th></tr><tr><td>하행 5도</td><td>5도씩 ↓</td><td>가장 강한 추진 (비발디·바흐)</td></tr><tr><td>상행 5도</td><td>5도씩 ↑</td><td>떠오름 · 덜 흔함</td></tr><tr><td>하행 5-6<br><span class="ten">로마네스카</span></td><td>4↓5↑ 교대</td><td>부드러운 하행 (파헬벨)</td></tr><tr><td>하행 3도</td><td>3도씩 ↓</td><td>포근 · 노래하는</td></tr><tr><td>로살리아</td><td>온음 위 통째 반복</td><td>기계적 반복(별칭)</td></tr></table><svg class="cdia" viewBox="0 0 320 96"><defs><marker id="a7" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a7b4bc"/></marker></defs><circle cx="42" cy="40" r="20" fill="rgba(111,233,205,.14)" stroke="#6fe9cd" stroke-width="1.6"/><text x="42" y="46" text-anchor="middle" font-size="13" font-weight="800" fill="#6fe9cd">vi</text><circle cx="134" cy="40" r="20" fill="rgba(111,233,205,.14)" stroke="#6fe9cd" stroke-width="1.6"/><text x="134" y="46" text-anchor="middle" font-size="13" font-weight="800" fill="#6fe9cd">ii</text><circle cx="226" cy="40" r="20" fill="rgba(111,233,205,.14)" stroke="#6fe9cd" stroke-width="1.6"/><text x="226" y="46" text-anchor="middle" font-size="13" font-weight="800" fill="#6fe9cd">V</text><circle cx="300" cy="40" r="20" fill="rgba(111,233,205,.14)" stroke="#6fe9cd" stroke-width="1.6"/><text x="300" y="46" text-anchor="middle" font-size="13" font-weight="800" fill="#6fe9cd">I</text><path d="M64,40 L112,40" stroke="#a7b4bc" stroke-width="2" marker-end="url(#a7)"/><path d="M156,40 L204,40" stroke="#a7b4bc" stroke-width="2" marker-end="url(#a7)"/><path d="M246,40 L280,40" stroke="#ff8575" stroke-width="2.4" marker-end="url(#a7)"/><text x="160" y="82" text-anchor="middle" font-size="9.5" fill="#75818b">근음이 5도씩 하행 (A→D→G→C) · 가장 강한 추진</text></svg><p><b>해석 · </b>시퀀스는 <b>모형의 첫 등장</b>만 잡으면 나머지가 예측돼요. 보통 <b>2~3회</b> 반복하며 긴장을 적재하다 종지·정점으로 풀립니다. 하행 5도가 조성 진행의 엔진인 이유는 매 단계가 V→I의 연쇄이기 때문이에요.</p><div class="cex"><div class="cex-t">🎧 예시 — 하행 5도 시퀀스 (C장조)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[69,72,76],[62,65,69],[67,71,74],[60,64,67]],0.72)">vi–ii–V–I</button></div><div class="cex-d">근음이 A→D→G→C로 5도씩 하행해요. 매 단계가 V→I의 연쇄라 강한 추진이 느껴집니다.</div></div>',think:['하행 5도 시퀀스가 조성 음악의 엔진이라면, 순환이 없는 음악은 무엇으로 앞으로 나아갈까?','시퀀스의 반복이 지루함이 아니라 추진이 되는 조건은 무엇일까?'],listen:['비발디 「사계」 겨울 1악장','시퀀스가 몰아칠 때 몸이 앞으로 쏠리는 감각. 추진이란 무엇인지 몸으로.'],read:[

{d:9,wk:2,ph:'화성 기초',t:'반음계 화성 I',lead:'온음계 밖의 음을 빌려 색을 더해요. 부속·차용·나폴리·증6.',concept:'<p>온음계(도레미) <b>밖의 음</b>을 빌려 색과 긴장을 더하는 화성이에요. 기능은 대개 유지하되 그늘·경이를 만듭니다.</p><table class="ctbl"><tr><th>화음</th><th>구성·특징</th><th>효과</th></tr><tr><td>부속화음<br><span class="ten">V/V</span></td><td>딸림의 딸림 (이차 딸림)</td><td>그 화음을 잠깐 토닉처럼 삼음(토니시제이션)</td></tr><tr><td>차용화음<br><span class="ten">모달 믹스처</span></td><td>반대 모드에서 빌림(장조에 iv·♭VI)</td><td>그늘 · 애수</td></tr><tr><td>나폴리 6화음<br><span class="ten">♭II⁶</span></td><td>2음 반음↓ 장3화음(1전위)</td><td>종지 직전 어둠</td></tr><tr><td>증6화음<br><span class="ten">It·Fr·Ger</span></td><td>바깥으로 반음 확장</td><td>V(또는 I6/4)로 강하게 해결</td></tr></table><p><b>해석 · </b>이 화음들은 대부분 <b>도미넌트 또는 그 준비</b>로 기능해요. 특히 독일 증6(Ger⁶)은 소리가 <b>V⁷과 같아서</b> 이명동음 전조의 문이 됩니다. 나폴리·증6은 종지를 극적으로 물들이는 장치예요.</p><h4>왜 이런 이름인가</h4><table class="ctbl"><tr><th>용어</th><th>풀이</th></tr><tr><td><b>나폴리 6화음</b> ♭II⁶</td><td>2음을 반음 내린 장3화음. <b>1전위</b>로 쓰여서 「6화음」이에요 (C장조의 D♭–F–A♭를 F를 밑에 두고). 17세기 나폴리 악파가 즐겨 써서 붙은 이름.</td></tr><tr><td><b>증6화음</b> It·Fr·Ger</td><td>밑음과 윗음이 <b>증6도</b>를 이루는 화음. 그 둘이 바깥으로 반음씩 벌어져 V의 근음으로 <b>수렴</b>합니다. 셋의 차이는 <b>가운데에 무엇이 끼는가</b>예요 — 이탈리아는 3음, 프랑스는 증4도가 더, 독일은 완전5도가 더 붙습니다.</td></tr><tr><td><b>이명동음 전조</b></td><td>소리는 같은데 <b>이름을 바꿔 적어</b> 다른 조로 넘어가는 것. 독일 증6과 V⁷은 <b>건반에서 같은 소리</b>라, 어느 쪽으로 읽느냐에 따라 갈 곳이 달라져요.</td></tr><tr><td><b>트라이톤</b></td><td>증4도·감5도(반음 6개). 옥타브의 <b>정확히 절반</b>이라 대칭이고, V⁷의 3음–♭7음 사이에 생겨 해결을 요구합니다.</td></tr></table><div class="cex"><div class="cex-t">🎧 예시 — 부속화음 V/V — 토니시제이션</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[62,66,69,72],[67,71,74],[60,64,67]],0.8)">D7→G→C</button></div><div class="cex-d">D7(V/V)이 G를 잠깐 으뜸음처럼 들리게 해요(F♯의 신선함). 조는 C 그대로인데 색이 열립니다.</div></div>'+stfBlock('나폴리와 증6',[[65,68,73],[68,72,74,78],[67,71,74]],['\u266dII\u2076','Ger\u2076','V'],'\ub098폴리는 2음을 반음 내려 1전위로, 증6은 바깥 두 음이 반음씩 벌어져 V로 수렴한다.')+'',think:['부속화음은 잠깐 다른 조의 문을 여는 장치예요. 문을 열고 들어가지 않는(해결하지 않는) 부속화음은 어떤 효과를 낼까?','나폴리·증6처럼 어두운 색이 종지 직전에 자주 오는 이유를 기대의 관점에서 설명해보기.'],listen:['슈베르트 「마왕」','반음계가 만드는 공포의 색. 말발굽 리듬 위에서 화성이 조여오는 방식.'],read:[

{d:10,wk:2,ph:'화성 기초',t:'반음계 화성 II',lead:'더 진한 색 — 중3도·공통음 감7·옴니버스.',concept:'<p>더 진한 반음계 색 — <b>기능화성만으로는 안 풀리는</b> 진행들이에요.</p><table class="ctbl"><tr><th>화음/진행</th><th>특징</th></tr><tr><td>반음계 중3도<br><span class="ten">Chromatic Mediant</span></td><td>3도 관계·공통음 적음·색 확 다름 (영화적 경이)</td></tr><tr><td>공통음 감7<br><span class="ten">ct°7</span></td><td>한 음 공유 감7 · 장식적 긴장</td></tr><tr><td>옴니버스</td><td>위는 올라가고 아래는 내려가며 <b>반음씩 벌어짐</b>. 여러 조를 스쳐 지나 붙은 이름</td></tr></table><p><b>해석 · </b>C장 ↔ E장처럼 3도 떨어지고 색이 확 열리는 진행은 딸림으로 설명이 안 돼요. 그래서 <b>신리만 변형이론(PLR, 44일)</b>이 이 자리를 메웁니다 — 공통음을 고정점으로, 움직이는 한 음을 변화의 주역으로 보는 관점이에요.</p><div class="cex"><div class="cex-t">🎧 예시 — 반음계 중3도 (C장 → E장)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[60,64,67],[64,68,71]],1.1)">C → E</button></div><div class="cex-d">3도 떨어지고 공통음(미)만 남아 색이 확 열리는 "경이". 영화음악의 신비로운 전환이에요.</div></div>',think:['중3도 전환의 경이는 공통음 하나가 버티고 색이 확 바뀌는 데서 와요. 이 원리를 조명·무대 전환에 비유해본다면?','기능화성으로 설명이 안 되는 진행을 만나면 분석가는 무엇을 먼저 물어야 할까?'],listen:['존 윌리엄스 「E.T.」 플라잉 테마','중3도가 열어젖히는 경이 — 자전거가 떠오르는 순간 화성도 함께 떠올라요.'],read:[

{d:11,wk:2,ph:'화성 기초',t:'전조 (Modulation)',lead:'곡 중간에 조가 바뀌는 것. 어떻게 갈아타느냐가 드라마의 분기점.',concept:'<p>곡 중간에 <b>조</b>가 바뀌는 것. 어떻게 갈아타느냐가 드라마의 <b>분기점</b>이에요.</p><table class="ctbl"><tr><th>방식</th><th>방법</th><th>느낌</th></tr><tr><td>온음계 피벗</td><td>공통화음을 경첩으로</td><td>가장 매끄러움</td></tr><tr><td>반음계</td><td>부속·증6로</td><td>갑자기</td></tr><tr><td>이명동음</td><td>같은 소리 다른 이름(Ger⁶=V⁷)</td><td>먼 조 순간이동</td></tr><tr><td>공통음</td><td>한 음만 남기고 점프</td><td>신비</td></tr><tr><td>직접(악구)</td><td>준비 없이 새 조 시작</td><td>팝 후렴 반음 상승</td></tr></table><svg class="cdia" viewBox="0 0 320 108"><rect x="8" y="26" width="120" height="52" rx="9" fill="rgba(111,233,205,.12)" stroke="#6fe9cd" stroke-width="1.5"/><text x="68" y="57" text-anchor="middle" font-size="13" font-weight="800" fill="#6fe9cd">조 A</text><rect x="192" y="26" width="120" height="52" rx="9" fill="rgba(255,133,117,.12)" stroke="#ff8575" stroke-width="1.5"/><text x="252" y="57" text-anchor="middle" font-size="13" font-weight="800" fill="#ff8575">조 B</text><circle cx="160" cy="52" r="26" fill="rgba(162,179,222,.18)" stroke="#a2b3de" stroke-width="1.8"/><text x="160" y="49" text-anchor="middle" font-size="9" fill="#a2b3de">공통</text><text x="160" y="60" text-anchor="middle" font-size="9" fill="#a2b3de">화음</text><path d="M128,52 L136,52" stroke="#a7b4bc" stroke-width="2"/><path d="M184,52 L190,52" stroke="#a7b4bc" stroke-width="2"/><text x="160" y="98" text-anchor="middle" font-size="9.5" fill="#75818b">공통화음을 경첩 삼아 매끄럽게 (피벗 전조)</text></svg><p><b>해석 · </b>전조를 들을 때는 "<b>얼마나 매끄러운가(피벗) vs 갑작(직접)</b>"으로 드라마 강도를 읽어요. <b>근친조</b>(5도권 이웃·나란한조)일수록 자연스럽고, 먼 조일수록 충격입니다. <b>나란한조</b>는 <b>조표가 같은</b> 장·단조 짝이에요(C장 ↔ a단). <b>같은으뜸음조</b>는 으뜸음이 같고 조표가 다른 짝(C장 ↔ c단)이라 서로 달라요. 피벗 화음은 두 조 모두에 속해 경첩 역할을 해요.</p><div class="cex"><div class="cex-t">🎧 예시 — 피벗 전조 C장조 → G장조</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[60,64,67],[69,72,76],[62,66,69,72],[67,71,74]],0.85)">C→Am→D7→G</button></div><div class="cex-d">C(I) → Am(경첩: C의 vi = G의 ii) → D7(G의 V) → G. Am을 경첩 삼아 매끄럽게 G조로 넘어가요.</div></div>',think:['피벗 전조가 매끄러운 이유는 두 조에 다 속한 화음 때문이에요. 사람 관계에서 피벗 같은 존재를 떠올려 비유를 완성해보기.','먼 조로 갑자기 이동한 곡을 하나 떠올려, 그 순간 몸에서 무엇이 느껴졌는지 적어보기.'],listen:['슈베르트 즉흥곡 G♭장조 D.899-3','조가 미끄러지는 순간의 아득함. 어디서 땅이 바뀌었는지 몸이 먼저 알아차려요.'],read:[
'온음계적(피벗): 공통화음을 경첩으로 — 가장 매끄러움','반음계적: 부속·증6로 갑자기','이명동음: 같은 소리 다른 이름(Ger⁶=V⁷) — 먼 조 순간이동','공통음: 한 음만 남기고 점프','직접·악구: 준비 없이 새 조 시작(팝 후렴 반음 올리기)'],

{d:12,wk:2,ph:'화성 기초',t:'지속음·오스티나토 + 복습',lead:'반복되는 토대 위에 짓기. 그리고 화성 기초 II 점검.',concept:'<p>반복되는 <b>토대</b> 위에 음악을 짓는 기법이에요. 그리고 2주차 전체를 정리합니다.</p><table class="ctbl"><tr><th>기법</th><th>구조</th><th>효과</th></tr><tr><td>페달 포인트</td><td>한 음 길게, 위 화음 자유</td><td>긴장 적재(도미넌트 페달)</td></tr><tr><td>오스티나토</td><td>음형을 집요하게 반복</td><td>최면·축적 (볼레로)</td></tr><tr><td>파사칼리아</td><td>베이스 선율 반복</td><td>변주의 토대</td></tr><tr><td>샤콘느</td><td>화성 순환 반복</td><td>변주의 토대</td></tr></table><div class="cex"><div class="cex-t">🎧 예시 — 도미넌트 페달</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[43,67,71,74],[43,65,69,72],[43,67,71,74],[43,60,64,67]],0.7)">솔 페달 + 위 화음</button></div><div class="cex-d">베이스에 딸림음(솔)을 길게 깔고 위 화음이 자유롭게 움직여요. 해결 직전 긴장이 적재됩니다.</div></div><div class="cnote"><b>2주차 복습 · </b>시퀀스(방향·간격) → 스키마타(관용 정형) → 반음계(부속·차용·나폴리·증6·중3도) → 전조(피벗~직접) → 지속음. 화성의 <b>색과 움직임</b>을 다루는 도구들이에요.</div>',think:['지속음 위에서 화성이 흐려질 때 우리는 무엇을 듣게 될까 — 명상 음악의 드론이 주는 효과와 비교해보기.','오스티나토의 반복이 최면이 되는 경우와 긴장이 되는 경우, 갈림길은 무엇일까?'],listen:['아르보 패르트 「Spiegel im Spiegel」','드론 위에 시간이 고이는 10분 — 명상하듯, 아무것도 기다리지 않고 들어보세요.'],read:[
'페달 포인트: 한 음 길게, 위 화음 자유(토닉/도미넌트 페달)','오스티나토: 음형을 집요하게 반복(볼레로)','바소 오스티나토/그라운드: 베이스 반복 + 윗성부 자유 변주','파사칼리아(베이스 선율 반복) vs 샤콘느(화성 순환 반복)'],
q:[mc('도착 직전 긴장을 적재하는 지속음은?',['토닉 페달','도미넌트 페달','이중 페달','없음'],1,'딸림음을 길게 깔아 해결 직전 긴장.'),

mc('시퀀스 하행 5도의 근음 이동은?',['3도씩','5도씩','2도씩','반음씩'],1,'복습: 하행 5도 = 가장 강한 추진.')],

{d:13,wk:3,ph:'선율·대위',t:'동기·선율 전개',lead:'짧은 씨앗(동기) 하나가 변형되며 곡 전체로 자라요.',concept:'<p>짧은 씨앗인 <b>동기</b> 하나가 여러 방식으로 <b>변형</b>되며 곡 전체로 자라요. <b>반복</b>은 통일성을, <b>변형</b>은 발전을 줍니다.</p><table class="ctbl"><tr><th>변형</th><th>설명</th></tr><tr><td>반복</td><td>그대로 다시</td></tr><tr><td>시퀀스</td><td>음정은 유지, 위치만 이동</td></tr><tr><td>전위(inversion)</td><td>방향 뒤집기 (올라가던 걸 내려가게)</td></tr><tr><td>역행(retrograde)</td><td>거꾸로 (끝에서 처음으로)</td></tr><tr><td>확대(augmentation)</td><td>음가를 2배로 늘림</td></tr><tr><td>축소(diminution)</td><td>음가를 절반으로</td></tr><tr><td>분할(fragmentation)</td><td>동기의 일부만 떼어 발전</td></tr></table><p><b>해석 · </b>베토벤 5번의 "따따따딴" 하나가 곡 전체를 짓는 원리예요. 마무리엔 특징을 조금씩 덜어내는 <b>청산(liquidation)</b>으로 긴장을 풀어요. "이 선율이 아까 그 동기의 무슨 변형인가?"를 늘 물으세요.</p><div class="cex"><div class="cex-t">🎧 예시 — 동기와 변형 (선율)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playMel([60,62,64],0.4)">원형 (도레미)</button><button class="cex-b" onclick="ac();playMel([60,58,56],0.4)">전위</button><button class="cex-b" onclick="ac();playMel([64,62,60],0.4)">역행</button><button class="cex-b" onclick="ac();playMel([60,62,64],0.85)">확대</button></div><div class="cex-d">도-레-미(원형) → 방향 뒤집기(전위) → 거꾸로(역행) → 음가 2배(확대). 같은 씨앗의 변형을 들어보세요.</div></div><p class="warn"><b>축소(diminution)는 두 가지 뜻이 있어요</b> \u2014 여기서 말한 <b>음가를 절반으로</b> 줄이는 변형과, 바로크의 <b>즉흥 장식 기법</b>(긴 음을 잘게 쪼개 꾸미는 것 \u2014 이탈리아 diminuzione, 영국 division)이 같은 이름을 씁니다. 문맥으로 갈라 보세요.</p><p><b>축은 둘이에요</b> \u2014 확대\u00b7축소는 <b>시간축</b> 변형이고, 전위\u00b7역행은 <b>음높이축</b> 변형입니다. 둘을 조합하면 12음 기법의 네 형태(원형\u00b7역행\u00b7전위\u00b7역행전위)가 나와요.</p><table class="ctbl"><tr><th>쓰이는 자리</th><th>내용</th></tr><tr><td>푸가의 스트레토</td><td>주제가 겹쳐 들어올 때 한 성부는 원형, 다른 성부는 확대형 \u2014 긴장이 폭발해요. 바흐 『푸가의 기법』이 집대성.</td></tr><tr><td>정선율 cantus firmus</td><td>르네상스 미사에서 테너가 원 선율을 <b>크게 확대해</b> 늘여 부르고 위 성부는 빠르게 움직인다. 확대형이 곡의 기둥.</td></tr><tr><td>소나타 코다</td><td>주제를 확대해 장엄하게 맺거나, 축소해 몰아붙인다.</td></tr></table>',think:['동기 하나로 곡 전체를 짓는 것과 선율을 계속 새로 쓰는 것 — 통일성과 다양성의 균형점은 어디일까?','좋아하는 곡의 핵심 동기를 하나 뽑아, 일곱 변형 중 무엇이 실제로 쓰였는지 추적해보기.'],listen:['베토벤 교향곡 5번 1악장','네 개의 음이 곡 전체가 되는 기적. 동기를 세지 말고 파도처럼 맞으세요.'],read:[
'변형: 반복·시퀀스·전위(방향 뒤집기)·역행(거꾸로)·확대(늘림)·축소(줄임)·분할','청산(쇤베르크): 특징 덜어내며 마무리','전개적 변주(브람스): 조금씩 계속 바꿈','포르트슈피눙: 짧은 동기를 실 잣듯 길게(바로크)'],
q:[mc('확대\u00b7축소는 무엇을 바꾸는 변형인가?',['음높이축','시간축','음색','짜임새'],1,'전위\u00b7역행이 음높이축 변형이라면 이쪽은 시간축이에요.'),
mc('바로크에서 diminution의 또 다른 뜻은?',['음가를 절반으로','긴 음을 잘게 쪼개는 즉흥 장식','조를 낮추기','성부를 줄이기'],1,'이탈리아 diminuzione, 영국 division \u2014 같은 이름의 다른 개념입니다.'),
mc('음정 방향을 위아래로 뒤집는 변형은?',['역행','전위','확대','분할'],1,'전위=inversion. 올라가던 걸 내려가게.'),
sa('음가를 2배로 늘려 동기를 느리게 펼치는 변형은?','확대 (Augmentation)','축소는 반대(음가 절반).'),

{d:14,wk:3,ph:'선율·대위',t:'악구 구조',lead:'선율이 어떻게 문장처럼 짜이는가 — 악절·문장·하이퍼미터.',concept:'<p>선율이 <b>문장</b>처럼 짜이는 방식이에요. 두 대표 틀 — 악절과 문장 — 을 구별하는 게 프레이징의 기초입니다.</p><table class="ctbl"><tr><th>틀</th><th>구조</th><th>느낌</th></tr><tr><td>악절(Period)</td><td>선행구(반종지) + 후속구(정격종지)</td><td>질문 → 대답</td></tr><tr><td>문장(Sentence)</td><td>기본악상 → 반복 → 전개·종지</td><td>제시 → 몰아 마침</td></tr><tr><td>하이퍼미터</td><td>마디들의 상위 강·약 주기(보통 4마디)</td><td>큰 박·호흡 단위</td></tr></table><svg class="cdia" viewBox="0 0 320 104"><text x="160" y="18" text-anchor="middle" font-size="10" fill="#a7b4bc">악절(Period) = 질문 + 대답</text><rect x="12" y="30" width="140" height="40" rx="9" fill="rgba(162,179,222,.14)" stroke="#a2b3de" stroke-width="1.5"/><text x="82" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#a2b3de">선행구 (질문)</text><rect x="168" y="30" width="140" height="40" rx="9" fill="rgba(111,233,205,.14)" stroke="#6fe9cd" stroke-width="1.5"/><text x="238" y="55" text-anchor="middle" font-size="12" font-weight="700" fill="#6fe9cd">후속구 (대답)</text><text x="82" y="92" text-anchor="middle" font-size="10" fill="#ff8575" font-weight="700">반종지 HC ↗</text><text x="238" y="92" text-anchor="middle" font-size="10" fill="#6fe9cd" font-weight="700">정격종지 PAC ✓</text></svg><p><b>해석 · </b>악절은 <b>대칭적 질문·대답</b>(4+4), 문장은 <b>앞은 짧게 두 번, 뒤는 길게 몰아</b>가는 비대칭이에요. 8마디를 만나면 먼저 이 둘 중 무엇인지 판별하면 어디서 숨 쉬고 어디로 몰지가 보여요.</p><h4>프레이즈의 최고점 \u2014 클라이맥스</h4><p>독일 이론에서 <b>회에푼크트(H\u00f6hepunkt)</b>라 부르는, 프레이즈 안에서 긴장이 최대가 되는 한 지점이에요. 원칙은 하나 \u2014 <b>한 프레이즈에 최고점은 하나</b>입니다. 둘이면 둘 다 죽어요.</p><table class="ctbl"><tr><th>단서</th><th>무엇을 보나</th></tr><tr><td>최고음</td><td>가장 흔한 표지. 선율의 정점.</td></tr><tr><td>화성 긴장</td><td>불협화 정점, 이차 딸림, 나폴리 6도, 감7화음.</td></tr><tr><td>리듬 밀도</td><td>잘게 쪼개짐이 최대인 곳.</td></tr><tr><td>음역 폭</td><td>도약이 가장 큰 곳.</td></tr></table><p class="warn">넷이 한 점에 모이면 클라이맥스가 명백해요. <b>흩어져 있으면 연주자가 고릅니다</b> \u2014 그 선택이 해석이에요.</p><p><b>황금분할</b> \u2014 최고점이 프레이즈의 <b>61.8% 지점</b> 부근에 오는 경향이 있어요. 앞쪽에 오면 하강이 길어 체념조가 되고, 뒤쪽이면 조급해집니다.</p><p class="warn">다만 이건 <b>법칙이 아니라 경향</b>이에요. 렌드바이의 바르톡 분석에서 유명해졌지만 <b>학계에서 논쟁적</b>입니다. 귀로 찾은 정점을 검산하는 참고선 정도로 쓰세요.</p><h4>프레이즈의 뼈대와 용어</h4><table class="ctbl"><tr><th>용어</th><th>뜻</th></tr><tr><td><b>아르지스</b> Arsis</td><td>들림. 긴장이 쌓이는 상승 구간.</td></tr><tr><td><b>테지스</b> Thesis</td><td>놓임. 도착하고 해소되는 구간. 모든 프레이즈는 <b>어디까지 밀고 어디서 놓느냐</b>의 문제예요.</td></tr><tr><td colspan="2" style="color:#f5d18f">\u26a0 두 용어는 <b>문헌마다 정의가 뒤집힙니다</b>. 그리스 원의미는 arsis=발을 듦(약박), thesis=발을 내림(강박)인데, 라틴\u00b7근대 이론에서 반대로 쓰이며 혼란이 굳었어요. 여기서는 리만 이래의 <b>지휘\u00b7프레이징 용법</b>(arsis=상승, thesis=도착)을 따릅니다.</td></tr><tr><td>포어더잣츠\u00b7나흐잣츠<br>Vordersatz\u00b7Nachsatz</td><td>앞구\u00b7뒷구(전건\u00b7후건). 질문과 대답. <b>주의</b> \u2014 피셔의 바로크 3부 구조(Vordersatz\u2013Fortspinnung\u2013Epilog)에서는 <b>다른 뜻</b>으로 쓰여요.</td></tr><tr><td>포어트슈피눙 Fortspinnung</td><td>전개\u00b7실 잣기. 동기를 계속 이어 늘이는 바로크식. 마디 단위로 끊기지 않아요.</td></tr><tr><td>엘리시온 Elision</td><td>생략\u00b7중첩. 앞 프레이즈의 끝 마디가 다음 프레이즈의 첫 마디를 겸함. <b>숨 쉴 자리가 사라져</b> 몰아칩니다.</td></tr><tr><td>확장 Extension\u00b7Expansion</td><td>종지를 미루며 늘이기.</td></tr><tr><td>기만종지 Deceptive cadence</td><td>도착을 배신해 프레이즈를 이어감.</td></tr></table><p><b>카플린(William Caplin)</b>은 1998년 『Classical Form』에서 \u300c이 마디들은 <b>무엇을 하는 자리인가</b>\u300d로 형식을 다시 짰어요 \u2014 제시하는 자리, 전개하는 자리, 끝맺는 자리. 위치가 아니라 <b>기능</b>으로 봅니다.</p><p><b>카플린의 형식 기능</b> \u2014 문장형은 <b>제시(2)+반복(2)+계속\u00b7종결(4)</b>로, 후반이 <b>가속\u00b7조각화</b>되며 밀어붙여요. 주기형은 <b>선행구(4, 반종지)+후행구(4, 완전종지)</b>로 대칭이고 답이 있습니다.</p><h4>주고받기 \u2014 부르고 답하는 구조</h4><p>프레이즈는 혼자 서지 않아요. <b>열어두는 쪽</b>과 <b>닫는 쪽</b>이 짝을 이룹니다. 서양 음악의 문장 감각은 여기서 나와요.</p><table class="ctbl"><tr><th>구조</th><th>짜임</th><th>보기</th></tr><tr><td><b>선행구\u00b7후속구</b><br>antecedent\u00b7consequent</td><td>앞구가 <b>반종지</b>로 열어두고 뒷구가 <b>완전종지</b>로 닫는다</td><td>주기형(period)의 뼈대</td></tr><tr><td><b>주제\u00b7응답</b><br>statement\u00b7answer</td><td>같은 소재가 <b>딸림조</b>로 옮겨 되받는다</td><td>푸가의 주제와 응답</td></tr><tr><td><b>대화\u00b7교창</b><br>dialogue\u00b7antiphony</td><td>악기군끼리 주고받는다</td><td>콘체르토 그로소(콘체르티노 대 리피에노), 베네치아 악파의 좌우 성가대</td></tr><tr><td><b>에코</b> echo</td><td>같은 것을 <b>여리게</b> 되풀이. 위치까지 옮기면 공간감</td><td>바로크 에코 악장, 낭만의 원경 효과</td></tr></table>'+stfBlock('선행구와 후속구',[[60,64,67],[67,71,74],[65,69,72],[60,64,67]],['I','V','IV','I'],'앞구는 V에서 열어두고(반종지), 뒷구는 I로 닫는다(완전종지).')+'',think:['악절(질문–대답)과 문장(몰아가기)은 서로 다른 말하기예요. 연설·시·대화 중 각각 무엇에 가까울까?','7마디·9마디 악구를 만나면 어떤 효과가 날까? 어디가 늘거나 줄었는지 어떻게 찾을까?'],listen:['모차르트 피아노 소나타 K.545 1악장','질문과 대답의 대화 — 두 사람의 말소리처럼 들어보세요.'],read:[

{d:15,wk:3,ph:'선율·대위',t:'비화성음 I',lead:'화음에 안 속한 음이 선율의 표정을 만들어요. 오늘은 경과·보조·계류.',concept:'<p>화음에 <b>속하지 않는 음</b>이 어떻게 들어왔다 빠지는가가 선율의 표정을 만들어요. <b>접근·해결 방식</b>과 <b>박 위치</b>로 종류가 갈립니다. 오늘은 경과·보조·계류.</p><table class="ctbl"><tr><th>비화성음</th><th>접근→해결</th><th>박</th><th>느낌</th></tr><tr><td>경과음</td><td>순차 → 순차(같은 방향)</td><td>약박</td><td>매끄럽게 지나감</td></tr><tr><td>보조음</td><td>순차 → 순차(되돌아옴)</td><td>약박</td><td>옆집에 잠깐</td></tr><tr><td>계류음 ★</td><td>앞 화음 붙듦 → 순차 하행</td><td>강박</td><td>불협의 찡함</td></tr></table><p><b>해석 · </b><b>계류음</b>이 핵심이에요. <b>준비(앞 화음 음 유지) → 걸림(강박에서 불협) → 해결(순차 하행)</b>의 3단계로, 4-3·7-6·9-8 유형이 대표적. 합창 종지의 찡한 순간이 바로 이 계류예요. 경과·보조는 약박의 장식이라 가볍게 흐릅니다.</p><div class="cex"><div class="cex-t">🎧 예시 — 계류음 4–3 해결</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[67,72,74],[67,71,74]],1.15)">Gsus4 → G</button></div><div class="cex-d">4음(도)이 강박에 걸렸다가 3음(시)으로 순차 하행 해결. 걸림→해결의 찡한 순간이에요.</div></div>',think:['계류음의 찡함은 걸림과 해결 사이의 시간에서 와요. 그 시간을 연주자가 늘이거나 줄이면 표현은 어떻게 달라질까?','불협이 아름답게 들리는 조건은 무엇일까 — 준비·해결·문맥 중 무엇이 결정적일까?'],listen:['바버 「현을 위한 아다지오」','계류가 걸릴 때마다 조여오는 가슴, 풀릴 때의 숨. 걸림과 해결 사이에서 살아보세요.'],read:[

{d:16,wk:3,ph:'선율·대위',t:'비화성음 II',lead:'전타·이탈·선행·자유음. 각각 다른 표정.',concept:'<p>나머지 비화성음 — 각기 다른 표정을 만들어요.</p><table class="ctbl"><tr><th>비화성음</th><th>접근→해결</th><th>박</th><th>느낌</th></tr><tr><td>전타음(앞꾸밈)</td><td>도약 → 순차</td><td>강박</td><td>탄식·한숨</td></tr><tr><td>이탈음</td><td>순차 → 도약(반대)</td><td>약박</td><td>디뎠다 도망</td></tr><tr><td>선행음</td><td>순차/도약 → 유지</td><td>약박</td><td>도착 한 박 먼저</td></tr><tr><td>지연음</td><td>유지 → 순차 상행</td><td>강박</td><td>이끔음의 늦은 해결</td></tr></table><p><b>해석 · </b><b>전타음</b>은 준비 없이 강박에 도약으로 나타나 순차로 풀리는 애잔한 음(모차르트의 한숨)이에요. <b>지연음</b>은 계류음과 원리가 같지만 <b>위로(상행)</b> 풀려 종지에서 이끔음이 으뜸음으로 늦게 올라갈 때 씁니다.</p><div class="cex"><div class="cex-t">🎧 예시 — 전타음 (앞꾸밈)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[60,64,65],[60,64,64]],1.0)">F(앞꾸밈) → E</button></div><div class="cex-d">강박에 도약으로 들어온 F가 E로 순차 해결 — 준비 없는 탄식의 강박음이에요.</div></div>',think:['전타음(한숨)이 한 번이면 탄식, 반복되면 애원이 돼요. 반복 횟수가 정서를 바꾸는 다른 예를 찾아보기.','비화성음을 모두 걷어낸 선율은 어떤 얼굴일까? 장식이 본질을 가릴 수도 있을까?'],listen:['모차르트 교향곡 40번 1악장','한숨 음형의 연쇄 — 탄식인지 체념인지, 오늘의 내 마음이 정해줄 거예요.'],read:[
'전타음(앞꾸밈): 강박에 도약으로 들어와 순차 해결, 준비 없음 — 탄식·한숨','이탈음: 순차로 들어와 반대 방향 도약(약박) — 한 발 디뎠다 도망','선행음: 다음 화음 음 미리 당김(약박) — 도착 한 박 먼저','지연음: 계류음의 상행 해결 버전(이끔음→으뜸)'],
q:[mc('준비 없이 강박에 도약으로 나타나 "탄식"을 주는 음은?',['경과음','전타음','보조음','선행음'],1,'모차르트의 애잔한 강박음.'),
sa('계류음과 원리는 같지만 위(상행)로 푸는 비화성음은?','지연음 (Retardation)','종지에서 이끔음이 으뜸음으로 늦게 올라갈 때.'),
mc('순차로 들어와 반대 방향으로 도약해 빠지는 음은?',['이탈음','계류음','전타음','경과음'],0,'옆으로 디뎠다 훌쩍 건너뜀(약박).')],
task:'모차르트 느린 악장에서 전타음(강박 한숨)을 찾아 표시.',hand:''},

{d:17,wk:3,ph:'선율·대위',t:'대위·모방·캐논',lead:'독립 선율 둘 이상이 규칙 있게 얽히는 기술.',concept:'<p>둘 이상의 <b>독립 선율</b>이 규칙 있게 얽히는 기술이에요. 각 선율이 살아 있으면서도 어울리게 짜는 것이 대위법입니다.</p><table class="ctbl"><tr><th>기법</th><th>설명</th></tr><tr><td>캐논</td><td>선행을 후행이 시간차로 모방 (돌림노래)</td></tr><tr><td>반행(전위) 캐논</td><td>위아래를 뒤집어 따라감 (거울)</td></tr><tr><td>역행 캐논</td><td>거꾸로 따라감 (게걸음)</td></tr><tr><td>스트레토</td><td>진입 간격을 좁혀 겹침 (절정)</td></tr><tr><td>전위 대위법</td><td>상하 성부를 바꿔도 성립 (8·10·12도)</td></tr></table><svg class="cdia" viewBox="0 0 320 104"><text x="160" y="16" text-anchor="middle" font-size="10" fill="#a7b4bc">캐논 = 시간차 모방(돌림노래)</text><rect x="16" y="30" width="250" height="24" rx="6" fill="rgba(111,233,205,.14)" stroke="#6fe9cd" stroke-width="1.3"/><text x="24" y="47" font-size="10" font-weight="700" fill="#6fe9cd">성부 1 (선행) ▶ 주제…</text><rect x="66" y="62" width="250" height="24" rx="6" fill="rgba(162,179,222,.14)" stroke="#a2b3de" stroke-width="1.3"/><text x="74" y="79" font-size="10" font-weight="700" fill="#a2b3de">성부 2 (후행) ▶ 같은 주제…</text><line x1="66" y1="30" x2="66" y2="86" stroke="#75818b" stroke-dasharray="3 3"/><text x="70" y="100" font-size="9" fill="#75818b">← 한 마디 뒤 진입(시간차)</text></svg><p><b>해석 · </b>대위의 목표는 <b>수평(각 선율의 노래됨)</b>과 <b>수직(동시에 울릴 때의 어울림)</b>을 동시에 만족시키는 것. 스트레토는 주제 진입을 바짝 좁혀 긴박감을 쌓아요.</p><div class="cex"><div class="cex-t">🎧 예시 — 모방 (주제 + 응답)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playMel([60,62,64,65,67],0.34)">주제</button><button class="cex-b" onclick="ac();playMel([67,69,71,72,74],0.34)">응답 (5도 위)</button></div><div class="cex-d">응답은 주제를 5도 위에서 받아요. 실제 캐논은 이 둘이 시간차로 겹쳐 울립니다.</div></div>',think:['같은 선율로 얽히는 캐논과 자유 대위 — 통제와 자유의 차이가 소리에 어떻게 드러날까?','돌림노래의 즐거움의 정체는 무엇일까 — 예측? 겹침? 협동?'],listen:['바흐 인벤션 1번','두 목소리가 서로의 말을 듣는 방식. 한 번은 위만, 한 번은 아래만 따라가보세요.'],read:[
'캐논: 선행을 후행이 시간차로 모방(돌림노래)','반행(거울)/역행(게걸음)/확대·축소 캐논','모방: 느슨한 모방 / 스트레토: 진입 간격 좁혀 절정','전위 대위법: 상하 성부 바꿔도 성립(8·10·12도)'],
q:[mc('선율의 위아래를 뒤집어 따라가는 캐논은?',['역행 캐논','반행(전위) 캐논','확대 캐논','무한 캐논'],1,'거울 캐논. 올라가면 내려감.'),
sa('푸가 절정에서 주제 진입 간격을 바짝 좁혀 겹치는 기법은?','스트레토','"좁힘". 긴박감을 만듦.'),
mc('상하 성부를 서로 바꿔도 음악이 성립하게 짜는 기술은?',['정선율','전위 대위법','정량 캐논','포부르동'],1,'이중·삼중 대위(8·10·12도 전위).')],
task:'"Frère Jacques"를 2성부 돌림노래로 겹쳐 불러 캐논을 체험.',hand:''},

{d:18,wk:3,ph:'선율·대위',t:'푸가 + 복습',lead:'모방 대위의 꽃, 푸가. 그리고 선율·대위 점검.',concept:'<p><b>푸가</b>는 모방 대위의 꽃이에요. 하나의 주제가 여러 성부를 오가며 짜입니다. 그리고 3주차를 정리합니다.</p><table class="ctbl"><tr><th>용어</th><th>뜻</th></tr><tr><td>주제(Subject)</td><td>첫 제시 선율</td></tr><tr><td>응답(Answer)</td><td>5도 위에서 받음 (실음/조성)</td></tr><tr><td>대주제(Countersubject)</td><td>주제에 늘 붙는 대선율</td></tr><tr><td>간주부(Episode)</td><td>주제 없이 잇는 경과</td></tr><tr><td>스트레토</td><td>주제 겹침으로 절정</td></tr></table><div class="cnote"><b>3주차 복습 · </b>동기 전개(변형) → 악구 구조(악절/문장) → 비화성음(경과·보조·계류·전타·이탈·선행·지연) → 대위·캐논 → 푸가. <b>선율이 짜이고 얽히는</b> 원리들이에요.</div>',think:['스트레토는 주제 진입을 좁혀 절정을 만들어요. 대화에서 말이 겹치기 시작하는 순간과 비교해보기.','주제가 성부들을 여행하는 푸가를 하나의 이야기로 읽는다면 주인공·갈등·해소는 각각 무엇일까?'],listen:['바흐 평균율 1권 c단조 푸가','주제가 성부들을 여행할 때, 떠나보내고 마중하는 마음으로.'],read:[
'푸가 용어: 주제(Subject)·응답(5도 위, 실음/조성)·대주제·간주부','페달·스트레토로 절정','복습: 동기 변형·악구 구조·비화성음·캐논','종족 대위법(1~5종, 푹스)·정선율(빌려온 고정선율)'],
q:[mc('푸가에서 주제를 5도 위에서 받는 것은?',['대주제','응답','간주부','스트레토'],1,'Answer. 실음(Real)/조성(Tonal)으로 나뉨.'),
sa('푸가에서 주제 없이 이어주는 경과 구간의 이름은?','간주부 (Episode)','주제 사이를 잇는 구간.'),
mc('경과음의 박 위치는?',['강박','약박','상관없음','첫 박만'],1,'복습: 경과·보조·이탈=약박, 계류·전타=강박.'),
sa('대위를 얹는 토대가 되는 빌려온 고정 선율은?','정선율 (Cantus firmus)','흔히 성가.')],
task:'바흐 인벤션 한 곡에서 주제가 다른 성부로 모방되는 지점을 찾기.',hand:''},

{d:19,wk:4,ph:'리듬·짜임새',t:'리듬 기법 I',lead:'박·리듬이 규칙과 어긋나며 추진력을 만들어요.',concept:'<p>박·리듬이 규칙(<b>박자</b>)과 어떻게 <b>어긋나는가</b>가 추진력과 긴장을 만들어요. 어긋남이 곧 에너지입니다.</p><table class="ctbl"><tr><th>기법</th><th>설명</th><th>효과</th></tr><tr><td>당김음(싱코페이션)</td><td>약박을 강조</td><td>추진 · 재즈감 — <b>20일차</b>에서 자세히</td></tr><tr><td>헤미올라</td><td>3박 두 마디를 2박 세 덩어리로(<b>3:2</b> \u2014 hemiolia=1.5배)</td><td>바로크 종지 · 왈츠</td></tr><tr><td>폴리리듬</td><td>다른 박자 그룹 동시(3 대 2)</td><td>긴장 · 복합</td></tr><tr><td>확대·축소</td><td>리듬 통째 느리게/빠르게</td><td>변형 · 발전 — <b>13일차</b> 참조</td></tr></table><svg class="cdia" viewBox="0 0 320 118"><text x="160" y="15" text-anchor="middle" font-size="10" fill="#a7b4bc">헤미올라 = 같은 6박을 다르게 묶기 (3:2)</text><rect x="10" y="46" width="46" height="30" rx="4" fill="var(--surface2)" stroke="#75818b"/><text x="33" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe4e8">1</text><rect x="60" y="46" width="46" height="30" rx="4" fill="var(--surface2)" stroke="#75818b"/><text x="83" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe4e8">2</text><rect x="110" y="46" width="46" height="30" rx="4" fill="var(--surface2)" stroke="#75818b"/><text x="133" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe4e8">3</text><rect x="160" y="46" width="46" height="30" rx="4" fill="var(--surface2)" stroke="#75818b"/><text x="183" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe4e8">4</text><rect x="210" y="46" width="46" height="30" rx="4" fill="var(--surface2)" stroke="#75818b"/><text x="233" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe4e8">5</text><rect x="260" y="46" width="46" height="30" rx="4" fill="var(--surface2)" stroke="#75818b"/><text x="283" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe4e8">6</text><path d="M10,40 L156,40" stroke="#6fe9cd" stroke-width="2"/><path d="M160,40 L306,40" stroke="#6fe9cd" stroke-width="2"/><text x="83" y="34" text-anchor="middle" font-size="9" fill="#6fe9cd">정상: 3+3</text><text x="233" y="34" text-anchor="middle" font-size="9" fill="#6fe9cd"> </text><path d="M10,82 L106,82" stroke="#ff8575" stroke-width="2"/><path d="M110,82 L206,82" stroke="#ff8575" stroke-width="2"/><path d="M210,82 L306,82" stroke="#ff8575" stroke-width="2"/><text x="160" y="98" text-anchor="middle" font-size="9.5" fill="#ff8575" font-weight="700">헤미올라: 2+2+2</text></svg><p><b>해석 · </b><b>헤미올라</b>는 같은 6박을 3+3(정상)에서 2+2+2(헤미올라)로 <b>재해석</b>하는 거예요. 바로크·왈츠에서 <b>종지 직전</b>에 자주 나타나 "브레이크를 밟듯" 마무리를 예고합니다.</p><h4>박자표 읽기 \u2014 기호와 갈래</h4><p>악보를 읽는 첫 단어는 <b>박자표</b>예요. 무엇을 한 박으로 세는지가 여기서 정해집니다.</p><table class="ctbl"><tr><th>기호</th><th>박자표</th><th>뜻</th></tr><tr><td>C</td><td>4/4</td><td>콤먼 타임. 반원 기호는 중세 정량기보의 <b>불완전 박자</b>(2분할) 표시가 굳은 것 \u2014 원이 완전(3분할)이었어요. <b>common time의 첫 글자 C라는 설명은 속설</b>입니다.</td></tr><tr><td>\u00a2</td><td>2/2</td><td><b>알라 브레베</b>(컷타임). 2분음표가 한 박. 같은 음표를 절반의 박으로 세어 긴 호흡을 만들어요.</td></tr><tr><td>\u2014</td><td>senza misura</td><td>박자 없음. 마디선\u00b7박자표를 두지 않아요. 카덴차\u00b7낭송조.</td></tr><tr><td>\u2014</td><td>a piacere</td><td>연주자 임의. 연주자는 큐와 컷만 줍니다.</td></tr></table><table class="ctbl"><tr><th>갈래</th><th>보기</th><th>한 박의 분할</th></tr><tr><td>단순박자 simple</td><td>2/4 3/4 4/4</td><td>2분할</td></tr><tr><td>겹박자 compound</td><td>6/8 9/8 12/8</td><td>3분할 \u2014 <b>6/8은 두 박</b>이지 여섯 박이 아니에요</td></tr><tr><td>혼합박자 irregular</td><td>5/8 7/8 11/8</td><td>2와 3이 섞임 \u2014 14주에서 다룹니다</td></tr></table><h4>박을 세는 방식</h4><p>같은 악보라도 <b>몇 박으로 묶어 세는가</b>는 음악의 호흡이 정합니다. 표기가 아니라 흐름이 기준이에요.</p><table class="ctbl"><tr><th>방식</th><th>쓰임</th></tr><tr><td><b>인 원</b> in one</td><td>한 마디를 한 박으로. 빠른 왈츠\u00b7스케르초. 마디가 큰 박이 됩니다.</td></tr><tr><td><b>인 투</b> in two</td><td>두 박으로 묶기. 알라 브레베, 빠른 6/8.</td></tr><tr><td><b>쪼개 세기</b> subdivision</td><td>한 박을 둘\u00b7셋으로. 느린 악장, 리타르단도, 앙상블이 흔들릴 때.</td></tr><tr><td>큰박\u00b7작은박</td><td>6/8의 점4분이 큰박, 8분이 작은박.</td></tr></table><p class="warn">박자표가 같아도 <b>세는 방식은 연주자가 정해요</b>. 빠른 4/4를 알라 브레베처럼 두 박으로 젓는 것이 그 예입니다.</p>',think:['헤미올라는 같은 시간을 다르게 묶는 착청이에요. 시각의 착시와 어디가 같고 어디가 다를까?','당김음이 추진이 되는 이유를 기대의 어긋남으로 설명해보기 — 어긋남이 계속되면 새 규칙이 될까?'],listen:['번스타인 「웨스트 사이드 스토리」 중 아메리카','헤미올라의 춤 — 내 몸이 6을 어떻게 묶는지, 묶음이 바뀌는 순간의 짜릿함.'],read:[

{d:20,wk:4,ph:'리듬·짜임새',t:'리듬 기법 II',lead:'중세부터 현대까지 — 아이소·가산·메트릭 모듈레이션.',concept:'<p>중세부터 현대까지의 리듬 조직 방식들이에요.</p><table class="ctbl"><tr><th>기법</th><th>설명</th></tr><tr><td>아이소리듬</td><td>탈레아(반복 리듬형)+콜로르(반복 음형)를 따로 겹침 (중세)</td></tr><tr><td>가산 리듬</td><td>2+2+3처럼 불규칙 묶음을 더함 (발칸·현대)</td></tr><tr><td>메트릭 모듈레이션</td><td>음표를 매개로 템포를 매끄럽게 바꿔치기 (엘리엇 카터)</td></tr><tr><td>리듬 변위</td><td>같은 패턴을 박 위치만 밀어 어긋나게</td></tr></table><p><b>해석 · </b><b>가산 리듬</b>은 균등한 박이 아니라 작은 묶음(2·3)을 더해 만들어요. 7/8 = 2+2+3처럼요. <b>메트릭 모듈레이션</b>은 셋잇단의 한 음을 새 박으로 삼아 템포를 자연스럽게 갈아탑니다.</p><h4>싱코페이션의 두 얼굴 \u2014 미느냐 거느냐</h4><p>싱코페이션은 강박에 와야 할 무게를 약박으로 옮겨요. 강박 자리가 비니 거기서 <b>걸림</b>이 생깁니다. 그런데 그 걸림이 <b>브레이크가 되기도 하고 가속이 되기도</b> 해요 \u2014 같은 장치인데 방향이 반대입니다.</p><table class="ctbl"><tr><th></th><th>추진형</th><th>제동형</th></tr><tr><td>생김새</td><td>짧은 앞당김, 오프비트 반복</td><td>긴 음이 강박을 타고 넘어감(타이)</td></tr><tr><td>효과</td><td>다음 강박으로 <b>밀어붙임</b></td><td>박이 늘어져 <b>정체감</b></td></tr><tr><td>보기</td><td>재즈\u00b7라틴\u00b7록의 스윙 엔진</td><td>브람스 \u2014 3박 안에 2박 감각이 겹쳐 무거워짐</td></tr><tr><td>손 쓰는 법</td><td>그 박을 평소보다 <b>가볍게</b> 지나감</td><td>그 박에서 손이 <b>조금 더 머묾</b></td></tr></table><p class="warn">핵심 \u2014 싱코페이션은 <b>박자 그리드를 깨는 것이지 시간을 멈추는 게 아니에요</b>. </p><p>진짜 브레이크는 따로 있어요 \u2014 <b>헤미올라</b>(묶음 자체를 바꿔 세움), <b>아고긱 강세</b>(늦게 도착), <b>체수라\u00b7G.P.</b>(물리적 정지). 싱코페이션과 섞어 쓰면 효과가 서로를 잡아먹습니다.</p><h4>역박 강세 \u2014 첫 박을 죽이고 뒤를 키우기</h4><p>박자 위계를 <b>거스르는</b> 강세예요. 통칭 <b>역박 강세(contrametric accent)</b>. 싱코페이션이 무게를 <b>옮기는</b> 것이라면, 이쪽은 위계 자체를 <b>뒤집습니다</b>.</p><table class="ctbl"><tr><th>수단</th><th>내용</th></tr><tr><td><b>약박의 sf</b></td><td>베토벤이 즐겨 쓴 방식. 3박에서 2박에 sf를 계속 박으면 <b>박 감각이 흔들립니다</b>. 에로이카 1악장이 대표적이에요.</td></tr><tr><td><b>헤미올라의 전 단계</b></td><td>2박에 계속 무게를 실으면 결국 <b>묶음이 바뀌어</b> 들려 헤미올라로 넘어갑니다.</td></tr><tr><td><b>롬바르드 리듬</b><br>스카치 스냅</td><td>짧은 음이 강박에, 긴 음이 뒤에. 음표 순서가 뒤집혀 <b>첫 박이 튕겨 나갑니다</b>.</td></tr><tr><td><b>애프터비트</b><br>Nachschlag</td><td>무게가 뒤로 밀리는 반주형. 왈츠의 쿵\u2013짝\u2013짝을 뒤집는 감각.</td></tr><tr><td><b>아고긱 전위</b></td><td>첫 박은 짧고 가볍게, 둘째 박은 <b>길고 무겁게</b>. 음량이 아니라 <b>시간</b>으로 무게를 옮겨요. 빈 왈츠의 2박이 정확히 이것입니다.</td></tr></table>',think:['7/8(2+2+3)의 절뚝임이 그루브가 되는 순간은 언제일까 — 불규칙이 몸에 익는다는 것의 의미는?','메트릭 모듈레이션은 템포의 피벗 전조예요. 11일차 전조와 원리를 비교해 공통 구조를 찾아보기.'],listen:['스트라빈스키 「봄의 제전」 중 희생의 춤','불규칙 리듬이 깨우는 원초적인 몸의 반응. 세지 말고 부딪히세요.'],read:[
'아이소리듬: 반복 리듬형(탈레아)+반복 음형(콜로르) 따로 겹침(중세)','가산 리듬: 2+2+3 불규칙 묶음(발칸·현대)','메트릭 모듈레이션(카터): 음표 매개로 템포 매끄럽게 바꿔치기','리듬 변위: 같은 패턴을 박 위치만 밀어 어긋나게'],
q:[mc('짧은 음이 강박에 오고 긴 음이 뒤따르는 리듬은?',['애프터비트','롬바르드 리듬(스카치 스냅)','헤미올라','아고긱 전위'],1,'음표 순서가 뒤집혀 첫 박이 튕겨 나갑니다.'),
mc('빈 왈츠의 2박이 무겁게 들리는 원리는?',['음량을 키운다','시간을 늘인다 \u2014 아고긱 전위','박자표를 바꾼다','악센트 기호'],1,'음량이 아니라 시간으로 무게를 옮기는 방식이에요.'),

mc('싱코페이션을 연주할 때 오른손이 할 일은?',['그 음에 맞춰 같이 어긋난다','원래 박 그리드를 지킨다','박을 쉰다','템포를 늦춘다'],1,'손이 같이 어긋나면 그냥 박자가 바뀐 걸로 들려요.'),

{d:21,wk:4,ph:'리듬·짜임새',t:'짜임새 (Texture)',lead:'성부들이 어떤 관계로 얽히는가. 발란스 설계의 출발.',concept:'<p>성부(층)들이 서로 <b>어떤 관계로 얽히는가</b>예요. 이걸 알아야 "어느 성부를 들리게 할지"인 발란스를 설계해요.</p><table class="ctbl"><tr><th>짜임새</th><th>구조</th><th>예</th></tr><tr><td>모노포니</td><td>선율 하나 (반주 없음)</td><td>그레고리오 성가</td></tr><tr><td>호모포니</td><td>주선율 + 화음 반주</td><td>가곡 · 찬송가</td></tr><tr><td>폴리포니</td><td>독립 선율 둘 이상 얽힘</td><td>바흐 푸가</td></tr><tr><td>헤테로포니</td><td>같은 선율을 각자 조금씩 다르게</td><td>민속 합주</td></tr></table><svg class="cdia" viewBox="0 0 320 150"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">짜임새 4종 — 성부가 얽히는 방식</text><text x="45" y="34" text-anchor="middle" font-size="9" fill="#6fe9cd" font-weight="700">모노포니</text><path d="M12,52 Q30,44 48,52 T84,50" fill="none" stroke="#6fe9cd" stroke-width="2"/><text x="127" y="34" text-anchor="middle" font-size="9" fill="#a2b3de" font-weight="700">호모포니</text><path d="M94,48 Q112,40 130,48 T166,46" fill="none" stroke="#a2b3de" stroke-width="2"/><line x1="98" y1="62" x2="162" y2="62" stroke="#75818b" stroke-width="1.5" stroke-dasharray="5 3"/><line x1="98" y1="70" x2="162" y2="70" stroke="#75818b" stroke-width="1.5" stroke-dasharray="5 3"/><text x="45" y="98" text-anchor="middle" font-size="9" fill="#f5d18f" font-weight="700">폴리포니</text><path d="M12,116 Q30,106 48,116 T84,112" fill="none" stroke="#f5d18f" stroke-width="1.8"/><path d="M12,128 Q34,136 52,126 T84,130" fill="none" stroke="#f5d18f" stroke-width="1.8" opacity=".7"/><text x="127" y="98" text-anchor="middle" font-size="9" fill="#ff8575" font-weight="700">헤테로포니</text><path d="M94,116 Q112,108 130,116 T166,114" fill="none" stroke="#ff8575" stroke-width="1.8"/><path d="M94,120 Q114,110 132,120 T166,118" fill="none" stroke="#ff8575" stroke-width="1.8" opacity=".6" stroke-dasharray="2 2"/></svg><p><b>해석 · </b>한 곡은 짜임새가 <b>계속 바뀌어요</b> — 호모포니로 시작해 발전부에서 폴리포니로 조밀해지듯. "지금 이 부분은 호모? 폴리?"를 늘 물으면 주선율과 반주의 위계가 보입니다.</p><h4>편곡의 두 방향 \u2014 옮기기와 다시 짓기</h4><p>같은 원곡을 다루는데 <b>원곡의 권위가 어디에 있는가</b>로 갈립니다.</p><table class="ctbl"><tr><th>방향</th><th>하는 일</th></tr><tr><td><b>트랜스크립션</b><br>transcription \u00b7 전사</td><td>음높이\u00b7리듬\u00b7화성을 <b>보존</b>하고 연주 매체만 바꾼다. 리스트의 베토벤 교향곡 피아노판. 원곡의 권위가 위에 있어요.</td></tr><tr><td><b>어레인지먼트</b><br>arrangement \u00b7 편곡</td><td>화성을 바꾸고 형식을 늘이거나 줄이고 새 대선율을 넣는다. <b>편곡자의 발언</b>이 들어가요.</td></tr></table><p class="warn">경계는 칼같지 않아요. 리스트의 전사도 피아노 관용구로 옮기며 실질적 재작곡이 일어나고, 부조니는 아예 <b>「창조적 전사」</b>를 주장했습니다.</p><table class="ctbl"><tr><th>갈래</th><th>뜻</th></tr><tr><td>리덕션 reduction</td><td>총보를 피아노로 줄이기. 연습\u00b7리허설용.</td></tr><tr><td>오케스트레이션 orchestration</td><td>피아노곡\u00b7스케치를 관현악으로. 라벨의 「전람회의 그림」.</td></tr><tr><td>패러프레이즈 paraphrase</td><td>주제만 가져와 자유롭게 확장. 리스트의 오페라 환상곡.</td></tr><tr><td>리하모니제이션</td><td>선율은 두고 <b>화성만</b> 바꾸기.</td></tr><tr><td>콘트라팍툼 contrafactum</td><td>선율은 두고 <b>가사만</b> 바꾸기.</td></tr></table>',think:['호모포니에서 폴리포니로 바뀌는 순간 청중의 주의는 어떻게 재배치될까?','헤테로포니의 살아있음의 정체는 무엇일까 — 완벽한 유니즌과 비교해보기.'],listen:['라벨 「볼레로」','같은 선율 위로 층이 쌓이고 색이 두꺼워지는 15분 — 피부로 느끼는 크레셴도.'],read:[

{d:22,wk:4,ph:'리듬·짜임새',t:'화성 리듬·화성색',lead:'화음이 바뀌는 속도와 배치의 색. 표현의 숨은 축.',concept:'<p>화음이 <b>바뀌는 속도</b>(화성 리듬)와 <b>배치의 색</b>(보이싱)은 표현의 숨은 축이에요.</p><table class="ctbl"><tr><th>요소</th><th>내용</th></tr><tr><td>화성 리듬</td><td>화음 교체 속도 — 느림=장중, 빠름=긴장. 종지 직전 가속</td></tr><tr><td>밀집/개방 보이싱</td><td>뭉침·두꺼움 vs 투명·공간감</td></tr><tr><td>음역</td><td>저음역 밀집=탁함(머드) → 넓게 벌려야 명료</td></tr><tr><td>음색선율</td><td>같은 음을 악기 바꿔가며 = 색이 곧 선율(쇤베르크)</td></tr></table><svg class="cdia" viewBox="0 0 320 108"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">화성 리듬 = 화음이 바뀌는 속도</text><text x="12" y="40" font-size="9" fill="#6fe9cd" font-weight="700">느림 (장중)</text><rect x="12" y="46" width="144" height="22" rx="4" fill="rgba(111,233,205,.2)" stroke="#6fe9cd"/><rect x="160" y="46" width="144" height="22" rx="4" fill="rgba(162,179,222,.2)" stroke="#a2b3de"/><text x="84" y="61" text-anchor="middle" font-size="9" fill="#dbe4e8">화음 1</text><text x="232" y="61" text-anchor="middle" font-size="9" fill="#dbe4e8">화음 2</text><text x="12" y="88" font-size="9" fill="#ff8575" font-weight="700">빠름 (긴장·가속)</text><rect x="12" y="94" width="70" height="10" rx="3" fill="rgba(255,133,117,.2)" stroke="#ff8575"/><rect x="86" y="94" width="70" height="10" rx="3" fill="rgba(255,133,117,.2)" stroke="#ff8575"/><rect x="160" y="94" width="70" height="10" rx="3" fill="rgba(255,133,117,.2)" stroke="#ff8575"/><rect x="234" y="94" width="70" height="10" rx="3" fill="rgba(255,133,117,.2)" stroke="#ff8575"/></svg><p><b>해석 · </b><b>화성 리듬</b>은 곡의 호흡 속도예요. 느린 화성은 넓고 장중하게, 빠른 화성은 활발·긴장되게 들려요. 종지 직전에 화음 교체가 빨라지며 도착으로 몰아가는 것이 흔한 문법입니다.</p><div class="cex"><div class="cex-t">🎧 예시 — 화성 리듬 (느림 vs 빠름)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[60,64,67],[60,64,67],[67,71,74],[67,71,74]],0.5)">느림</button><button class="cex-b" onclick="ac();playSeq([[60,64,67],[65,69,72],[67,71,74],[57,60,64]],0.5)">빠름</button></div><div class="cex-d">느린 화성은 장중하게, 빠른 화성은 활발·긴장되게 들려요. 종지 직전엔 흔히 빨라집니다.</div></div><h4>기능이 흐려진 음악은 무엇으로 흐르나</h4><p>T\u2013S\u2013D를 중력에 비유한다면, 드뷔시\u00b7명상 음악은 무중력처럼 보여요. 그런데 <b>중력이 사라진 게 아니라 무엇이 무거움을 만드는지가 바뀐</b> 겁니다. 기능화성에서 흐름은 <b>불협화\u2192협화</b>의 해결 욕구가 만드는데, 그게 흐려지면 네 축이 그 자리를 대신해요.</p><table class="ctbl"><tr><th>대신하는 축</th><th>어떻게 흐름이 되나</th></tr><tr><td><b>음색\u00b7배치</b></td><td>화음이 <b>가야 할 곳</b>이 아니라 <b>머무는 색</b>이 된다. 낮고 두꺼우면 무겁고 높고 성기면 가볍다. 같은 화음도 간격을 벌리면 공기가 되고 좁히면 덩어리가 된다.</td></tr><tr><td><b>음역</b></td><td>화성이 방향을 못 주면 <b>음역이 방향을 준다</b>. 올라가면 긴장, 내려오면 이완. 「목신의 오후」 플루트 선율.</td></tr><tr><td><b>밀도\u00b7짜임새</b></td><td>성부가 늘고 리듬이 촘촘해지면 압력이 오른다. 라벨 「볼레로」 \u2014 화성은 거의 안 움직이는데 <b>악기 수만 늘어</b> 전체가 상승한다.</td></tr><tr><td><b>시간 자체</b></td><td>기능화성이 <b>변화</b>로 시간을 잰다면, 명상 음악은 <b>지속</b>으로 잰다. 변하지 않는 것이 배경이고 <b>아주 작은 변화가 사건</b>이 된다 \u2014 반음 하나가 종지만큼 크다. 페르트의 틴티나불리.</td></tr></table>',think:['화성 리듬이 느려질 때 시간이 넓어지는 느낌 — 명상 음악이 화성 교체를 극도로 늦추는 이유와 연결해보기.','같은 진행을 화성 리듬만 두 배 빠르게 하면 무엇을 잃고 무엇을 얻을까?'],listen:['드뷔시 「달빛」','화음이 아주 천천히 바뀔 때 시간이 넓어지는 감각 — 명상 음악과 닿아 있는 지점이에요.'],read:[
'화성 리듬: 화음 바뀌는 속도 — 느림=장중, 빠름=긴장. 종지 직전 가속','밀집(close)=뭉침/두꺼움, 개방(open)=투명/공간감','음역: 저음역 밀집=탁함 → 넓게 벌려야 명료','음색선율(Klangfarben): 같은 음을 악기 바꿔가며 = 음색이 곧 선율'],
q:[mc('화성 진행이 거의 없는데도 상승감을 만드는 「볼레로」의 수단은?',['전조','밀도\u00b7짜임새의 증가','화성 리듬 가속','종지 연쇄'],1,'악기 수가 늘며 압력이 오릅니다. 화성은 거의 그대로예요.'),
sa('기능이 흐려진 음악에서 흐름을 만드는 네 축은?','음색\u00b7음역\u00b7밀도\u00b7시간','해결 욕구 대신 이 넷이 흐름을 만들어요.'),
mc('종지 직전에 화성 리듬이 흔히 어떻게 되나?',['느려짐','가속','정지','상관없음'],1,'화음 교체가 빨라지며 도착으로 몰아감.'),
sa('음들을 한 옥타브 안에 모아 뭉치고 진하게 만드는 보이싱은?','밀집(close) 보이싱','개방은 넓게 벌려 투명.'),
mc('음색 변화 자체가 선율이 되게 하는 기법은?',['오스티나토','음색선율(Klangfarbenmelodie)','헤미올라','페달'],1,'쇤베르크 Op.16-3. 화성은 정지, 색만 이동.')],

{d:23,wk:4,ph:'리듬·짜임새',t:'복습 — 리듬·짜임새',lead:'문제로 다지기.',concept:'<p><b>4주차 정리.</b> 리듬의 어긋남과 성부의 얽힘 — 음악의 <b>시간과 층</b>을 다루는 도구들이에요.</p><table class="ctbl"><tr><th>개념</th><th>핵심</th></tr><tr><td>당김음·헤미올라·폴리</td><td>박자와의 어긋남 = 추진·긴장</td></tr><tr><td>가산·아이소·메트릭모듈</td><td>불규칙 묶음·템포 전환</td></tr><tr><td>짜임새 4종</td><td>모노·호모·폴리·헤테로</td></tr><tr><td>화성 리듬·보이싱</td><td>화음 속도 + 배치의 색</td></tr></table><div class="cnote"><b>복습법 · </b>한 곡에서 리듬 기법 2개 + 짜임새 변화 1곳을 찾아 표시해보세요. 다음은 <b>1개월 모의고사</b>로 1~4주를 종합 점검합니다.</div>',think:['리듬의 어긋남(당김·헤미올라)과 화성의 어긋남(불협)은 같은 원리의 다른 차원일까? 긴장–해소 축으로 통합해보기.','이번 주 개념 중 연주 동작으로 번역하기 가장 어려운 것은 무엇이고 왜일까?'],listen:['거슈윈 「랩소디 인 블루」 도입','클라리넷 글리산도부터 — 리듬과 짜임새가 뒤섞이는 즐거움을 그냥 즐기세요.'],read:['당김음·헤미올라·폴리·아이소·가산 점검','짜임새 4종 + 화성 리듬·보이싱 점검'],

{d:24,wk:4,ph:'모의고사',t:'1개월 모의고사',lead:'화성·선율·리듬 종합 점검. 60% 이상이면 통과.',concept:'<p><b>1개월 종합 점검</b>이에요. 1~4주에 배운 <b>화성 · 선율 · 리듬 · 짜임새</b> 전 범위에서 출제됩니다. 아래 체크리스트로 스스로 준비도를 확인하고, 문제를 푼 뒤 <b>60% 미만</b>이면 약한 주제로 돌아가세요.</p><table class="ctbl"><tr><th>주차</th><th>꼭 알아야 할 것</th></tr><tr><td>1주 화성</td><td>화음의 질 · T-S-D · 종지 · 텐션 · 전위</td></tr><tr><td>2주 화성II</td><td>시퀀스 · 스키마타 · 반음계 · 전조 · 지속음</td></tr><tr><td>3주 선율</td><td>동기 전개 · 악절/문장 · 비화성음 · 대위 · 푸가</td></tr><tr><td>4주 리듬</td><td>당김음·헤미올라 · 가산리듬 · 짜임새 4종 · 화성리듬</td></tr></table><div class="cnote"><b>시험 팁 · </b>틀린 문제는 그냥 넘기지 말고 <b>해당 Day로 돌아가 개념·표를 다시</b> 보세요. 반복 오답 주제 2개를 메모해 다음 주 복습 목록에 넣으면 효과적이에요.</div>',think:['틀린 문제들 사이에 공통 뿌리가 있는지 찾아보기 — 약점은 개념일까 용어일까 귀일까?','1개월 동안 가장 크게 바뀐 내 듣기 습관 하나를 적어보기.'],listen:['자유 감상','이번 달 가장 좋았던 곡을 한 번 더 — 이번엔 아무 분석 없이, 처음 만난 것처럼.'],read:['1~4주 전체에서 출제','틀린 문제는 해당 날로 돌아가 복습'],

{d:25,wk:5,ph:'표현·음색',t:'셈여림',lead:'소리 크기 변화가 화성 긴장과 맞물려 다이내믹 아치를 만들어요.',concept:'<p>소리 크기 변화는 화성 긴장과 맞물려 하나의 <b>다이내믹 아치</b>를 이뤄요. 낱개 셈여림이 아니라 "정점을 향한 곡선"으로 설계하는 게 핵심입니다.</p><table class="ctbl"><tr><th>기법</th><th>설명</th></tr><tr><td>계단식(테라스)</td><td>단으로 뚝뚝 f→p 급전환 (바로크)</td></tr><tr><td>메사 디 보체</td><td>한 음을 &lt;&gt;로 부풀렸다 줄임 (성악·관악)</td></tr><tr><td>만하임 크레셴도</td><td>로켓·롤러·한숨 — 극적 점층</td></tr><tr><td>로시니 크레셴도</td><td>반복→단축→악기 추가→음역 상승</td></tr><tr><td>기능적 크레셴도</td><td>정점으로 향하는 다이내믹 아치</td></tr></table><svg class="cdia" viewBox="0 0 320 122"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">다이내믹 아치 — 정점을 향한 하나의 곡선</text><line x1="20" y1="100" x2="305" y2="100" stroke="#75818b" stroke-width="1"/><path d="M22,96 C90,90 150,32 214,30 C250,29 280,60 300,88" fill="none" stroke="#6fe9cd" stroke-width="2.4"/><line x1="214" y1="30" x2="214" y2="100" stroke="#ff8575" stroke-dasharray="3 3"/><circle cx="214" cy="30" r="4" fill="#ff8575"/><text x="22" y="114" font-size="9" fill="#a2b3de">p 시작</text><text x="214" y="24" text-anchor="middle" font-size="9" fill="#ff8575" font-weight="700">ff 정점</text><text x="300" y="114" text-anchor="end" font-size="9" fill="#a2b3de">p 이완</text><text x="214" y="114" text-anchor="middle" font-size="8.5" fill="#75818b">약 2/3 지점</text></svg><p><b>해석 · </b>표현은 <b>하나의 큰 곡선</b>이에요. 어디서 시작해 어디가 정점이고 어디서 이완하는지를 먼저 정해야, 국지적 셈여림이 그 아치에 종속됩니다. 정점은 보통 <b>후반 2/3 지점</b>에 두어야 자연스러워요.</p>',think:['정점을 2/3 지점에 두는 관습 — 이야기 구조(기승전결)와 우연의 일치일까?','크레셴도 없이 긴장을 키우는 방법을 세 가지 이상 떠올려보기.'],listen:['차이콥스키 교향곡 6번 4악장','소리가 꺼져가는 방식의 슬픔 — 사라지는 다이내믹을 끝까지 배웅해보세요.'],read:[

{d:26,wk:5,ph:'표현·음색',t:'아고긱·템포',lead:'음량이 아니라 시간의 흔들림으로 표현. 리만이 정립.',concept:'<p>음량이 아니라 <b>시간의 흔들림</b>으로 표현하는 방식이에요. 리만이 정립했습니다.</p><table class="ctbl"><tr><th>수단</th><th>설명</th></tr><tr><td>아고긱 악센트</td><td>음을 살짝 길게 늘여 강세 (음량 없이 도드라지게)</td></tr><tr><td>템포 루바토</td><td>선율만 신축(쇼팽) / 전체 신축</td></tr><tr><td>점진 변화</td><td>rit · rall · accel · allargando</td></tr><tr><td>급격 변화</td><td>ritenuto · stringendo · a tempo</td></tr><tr><td>뤼시 규칙</td><td>상행=조임, 하행=늦춤</td></tr></table><p><b>해석 · </b><b>아고긱 악센트</b>는 셋잇단 첫 음이나 정점 음을 미세하게 끌어 "음량 없이 도드라지게" 하는 거예요. 루바토는 "훔친 시간을 같은 마디 안에서 되갚는다"는 원리 — 선율이 밀면 어딘가서 당겨 균형을 맞춥니다.</p><h4>연주 관습 \u2014 악보에 없지만 모두가 하는 것</h4><p>악보에 적히지 않았는데 관습으로 굳은 처리들이에요. 시대마다 다르고, <b>지금은 역사주의 연주(HIP)와 주류 관습이 갈라져</b> 있습니다. 리허설 전에 <b>어느 관습을 따를지 정하고</b> 시작해야 해요.</p><table class="ctbl"><tr><th>시대</th><th>관습</th></tr><tr><td><b>공통</b></td><td>\u00b7 <b>종지 감속</b> \u2014 마지막 두세 마디는 rit. 표시가 없어도 늦춘다<br>\u00b7 <b>아고긱 강세</b> \u2014 최고음\u00b7불협화에 살짝 늦게 도착해 무게를 준다. 세게 치는 게 아니다<br>\u00b7 프레이즈 끝 음은 악보보다 짧게 \u2014 숨 자리를 만든다<br>\u00b7 <b>subito p 직전에 살짝 부푼다</b> \u2014 대비를 키우려고<br>\u00b7 반복은 다르게 \u2014 두 번째는 에코로 여리게, 또는 장식을 더한다</td></tr><tr><td><b>바로크</b></td><td>\u00b7 <b>트릴은 윗음에서 시작</b>(본음이 아니라)<br>\u00b7 <b>이중점음표</b> \u2014 프랑스 서곡의 점음표는 악보보다 날카롭게<br>\u00b7 <b>노트 이네갈</b> \u2014 균등하게 적힌 8분음표를 길고 짧게<br>\u00b7 피카르디 3도 \u2014 단조 악장 끝을 장3화음으로<br>\u00b7 다 카포 아리아 반복 때 장식 \u2014 그대로 반복하면 결례</td></tr><tr><td><b>고전</b></td><td>\u00b7 아포지아투라는 <b>정박에서</b> 시작(앞이 아니라)<br>\u00b7 종지 6/4에서 멈추면 <b>카덴차 자리</b><br>\u00b7 미뉴에트 다 카포 때 반복 생략<br>\u00b7 <b>sf는 절대값이 아니라 그 자리의 상대값</b> \u2014 p 안의 sf는 여전히 여리다</td></tr><tr><td><b>낭만</b></td><td>\u00b7 <b>쇼팽식 루바토</b> \u2014 왼손은 박을 지키고 오른손만 자유롭게<br>\u00b7 <b>포르타멘토</b> \u2014 19세기 현악의 표준. 20세기 중반에 사라짐<br>\u00b7 아르페지오 \u2014 피아노 화음을 굴려 치는 것이 당연했다<br>\u00b7 선율과 베이스의 어긋남 \u2014 베이스를 살짝 먼저</td></tr><tr><td><b>춤\u00b7민속</b></td><td>\u00b7 <b>빈 왈츠</b> \u2014 2박이 살짝 빨리 온다. 악보엔 균등하게 적혀 있어도<br>\u00b7 마주르카 \u2014 2박 또는 3박에 강세, 그 박을 늘인다<br>\u00b7 헝가리\u00b7집시 \u2014 첫 박에 강한 어택과 급격한 아고긱</td></tr><tr><td><b>오케스트라 실무</b></td><td>\u00b7 금관의 마지막 화음은 조금 더 길게<br>\u00b7 <b>팀파니 롤은 크레셴도가 기본</b>(표시가 없어도)<br>\u00b7 현의 다운보우 \u2014 활 방향이 강세를 만든다<br>\u00b7 관악 솔로 앞 미세한 여유 \u2014 호흡 자리를 준다</td></tr></table><p class="warn">같은 바흐라도 아르농쿠르와 카라얀은 <b>다른 관습</b>을 씁니다. 어느 쪽이 옳은가가 아니라 <b>무엇을 골랐는지 일관된가</b>가 기준이에요.</p>',think:['아고긱이 지나치면 무엇이 무너질까? 자유와 방종의 경계는 어디일까?','루바토가 훔친 시간을 되갚는 것이라면, 되갚지 않는 루바토는 어떤 음악이 될까?'],listen:['쇼팽 녹턴 Op.9-2','루바토가 숨처럼 밀고 당기는 시간. 연주자의 호흡에 내 호흡을 포개보세요.'],read:[

mc('p 안에 적힌 sf를 어떻게 해석하나?',['f 수준으로 세게','그 자리의 상대값 \u2014 여전히 여리게','무시','ff로'],1,'셈여림 기호는 절대값이 아니라 문맥의 상대값이에요.'),

mc('소리를 키우지 않고 음을 살짝 길게 늘여 주는 강세는?',['다이내믹 악센트','아고긱 악센트','스포르찬도','테누토'],1,'셋잇단 첫 음·정점 음을 미세하게 끄는 것.'),
