mc('즉시 당겨 느리게 하는 지시어는?',['ritardando','ritenuto','rallentando','allargando'],1,'ritenuto=점진적이 아닌 즉각적.')],
task:'느린 악장 한 악구에 아고긱(어느 음을 살짝 끌지)을 3곳 표시.',hand:''},

{d:27,wk:5,ph:'표현·음색',t:'관현악법 I',lead:'같은 음악도 어떻게 입히느냐로 달라져요. 7개의 축·악기군·배합.',concept:'<p>같은 음악도 <b>어떤 악기로 울리느냐</b>로 완전히 달라져요. 악기군의 성격과 배합이 관현악 색의 기초입니다.</p><table class="ctbl"><tr><th>악기군</th><th>특성</th><th>역할</th></tr><tr><td>현</td><td>균질 · 잘 융합 · 표현폭 넓음</td><td>바탕천</td></tr><tr><td>목관</td><td>개성 강함 · 각기 다른 색</td><td>색채 · 솔로</td></tr><tr><td>금관</td><td>광채 · 힘</td><td>정점 · 팡파르</td></tr><tr><td>타</td><td>리듬 · 색채</td><td>강조 · 색</td></tr></table><svg class="cdia" viewBox="0 0 320 148"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">오케스트라 배치 — 무대 앞으로 층층이</text><path d="M40,120 A120,120 0 0 1 280,120" fill="none" stroke="#6fe9cd" stroke-width="16" opacity=".35"/><path d="M62,120 A98,98 0 0 1 258,120" fill="none" stroke="#f5d18f" stroke-width="14" opacity=".35"/><path d="M84,120 A76,76 0 0 1 236,120" fill="none" stroke="#ff8575" stroke-width="13" opacity=".35"/><text x="160" y="30" text-anchor="middle" font-size="9" fill="#ff8575" font-weight="700">금관·타 (뒤)</text><text x="160" y="52" text-anchor="middle" font-size="9" fill="#f5d18f" font-weight="700">목관 (중간)</text><text x="160" y="74" text-anchor="middle" font-size="9.5" fill="#6fe9cd" font-weight="700">현 (앞·바탕천)</text><circle cx="160" cy="132" r="8" fill="#a2b3de"/><text x="160" y="146" text-anchor="middle" font-size="8.5" fill="#a7b4bc">연주자</text></svg><p><b>해석 · </b>배합은 <b>동질</b>(같은 군 = 잘 융합), <b>이질</b>(다른 군 = 대비), <b>혼합색</b>(섞어 제3의 색)으로 나뉘어요. 림스키코르사코프의 원리는 <b>색의 절제</b> — 다 쓰지 말아야 정점에서 색이 삽니다.</p>',think:['색의 절제 — 아껴야 산다는 원리가 적용되는 다른 예술·삶의 장면을 찾아보기.','현이 바탕천이라면, 바탕천 없이 목관·금관만으로 짠 음악은 어떤 옷일까?'],listen:['무소륵스키·라벨 「전람회의 그림」','같은 선율이 악기를 갈아입는 마법 — 프롬나드가 돌아올 때마다 옷이 달라요.'],read:[
'7축: 편성·배합방식·주법·음역·수(solo/divisi/tutti)·짜임새 역할·셈여림','악기군: 현(바탕천)·목관(개성)·금관(광채)·타(리듬·색채)','배합: 동질(잘 융합)·이질(대비/혼합색)·중복(동음·옥타브)','R-K: 색의 절제 — 다 쓰지 말 것'],
q:[mc('음색이 균질하고 잘 섞여 "바탕천"이 되는 악기군은?',['목관','금관','현악','타악'],2,'표현폭이 가장 넓음.'),
sa('다른 군을 섞어 제3의 색을 만드는 배합을 뭐라 하나?','혼합색(이질 배합)','플루트+바이올린 유니즌의 부드러운 광택.'),
mc('림스키코르사코프가 강조한 관현악 원리는?',['다 쓰기','색의 절제','한 악기만','타악 위주'],1,'꼭 필요한 만큼만 칠해야 정점에서 색이 삼.')],
task:'같은 선율을 현/목관/금관으로 상상해 각각 어떤 느낌인지 메모.',hand:''},

{d:28,wk:5,ph:'표현·음색',t:'관현악법 II',lead:'짜임새의 층과 주법 — 발란스 설계.',concept:'<p>짜임새의 <b>층</b>과 <b>주법</b> — 발란스 설계의 실전이에요.</p><table class="ctbl"><tr><th>구분</th><th>내용</th></tr><tr><td>5개 기능 층</td><td>주선율 · 대선율 · 베이스 · 화성 충전 · 리듬</td></tr><tr><td>sul ponticello</td><td>브리지 쪽 활 — 거칠·금속적</td></tr><tr><td>sul tasto</td><td>지판 쪽 활 — 부드럽·플루트 같은</td></tr><tr><td>con sordino</td><td>약음기 — 어둡·먼 소리</td></tr><tr><td>하모닉스</td><td>배음 — 유리 같은 맑음</td></tr></table><p><b>해석 · </b>총보에서 <b>5개 층</b>을 색으로 구분하면 발란스가 보여요 — 지금 무엇이 주선율이고 무엇이 채움인지. 작곡가의 주법 선택(sul tasto·약음기)은 곧 <b>음색·발란스 지시</b>라, 그 의도대로 큐와 균형을 만듭니다.</p>',think:['다섯 층 중 하나를 뺀다면 무엇을 빼도 음악이 성립할까? 층의 위계를 실험해보기.','주법 지시가 없는 곳에서 연주자의 자유는 어디까지일까?'],listen:['드뷔시 「목신의 오후 전주곡」','플루트 한 줄이 여는 오후의 공기. 음색 하나가 세계를 만드는 순간.'],read:[
'5개 층: 주선율·대선율·베이스·화성충전·리듬 — 각 층 다른 음색','성부 배치: 밀집/개리, 음역 배분','주법: sul ponticello(거칠)·sul tasto(부드럽)·con sordino(약음기)·하모닉스','연주 함의: 배합·주법 읽기 = 발란스 설계. 관현악법 분석 = 연주 해석의 절반'],
q:[mc('안을 채우는 지속화음 층(흔히 호른·내성 현)은?',['주선율','대선율','화성 충전','리듬'],2,'Harmonic filler/pad.'),
sa('브리지 쪽을 활로 그어 거칠고 금속적인 음색을 내는 주법은?','sul ponticello','sul tasto는 반대(부드럽고 플루트 같은).'),
mc('작곡가가 sul tasto·약음기를 택한 의도를 읽으면?',['템포가 정해짐','음색·발란스 설계로 이어짐','조가 정해짐','종지가 정해짐'],1,'그 의도대로 큐·균형·음색을 만듦.')],
task:'오케스트라 총보 한 페이지에서 5개 층을 색으로 구분해보기.',hand:''},

{d:29,wk:5,ph:'표현·음색',t:'화성색·음색 텍스처',lead:'배치·음색이 화성의 색을 만들어요. 보이싱·음색선율·스펙트럼.',concept:'<p>같은 화음도 <b>배치</b>와 <b>음색</b>에 따라 색이 달라져요. 화성의 색을 만드는 요소들입니다.</p><table class="ctbl"><tr><th>요소</th><th>내용</th></tr><tr><td>보이싱</td><td>밀집=뭉침·두꺼움 / 개방=투명·공간감</td></tr><tr><td>간격</td><td>저음역 3도=뭉침 / 6·10도=열림 / 2·7도=마찰</td></tr><tr><td>중복</td><td>근음 중복=안정 / 3음 중복=색 진해짐</td></tr><tr><td>음색선율</td><td>같은 음을 악기 바꿔가며 = 색이 곧 선율(쇤베르크 Op.16-3)</td></tr><tr><td>스펙트럼</td><td>자연배음렬=융합·광채 / 어긋나게=거칠·긴장</td></tr></table><p><b>해석 · </b>화성색은 "무슨 화음이냐"만이 아니라 "어떻게 배치·중복·발성하느냐"의 문제예요. <b>음색선율</b>은 화성을 정지시키고 음색만 움직여 선율을 만드는 20세기의 발상 — 사운드 자체가 화성이 되는 스펙트럴 음악으로 이어집니다.</p><div class="cex"><div class="cex-t">🎧 예시 — 보이싱 — 밀집 vs 개방</div><div class="cex-btns"><button class="cex-b" onclick="ac();playChord([60,64,67],1.4)">밀집</button><button class="cex-b" onclick="ac();playChord([48,55,64],1.4)">개방</button></div><div class="cex-d">밀집은 한 옥타브에 뭉쳐 두껍게, 개방은 넓게 벌려 투명하게. 같은 화음도 색이 달라져요.</div></div>',think:['같은 화음의 밀집·개방이 다른 감정을 주는 이유 — 공간감이 감정이 되는 메커니즘은?','음색선율을 일상에서 찾아보기 — 같은 말을 다른 목소리로 이어 말할 때 무엇이 들릴까?'],listen:['라벨 「물의 유희」','화음이 물빛이 되는 순간 — 소리를 색으로, 색을 온도로 느껴보세요.'],read:[
'간격의 색: 3도는 저음역서 뭉침, 6·10도는 열림, 4·5도=순수, 2·7도=마찰','중복: 근음 중복=안정, 3음 중복=장·단 성격 진해짐','음색선율: 같은 음을 악기 바꿔가며 = 색이 곧 선율','배음·스펙트럼: 자연배음렬대로=융합·광채 / 어긋나게=거칠·긴장'],
q:[mc('저음역에서 뭉치기 쉬워 피해야 하는 음정은?',['6도','10도','3도','5도'],2,'저음역 3도는 탁함 → 넓게 벌려야.'),
sa('배음을 그대로 화음으로 끌어오는 20세기 사조는?','스펙트럴(스펙트럼악파)','그리세·뮈라이 — "음색이 곧 화성".'),
mc('3음을 중복하면 무엇이 강조되나?',['근음','장·단 성격(색)','베이스','리듬'],1,'화음의 색이 진해짐.')],
task:'앱 사전에서 한 화음을 골라 밀집/개방·중복을 바꿔 색 변화를 귀로 익히기.',hand:''},

{d:30,wk:5,ph:'표현·음색',t:'복습 — 표현·음색',lead:'문제로 다지기.',concept:'<p><b>5주차 정리.</b> 표현(셈여림·아고긱)과 음색(관현악법·화성색) — 음악에 <b>생명과 색</b>을 입히는 도구들이에요.</p><table class="ctbl"><tr><th>개념</th><th>핵심</th></tr><tr><td>셈여림</td><td>정점을 향한 다이내믹 아치로 설계</td></tr><tr><td>아고긱</td><td>시간(타이밍)으로 주는 강세·표현</td></tr><tr><td>관현악법</td><td>악기군·배합·층·주법 = 발란스</td></tr><tr><td>화성색</td><td>보이싱·중복·음색선율로 색을 조각</td></tr></table><div class="cnote"><b>복습법 · </b>한 곡의 정점을 찾아 <b>화성 긴장 + 다이내믹 + 음색</b>이 어떻게 겹치는지 한 줄로 적어보세요. 표현은 이 셋을 하나의 곡선으로 모으는 일이에요.</div>',think:['표현과 음색을 한 정점에 겹칠 때와 어긋나게 배치할 때 — 각각 어떤 드라마가 될까?','이번 주 개념으로 최근 들은 연주 하나를 비평해보기 — 무엇이 좋았고 무엇이 아쉬웠나?'],listen:['말러 교향곡 5번 아다지에토','표현과 음색이 하나의 긴 호흡이 되는 10분. 중간에 끊지 말고.'],read:['셈여림·아고긱·관현악법·화성색 점검','핵심: 표현은 정점을 향한 하나의 곡선으로 설계'],
q:[mc('만하임 악파의 효과가 아닌 것은?',['크레셴도','로켓','한숨','헤미올라'],3,'헤미올라는 리듬 기법.'),
sa('음량 없이 음을 길게 끌어 도드라지게 하는 강세는?','아고긱 악센트','시간으로 주는 강세.'),
mc('관현악 5개 기능 층에 없는 것은?',['주선율','대선율','종지','리듬'],2,'주선율·대선율·베이스·화성충전·리듬.'),
sa('같은 음을 악기 바꿔가며 만드는 "음색의 선율"은?','음색선율(Klangfarbenmelodie)','쇤베르크.')],
task:'한 곡의 정점을 찾아 화성긴장+다이내믹+음색이 어떻게 겹치는지 한 줄로.',hand:''},

{d:31,wk:6,ph:'형식·구조',t:'형식 기초',lead:'곡의 큰 틀을 읽어요. 소나타·론도·변주·정점.',concept:'<p>곡이 어떤 <b>큰 틀</b>로 짜였는지 보는 거예요. 구획·정점·반복의 지도를 그려야 큰 아치 위에서 국지 사건을 배치할 수 있어요.</p><table class="ctbl"><tr><th>형식</th><th>구조</th><th>특징</th></tr><tr><td>소나타</td><td>제시 → 발전 → 재현</td><td>고전 교향곡·소나타의 뼈대</td></tr><tr><td>론도</td><td>A-B-A-C-A</td><td>후렴이 돌아옴</td></tr><tr><td>변주곡</td><td>주제 + 변형들</td><td>같은 뼈대 반복 변형</td></tr><tr><td>3부형식</td><td>A-B-A</td><td>가운데 대비</td></tr><tr><td>푸가</td><td>주제 모방 대위</td><td>대위법으로 짬</td></tr></table><svg class="cdia" viewBox="0 0 320 108"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">소나타 형식 — 제시 · 발전 · 재현</text><rect x="10" y="30" width="70" height="34" fill="rgba(111,233,205,.25)" stroke="#6fe9cd"/><rect x="80" y="30" width="60" height="34" fill="rgba(162,179,222,.25)" stroke="#a2b3de"/><rect x="140" y="30" width="70" height="34" fill="rgba(245,209,143,.25)" stroke="#f5d18f"/><rect x="210" y="30" width="55" height="34" fill="rgba(111,233,205,.25)" stroke="#6fe9cd"/><rect x="265" y="30" width="45" height="34" fill="rgba(162,179,222,.25)" stroke="#a2b3de"/><text x="45" y="51" text-anchor="middle" font-size="8.5" fill="#dbe4e8">1주제</text><text x="110" y="51" text-anchor="middle" font-size="8.5" fill="#dbe4e8">2주제</text><text x="175" y="51" text-anchor="middle" font-size="8.5" fill="#dbe4e8">전개</text><text x="237" y="51" text-anchor="middle" font-size="8.5" fill="#dbe4e8">1주제</text><text x="287" y="51" text-anchor="middle" font-size="8.5" fill="#dbe4e8">2주제</text><text x="75" y="78" text-anchor="middle" font-size="9" fill="#6fe9cd" font-weight="700">제시부</text><text x="175" y="78" text-anchor="middle" font-size="9" fill="#f5d18f" font-weight="700">발전부</text><text x="262" y="78" text-anchor="middle" font-size="9" fill="#6fe9cd" font-weight="700">재현부(모두 으뜸조)</text><circle cx="175" cy="24" r="3.5" fill="#ff8575"/><text x="175" y="98" text-anchor="middle" font-size="8" fill="#ff8575">정점은 흔히 발전부 후반</text></svg><p><b>해석 · </b>소나타의 핵심은 <b>조성 드라마</b>예요 — 제시부에서 2주제가 다른 조(도미넌트조)로 떠났다가, 재현부에서 <b>모두 으뜸조로</b> 돌아와 화해합니다. 정점(Höhepunkt)은 보통 <b>발전부 후반~재현 직전</b>에 두어요.</p>',think:['재현부가 모두 으뜸조로 돌아오는 화해 — 소설·영화와 공유하는 서사의 뼈대는?','형식을 모르는 청중도 재현을 느껴요. 몸은 무엇을 근거로 돌아왔음을 아는 걸까?'],listen:['모차르트 교향곡 40번 1악장 전곡','떠남과 돌아옴을 여행으로 — 재현부에서 집에 온 기분이 드는지.'],read:[
'정점(Höhepunkt): 긴장 최고점, 흔히 2/3 지점 — 모든 완급을 여기로 설계','소나타(제시-발전-재현)·론도(후렴 회귀)·변주·푸가의 표지 읽기','하이퍼미터·악구 주기로 큰 박 흐름 느끼기','"지금 어느 칸?"을 늘 파악'],
q:[mc('곡의 긴장 정점은 흔히 어디쯤?',['시작','1/3','2/3 부근','맨 끝'],2,'황금분할 근처. 너무 이르면 김 빠짐.'),
sa('제시-발전-재현으로 짜인 형식의 이름은?','소나타 형식','고전 교향곡·소나타의 뼈대.'),
mc('후렴이 반복해 돌아오는 형식은?',['변주곡','론도','푸가','소나타'],1,'A-B-A-C-A 식.')],
task:'교향곡 1악장을 들으며 제시-발전-재현 경계를 대략 표시.',hand:''},

{d:32,wk:6,ph:'형식·구조',t:'형식 기능 (캐플린)',lead:'형식을 "구획"이 아니라 "무엇을 하는 자리"로 봐요.',concept:'<p>형식을 "구획"이 아니라 <b>무엇을 하는 자리</b>로 보는 관점이에요. 같은 길이라도 기능이 다르면 다르게 연주합니다.</p><table class="ctbl"><tr><th>기능</th><th>특징</th><th>연주</th></tr><tr><td>제시구(presentation)</td><td>기본악상 제시·반복 · 안정</td><td>놓고(제시)</td></tr><tr><td>전개구(continuation)</td><td>분절·화성 가속 · 불안정</td><td>밀고(추진)</td></tr><tr><td>종지구(cadential)</td><td>종지로 닫음</td><td>매듭</td></tr></table><svg class="cdia" viewBox="0 0 320 100"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">형식 기능 — 8마디 문장의 세 자리</text><rect x="12" y="30" width="150" height="32" rx="6" fill="rgba(111,233,205,.2)" stroke="#6fe9cd"/><rect x="166" y="30" width="80" height="32" rx="6" fill="rgba(245,209,143,.2)" stroke="#f5d18f"/><rect x="250" y="30" width="58" height="32" rx="6" fill="rgba(255,133,117,.2)" stroke="#ff8575"/><text x="87" y="50" text-anchor="middle" font-size="9" font-weight="700" fill="#6fe9cd">제시구 (놓고)</text><text x="206" y="50" text-anchor="middle" font-size="9" font-weight="700" fill="#f5d18f">전개구 (밀고)</text><text x="279" y="50" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ff8575">종지구</text><text x="87" y="80" text-anchor="middle" font-size="8.5" fill="#75818b">안정·제시·반복</text><text x="206" y="80" text-anchor="middle" font-size="8.5" fill="#75818b">분절·화성 가속</text><text x="279" y="80" text-anchor="middle" font-size="8.5" fill="#75818b">매듭</text></svg><p><b>해석 · </b>형식 기능을 알면 <b>분석이 곧 연주 지시</b>가 돼요. 제시구는 여유 있게 놓고, 전개구는 밀어붙이고, 종지구는 매듭짓듯. "이 자리는 왜 여기 있나 → 어떻게 연주하나"로 이어집니다.</p>',think:['기능이 연주를 결정한다면, 기능이 모호한 자리는 어떻게 연주할까?','제시–전개–종지의 위계를 하루 일과에 대응시켜 설명해보기.'],listen:['베토벤 「비창」 소나타 2악장','제시하고, 밀고, 매듭짓는 말하기 — 음악이 말을 거는 방식으로 들어보세요.'],read:[
'제시구(presentation): 기본악상 제시·반복 — 안정·시작','전개구(continuation): 분절·화성 가속 — 추진·불안정','종지구(cadential): 종지로 닫음','같은 길이라도 기능이 다르면 다르게 연주 — 제시는 놓고, 전개는 밀고, 종지는 매듭'],
q:[mc('분절·화성 가속으로 밀어붙이는 기능 단위는?',['제시구','전개구','종지구','간주부'],1,'추진·불안정. 밀어붙일 곳.'),
sa('캐플린 형식기능의 세 단위를 쓰시오.','제시구·전개구·종지구','시작·중간·맺음.'),
mc('형식 기능을 알면 좋은 점은?',['조성 파악','분석이 곧 연주 지시로 번역','템포 결정','악기 선택'],1,'"이 자리는 왜 여기 있나→어떻게 연주하나".')],
task:'8마디 문장에서 제시-전개-종지 구간을 나눠보기.',hand:''},

{d:33,wk:6,ph:'형식·구조',t:'소나타 이론 (H&D)',lead:'소나타를 고정 틀이 아니라 규범과의 대화로 봐요.',concept:'<p>소나타를 고정 틀이 아니라 <b>규범과의 대화</b>로 보는 현대 이론이에요. <b>H&amp;D</b>는 두 저자 <b>헤포코스키(Hepokoski)</b>와 <b>다시(Darcy)</b>의 머리글자예요 — 2006년 『Elements of Sonata Theory』에서 나왔습니다.</p><p>기존 형식론이 「소나타는 제시부·전개부·재현부다」라고 <b>틀</b>을 말했다면, 이 이론은 「당대 청중이 <b>무엇을 기대했고</b>, 이 곡이 그 기대를 어떻게 <b>따르거나 어겼는가</b>」를 봅니다. 그래서 <b>규범을 알아야 어긴 것이 들린다</b>는 말이 성립해요.</p><table class="ctbl"><tr><th>용어</th><th>뜻</th></tr><tr><td>회전(rotation)</td><td>같은 주제 순서를 반복해 도는 구조</td></tr><tr><td>MC(매개 종지)</td><td>제1·2주제군 사이의 갈라짐 틈</td></tr><tr><td>EEC / ESC</td><td>비로소 안정된 종지에 처음 닿는 결정적 도착</td></tr><tr><td>변형(deformation)</td><td>규범을 일부러 어긴 지점 = 의미</td></tr></table><p><b>해석 · </b>이 이론의 힘은 "규범을 <b>어긴 것</b>이 곧 의미"라는 시각이에요. 작곡가가 MC를 미루거나 EEC에 못 닿게 하면, 그 <b>지연·좌절 자체가 드라마</b>입니다. 규범을 알아야 어긴 것이 들려요.</p>',think:['규범을 어긴 것이 의미가 된다면, 규범을 모르는 청중에게도 그 의미는 전달될까?','EEC(진짜 도착)가 끝내 오지 않는 소나타가 있다면 그 곡은 무엇을 말하는 걸까?'],listen:['베토벤 「에그몬트」 서곡','도착이 미뤄질 때의 조바심, 끝내 왔을 때의 해방 — 기다림 자체를 즐기세요.'],read:[
'회전(rotation): 같은 주제 순서를 반복해 도는 구조','MC(매개 종지): 제1·2주제군 사이의 갈라짐 틈','EEC/ESC: 비로소 안정된 종지에 처음 닿는 결정적 도착','변형(deformation): 규범을 일부러 어긴 지점 = 의미'],
q:[mc('제1주제군과 제2주제군 사이의 "틈"은?',['EEC','MC(매개 종지)','회전','변형'],1,'호흡·무게의 분기점.'),
sa('규범을 일부러 어겨 밑줄 긋는 지점을 뭐라 하나?','변형(deformation)','어긴 것이 곧 의미.'),
mc('EEC/ESC가 뜻하는 것은?',['주제 제시','악장의 진짜 도착점','템포 변화','조표'],1,'구조의 진짜 도착.')],
task:'소나타 악장에서 MC(주제군 사이 틈)를 하나 찾아 표시.',hand:''},

{d:34,wk:6,ph:'형식·구조',t:'쉥커 분석 I',lead:'표면 음표 아래 숨은 몇 개의 뼈대를 봐요. "숲을 보는" 분석.',concept:'<p>표면의 수많은 음 아래 숨은 <b>몇 개의 뼈대</b>를 보는 분석이에요. "숲을 보는" 눈입니다.</p><p><b>하인리히 쉥커(Heinrich Schenker, 1868\u20131935)</b>가 세운 이론이라 그의 이름을 씁니다. 용어가 독일어라 낯선데 뜻은 단순해요 \u2014 <b>Ur\u2013</b>는 <b>근원</b>이라는 뜻입니다. <b>Ursatz</b>=근원 문장(Satz=문장), <b>Urlinie</b>=근원 선율(Linie=선), <b>Bassbrechung</b>=베이스 쪼갬(Brechung \u2014 화음을 아르페지오로 펼침). 위에 붙은 <b>3\u0302 2\u0302 1\u0302</b>은 음이름이 아니라 <b>음계의 몇 번째 음인가</b>예요(C장조면 미\u2013레\u2013도).</p><table class="ctbl"><tr><th>개념</th><th>뜻</th></tr><tr><td>Ursatz(기본구조)</td><td>Urlinie + Bassbrechung</td></tr><tr><td>Urlinie(기본선율)</td><td>위 성부 3&#x0302;-2&#x0302;-1&#x0302; 하행</td></tr><tr><td>Bassbrechung</td><td>베이스 아르페지오 I-V-I</td></tr><tr><td>연장(prolongation)</td><td>한 화음·음을 여러 마디에 걸쳐 늘임</td></tr><tr><td>층(level)</td><td>전경(표면) → 중경 → 배경(Ursatz)</td></tr></table><svg class="cdia" viewBox="0 0 300 156"><text x="150" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">Ursatz(기본구조) — 표면 아래의 골격</text><line x1="60" y1="34" x2="60" y2="126" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 3"/><line x1="150" y1="46" x2="150" y2="126" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 3"/><line x1="240" y1="58" x2="240" y2="126" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 3"/><path d="M54,28 Q150,10 244,52" fill="none" stroke="#6fe9cd" stroke-width="1.4"/><ellipse cx="60" cy="40" rx="7" ry="5" fill="none" stroke="#6fe9cd" stroke-width="2" transform="rotate(-20 60 40)"/><ellipse cx="150" cy="52" rx="7" ry="5" fill="none" stroke="#6fe9cd" stroke-width="2" transform="rotate(-20 150 52)"/><ellipse cx="240" cy="64" rx="7" ry="5" fill="none" stroke="#6fe9cd" stroke-width="2" transform="rotate(-20 240 64)"/><text x="60" y="24" text-anchor="middle" font-size="14" fill="#6fe9cd">3&#x0302;</text><text x="150" y="36" text-anchor="middle" font-size="14" fill="#6fe9cd">2&#x0302;</text><text x="240" y="48" text-anchor="middle" font-size="14" fill="#6fe9cd">1&#x0302;</text><ellipse cx="60" cy="106" rx="7" ry="5" fill="none" stroke="#ff8575" stroke-width="2" transform="rotate(-20 60 106)"/><ellipse cx="150" cy="106" rx="7" ry="5" fill="none" stroke="#ff8575" stroke-width="2" transform="rotate(-20 150 106)"/><ellipse cx="240" cy="106" rx="7" ry="5" fill="none" stroke="#ff8575" stroke-width="2" transform="rotate(-20 240 106)"/><path d="M54,118 Q150,138 244,118" fill="none" stroke="#ff8575" stroke-width="1.4"/><text x="60" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe4e8">I</text><text x="150" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe4e8">V</text><text x="240" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe4e8">I</text><text x="296" y="42" text-anchor="end" font-size="8.5" fill="#75818b">기본선율</text><text x="296" y="112" text-anchor="end" font-size="8.5" fill="#75818b">베이스</text></svg><p><b>해석 · </b>쉥커의 통찰은 조성곡이 결국 <b>3&#x0302;-2&#x0302;-1&#x0302; 하행 + I-V-I</b>라는 하나의 큰 문장으로 환원된다는 것. 표면의 화려함은 이 골격을 <b>연장</b>한 장식이에요. 큰 음이 꼭 구조적인 건 아닙니다.</p><div class="cex"><div class="cex-t">🎧 예시 — Ursatz — 3̂-2̂-1̂ / I-V-I</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[48,64],[43,62],[48,60]],1.1)">골격 재생</button></div><div class="cex-d">위 성부 미-레-도(3̂-2̂-1̂ 하행) + 베이스 도-솔-도(I-V-I). 곡 전체가 이 하나의 큰 문장으로 환원돼요.</div></div>',think:['쉥커의 환원이 놓치는 것은 무엇일까 — 골격만 보면 잃게 되는 표면의 가치를 변호해보기.','모든 조성곡이 미–레–도 하행으로 환원된다면, 곡들의 개성은 어디에 사는 걸까?'],listen:['바흐 평균율 1권 프렐류드 C장조','표면의 물결 아래 흐르는 큰 강. 오늘은 강만 느끼세요.'],read:[
'기본구조 Ursatz = 기본선율 Urlinie(3-2-1 하행) + 베이스 아르페지오 Bassbrechung(I-V-I)','연장: 한 화음·음을 여러 마디에 걸쳐 늘임','층: 전경(표면)→중경(악구)→배경(곡 전체 Ursatz)','구조음 vs 장식음 — 큰 음이 꼭 구조적인 건 아님'],
q:[mc('쉥커의 기본선율(Urlinie)의 전형은?',['1-2-3 상행','3-2-1 하행','5-1 도약','반음계'],1,'위 성부가 으뜸음까지 단계적 하행.'),
sa('쉥커에서 베이스의 가장 큰 단위 I-V-I를 뭐라 하나?','베이스 아르페지오 (Bassbrechung)','출발·긴장·귀환.'),
mc('쉥커 분석이 연주에 주는 것은?',['템포','큰 아치 위에서 국지 사건을 종속','조성','악기'],1,'국지마다 무게 주면 부서짐.')],
task:'앱 이론탭의 쉥커 그래프(3̂-2̂-1̂ / I-V-I)를 보고 구조를 손으로 그려보기.',hand:''},

{d:35,wk:6,ph:'형식·구조',t:'쉥커 분석 II — 환원',lead:'악구를 직접 환원해봐요.',concept:'<p>악구를 직접 <b>환원</b>해보는 실습이에요. 표면을 걷어내고 골격을 드러냅니다.</p><table class="ctbl"><tr><th>단계</th><th>할 일</th></tr><tr><td>1단계</td><td>경과·보조·계류음을 걷어낸다 → 남는 화음 톤이 골격</td></tr><tr><td>2단계</td><td>베이스가 I를 떠나 V에 닿고 다시 I로 오는지 찾기</td></tr><tr><td>3단계</td><td>위 성부가 어느 음에서 1&#x0302;로 내려앉는지 보기</td></tr><tr><td>4단계</td><td>골격의 아치만 먼저 연주해본다</td></tr></table><p><b>해석 · </b>환원의 목적은 <b>구조적 청취</b>예요 — 8마디를 4개 골격 화음으로 줄여 보면, 어디가 진짜 도착이고 어디가 지나가는 장식인지 들립니다. 이것이 큰 프레이징의 근거가 돼요.</p>',think:['어디까지 줄여도 그 곡다움이 남을까? 최소한의 곡이란 무엇일까?','골격만 먼저 연주해보는 것이 곡 전체 설계에 주는 힌트는?'],listen:['같은 프렐류드 한 번 더','이번엔 시작·가운데·끝, 세 기둥만 듣기 — 나머지는 바람에 맡기고.'],read:[
'1단계: 경과음·보조음·계류음을 걷어낸다 → 남는 화음 톤이 골격','2단계: 베이스가 I를 떠나 V에 닿고 다시 I로 오는지 찾기','3단계: 위 성부가 어느 음에서 1̂로 내려앉는지 보기','4단계: 골격의 아치만 먼저 연주해보기'],
q:[mc('환원의 첫 단계는?',['조표 확인','비화성음 걷어내기','악기 확인','템포 정하기'],1,'남는 화음 톤이 골격.'),
sa('환원 후 베이스에서 찾아야 할 핵심 진행은?','I-V-I','떠남·긴장·귀환.'),
mc('구조적 청취의 목적은?',['모든 음에 무게','작은 것을 큰 아치에 종속','빠른 템포','큰 음량'],1,'프레이징 스케일이 커짐.')],
task:'8마디 악구에서 비화성음을 지우고 골격 화음 4개로 환원해보기.',hand:''},

{d:36,wk:6,ph:'형식·구조',t:'복습 — 형식·구조',lead:'문제로 다지기.',concept:'<p><b>6주차 정리.</b> 형식(무엇을 하는 자리)과 구조(표면 아래 골격) — 곡을 <b>큰 지도</b>로 읽는 도구들이에요.</p><table class="ctbl"><tr><th>개념</th><th>핵심</th></tr><tr><td>형식 기초</td><td>소나타·론도·변주 — 큰 틀과 정점</td></tr><tr><td>형식 기능<br><span class="ten">캐플린 1998</span></td><td>제시·전개·종지 = 연주 지시</td></tr><tr><td>소나타 이론<br><span class="ten">헤포코스키·다시 2006</span></td><td>규범과의 대화 · 변형이 의미</td></tr><tr><td>쉥커<br><span class="ten">Ur– = 근원</span></td><td>Ursatz(3&#x0302;-2&#x0302;-1&#x0302; + I-V-I)로 환원</td></tr></table><div class="cnote"><b>복습법 · </b>한 악장을 골라 형식을 <b>기능(제시/전개/종지)</b>으로 한 줄 요약하고, 8마디를 골격 4화음으로 환원해보세요.</div>',think:['캐플린과 쉥커는 어떻게 보완할까 — 하나만 써야 한다면 무엇을 고를까, 왜?','다음에 연주할 곡 한 악장을 형식 한 줄 + 골격 네 화음으로 요약해보기.'],listen:['브람스 교향곡 4번 4악장','하나의 베이스 위 서른 번의 변주 — 구조가 그대로 감동이 되는 순간.'],read:['형식·기능·소나타이론·쉥커 점검','핵심: 지도(어디)가 아니라 기능(무엇을 하나)으로 읽기'],
q:[mc('캐플린에서 종지로 닫는 기능은?',['제시구','전개구','종지구','회전'],2,'cadential.'),
sa('쉥커 층 3가지를 표면→전체 순으로.','전경-중경-배경','Vordergrund-Mittelgrund-Hintergrund.'),
mc('소나타 이론에서 "진짜 도착"을 뜻하는 것은?',['MC','EEC/ESC','회전','변형'],1,'제시·재현부의 결정적 종지.'),
sa('긴장 최고점(정점)을 독일어로?','Höhepunkt','흔히 2/3 지점.')],
task:'한 악장의 형식을 기능(제시/전개/종지)으로 한 줄 요약.',hand:''},
// ── 7주: 의미·해석 ──
{d:37,wk:7,ph:'의미·해석',t:'음형론 I',lead:'특정 음형이 특정 정서를 상징하던 바로크의 음악 수사학.',concept:'<p>특정 <b>음형</b>이 특정 정서·형상을 상징하던 바로크의 <b>음악 수사학</b>이에요. 상승=천상, 반음하행=비탄처럼, 음형을 읽으면 무게·색이 한 번에 정해져요.</p><table class="ctbl"><tr><th>음형</th><th>형상</th><th>상징</th></tr><tr><td>anabasis</td><td>위로 상승</td><td>부활 · 천상</td></tr><tr><td>catabasis</td><td>아래로 하강</td><td>매장 · 겸손</td></tr><tr><td>passus duriusculus</td><td>반음계 하행 베이스</td><td>비탄 · 죽음</td></tr><tr><td>saltus duriusculus</td><td>불협 도약</td><td>충격</td></tr><tr><td>circulatio</td><td>원 그리며 돎</td><td>휘감김</td></tr></table><svg class="cdia" viewBox="0 0 320 118"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">음형 = 형상으로 정서를 그림</text><path d="M14,80 L44,66 L74,50 L100,34" fill="none" stroke="#6fe9cd" stroke-width="2.4" marker-end="url(#af)"/><defs><marker id="af" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6fe9cd"/></marker><marker id="af2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a2b3de"/></marker></defs><text x="57" y="98" text-anchor="middle" font-size="9" fill="#6fe9cd">상승 = 천상·부활</text><path d="M120,34 L146,50 L172,66 L200,80" fill="none" stroke="#a2b3de" stroke-width="2.4" marker-end="url(#af2)"/><text x="160" y="98" text-anchor="middle" font-size="9" fill="#a2b3de">하강 = 겸손·매장</text><line x1="224" y1="42" x2="236" y2="42" stroke="#ff8575" stroke-width="2.4"/><line x1="239" y1="49" x2="251" y2="49" stroke="#ff8575" stroke-width="2.4"/><line x1="254" y1="56" x2="266" y2="56" stroke="#ff8575" stroke-width="2.4"/><line x1="269" y1="63" x2="281" y2="63" stroke="#ff8575" stroke-width="2.4"/><line x1="284" y1="70" x2="296" y2="70" stroke="#ff8575" stroke-width="2.4"/><text x="270" y="98" text-anchor="middle" font-size="9" fill="#ff8575">반음 하행 = 비탄</text></svg><p><b>해석 · </b>바로크에서 음형은 <b>수사적 약속</b>이었어요. <b>반음계 하행 베이스</b>(라멘토 베이스)는 디도의 탄식처럼 죽음·비탄을 그리고, 상승 음형은 천상을 향합니다. 음형을 읽으면 "왜 그렇게 연주해야 하는가"의 역사적 근거가 생겨요.</p><div class="cex"><div class="cex-t">🎧 예시 — 라멘토 베이스 (반음계 하행)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playMel([60,59,58,57],0.75)">하행 재생</button></div><div class="cex-d">반음계 하행(도-시-시♭-라) = 비탄·죽음의 상징(passus duriusculus). 디도의 탄식이 이 음형이에요.</div></div>',think:['라멘토 베이스가 여러 문화·시대에서 슬픔이 된 이유 — 학습일까 신체(한숨·낙하)일까?','상승=희망 같은 도식을 일부러 뒤집은 곡이 있다면 어떤 효과가 날까?'],listen:['퍼셀 「디도의 탄식」','라멘토 베이스 위의 눈물. 반음 하행을 몸의 낙하로 느껴보세요.'],read:[
'anabasis(상승)=부활·천상 / catabasis(하강)=매장·겸손','passus duriusculus: 반음계 하행 베이스=비탄·죽음','saltus duriusculus: 불협 도약=충격','circulatio: 원 그리며 돎=휘감김'],
q:[mc('반음계 하행 베이스가 상징하는 정서는?',['기쁨','비탄·죽음','승리','평온'],1,'passus duriusculus. 디도의 탄식.'),
sa('음형이 위로 오르며 부활·천상을 상징하는 것은?','anabasis','연주: 무게를 위로 실어.'),
mc('음형론이 연주에 주는 것은?',['템포','정서를 곧 주법·무게로 번역','조성','악기'],1,'"왜 그렇게"의 역사적 근거.')],
task:'바흐 수난곡에서 반음계 하행(비탄)을 하나 찾아보기.',hand:''},

{d:38,wk:7,ph:'의미·해석',t:'음형론 II',lead:'말하기 음형과 큰 수사구조.',concept:'<p>말하기(수사) 음형과 큰 수사구조예요.</p><table class="ctbl"><tr><th>음형</th><th>형상</th><th>정서</th></tr><tr><td>suspiratio / pianto</td><td>2도 하행(흔히 반음)</td><td>한숨 · 눈물</td></tr><tr><td>aposiopesis</td><td>갑작 총휴지</td><td>말 삼킴 · 전환</td></tr><tr><td>exclamatio</td><td>6도↑ 솟구침</td><td>외침</td></tr><tr><td>interrogatio</td><td>끝을 올려</td><td>질문</td></tr></table><p><b>해석 · </b>개별 음형을 넘어, 곡 전체를 <b>연설처럼</b> 읽을 수도 있어요 — 도입(exordium) → 진술 → 논증 → 결론(peroratio). 형식을 "설득의 흐름"으로 보면 어디서 힘을 주고 어디서 풀지가 논리로 잡힙니다.</p><div class="cex"><div class="cex-t">🎧 예시 — 한숨 음형 (pianto)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playMel([69,67,65,64],0.55)">한숨 재생</button></div><div class="cex-d">2도 하행(흔히 반음)의 한숨·눈물. 기대듯 얹었다 떨구는 릴리스로 연주해요.</div></div>',think:['총휴지의 장력은 소리의 부재에서 와요. 침묵이 말이 되는 조건은 무엇일까?','도입–논증–결론이 없는 음악(앰비언트)은 수사학으로 보면 무엇에 가까울까?'],listen:['하이든 교향곡 94번 「놀람」 2악장','침묵과 놀람의 장난 — 유머도 음형이에요. 웃어도 됩니다.'],read:[
'suspiratio/pianto: 2도 하행·한숨=탄식·눈물','aposiopesis: 갑작 총휴지=말 삼킴·전환','exclamatio: 6도↑ 솟구침=외침 / interrogatio: 끝 올려=질문','큰 수사구조: 도입(exordium)-진술-논증-결론(peroratio)'],
q:[mc('갑작스런 총휴지로 "말 삼킴·충격"을 주는 음형은?',['pianto','aposiopesis','exclamatio','tirata'],1,'침묵의 장력.'),
sa('2도 하행(흔히 반음)으로 한숨·눈물을 그리는 음형은?','pianto(suspiratio)','기대듯 떨구는 릴리스.'),
mc('연설처럼 곡을 도입-진술-논증-결론으로 읽는 시선은?',['집합론','큰 수사구조','톤네츠','아이소리듬'],1,'형식을 설득의 흐름으로.')],
task:'느린 악장에서 "한숨(pianto)" 제스처를 찾아 연주 함의(릴리스)를 메모.',hand:''},

{d:39,wk:7,ph:'의미·해석',t:'토포스 (표상)',lead:'사냥·전원·행진·탄식 같은 관습적 장면의 단서를 읽어요.',concept:'<p>음악의 <b>표상</b> — 사냥·전원·행진·탄식 같은 관습적 장면을 가리키는 단서(리듬·음색·조)예요. 토포스가 바뀌는 순간이 드라마의 전환점입니다.</p><table class="ctbl"><tr><th>토포스</th><th>단서</th><th>환기</th></tr><tr><td>사냥</td><td>6/8 · 뿔피리 5도 · 팡파르</td><td>야외 · 귀족 · 활력</td></tr><tr><td>전원</td><td>드론 · 6/8 · 느린 화성</td><td>목가 · 평온</td></tr><tr><td>행진</td><td>2박 · 점음표</td><td>군대 · 위엄</td></tr><tr><td>탄식</td><td>반음 하행 · 느림</td><td>애도</td></tr><tr><td>교회(stile antico)</td><td>대위 · 긴 음가</td><td>엄숙 · 권위</td></tr></table><p><b>해석 · </b>토포스를 알아보면 <b>같은 8분음표도</b> 사냥이면 튀고 교회면 잇는 식으로 주법이 한 번에 정해져요. 전원에서 질풍노도(단조·트레몰로)로 <b>토포스가 전환</b>되는 순간이 곧 곡의 분기점입니다.</p>',think:['토포스는 문화적 기억이에요. 그 기억이 없는 청중에게 전원 토포스는 무엇으로 들릴까?','오늘날 새로 생겨난 토포스(영화·게임 음악 등)를 하나 찾아 이름 붙여보기.'],listen:['베토벤 교향곡 6번 「전원」 1악장','음악이 그리는 풍경 속을 걷기 — 시냇물·새·바람이 어디 있는지.'],read:[
'사냥: 6/8·뿔피리 5도·팡파르 / 전원: 드론·6/8·느린 화성','행진: 2박·점음표 / 춤: 3박 정형','교회(stile antico): 대위·긴 음가=엄숙 / 질풍노도: 단조·트레몰로·도약','토포스 전환(전원→질풍노도)=드라마 분기점'],
q:[mc('드론+6/8 흔들림+느린 화성이 환기하는 토포스는?',['행진','전원','사냥','교회'],1,'목가·평온·자연.'),
sa('대위·푸가토·긴 음가로 엄숙·권위를 주는 토포스는?','교회 양식(stile antico)','과거를 환기.'),
mc('토포스를 알아보면 무엇이 한 번에 정해지나?',['조성','주법·음색·무게','템포만','악기 수'],1,'같은 8분음표도 사냥이면 튀고 교회면 잇는다.')],
task:'한 악장에서 토포스 전환(예: 전원→질풍노도)을 하나 찾기.',hand:''},

{d:40,wk:7,ph:'의미·해석',t:'음악심리 — 기대',lead:'왜 그렇게 들리는가. 기대의 생성·지연·위반·충족이 정서를 만들어요.',concept:'<p>왜 그렇게 들리는가. <b>기대의 생성·지연·위반·충족</b>이 정서를 만든다는 관점이에요 — 정점을 언제 두고 해결을 얼마나 미룰지의 근거입니다.</p><table class="ctbl"><tr><th>학자/이론</th><th>핵심</th></tr><tr><td>마이어(1956)</td><td>정서 = 기대의 생성·지연·위반·충족</td></tr><tr><td>나무어 I-R</td><td>음형이 다음을 암시(함의) → 충족/비틀기</td></tr><tr><td>후런 ITPRA</td><td>상상-긴장-예측-반응-평가 (지연된 해결이 쾌감↑)</td></tr></table><svg class="cdia" viewBox="0 0 320 118"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">기대 곡선 — 지연될수록 짜릿한 해결</text><line x1="18" y1="96" x2="305" y2="96" stroke="#75818b" stroke-width="1"/><path d="M20,92 C70,88 100,50 140,42 L200,42 C240,42 270,70 300,90" fill="none" stroke="#6fe9cd" stroke-width="2.4"/><line x1="140" y1="42" x2="200" y2="42" stroke="#f5d18f" stroke-width="3"/><circle cx="200" cy="42" r="4" fill="#ff8575"/><text x="75" y="112" text-anchor="middle" font-size="9" fill="#6fe9cd">긴장 상승</text><text x="170" y="34" text-anchor="middle" font-size="9" fill="#f5d18f" font-weight="700">지연(버티기)</text><text x="270" y="112" text-anchor="middle" font-size="9" fill="#ff8575" font-weight="700">해결 ↓</text></svg><p><b>해석 · </b>너무 뻔하면 지루하고 너무 어긋나면 혼란스러워요. 좋은 음악은 <b>기대를 만들고, 살짝 미루고, 결국 채워</b> 짜릿함을 줍니다. 후런의 ITPRA는 <b>지연된 해결</b>이 왜 더 강한 쾌감을 주는지 설명해요.</p><div class="cex"><div class="cex-t">🎧 예시 — 기대 — 충족 vs 위반</div><div class="cex-btns"><button class="cex-b" onclick="ac();playSeq([[67,71,74],[60,64,67]],1.0)">충족 V→I</button><button class="cex-b" onclick="ac();playSeq([[67,71,74],[69,72,76]],1.0)">위반 V→vi</button></div><div class="cex-d">V 다음 I(충족)를 기대하는데 vi로 빠지면(위반) 놀람·지연이 생겨요. 이 위반이 정서를 만듭니다.</div></div>',think:['지연된 해결이 더 달콤한 이유 — 일상에서 같은 구조(기다림–충족)를 찾아 비교해보기.','기대가 전혀 형성되지 않는 음악은 왜 정서를 만들기 어려울까? 명상 음악은 기대를 어떻게 다룰까?'],listen:['라흐마니노프 피아노 협주곡 2번 1악장 도입','종이 울리듯 쌓이는 기대와 그 해소 — 기다림이 달콤해지는 순간.'],read:[
'마이어(1956): 정서 = 기대의 생성·지연·위반·충족','나무어 I-R: 음형이 다음을 암시, 충족/비틈','후런 ITPRA: 상상-긴장-예측-반응-평가 — 지연된 해결이 쾌감↑','정점은 후반 2/3 부근에 와야 자연스러움'],
q:[mc('음악의 정서가 나온다고 마이어가 본 원천은?',['음량','기대의 생성·지연·위반·충족','조성','악기'],1,'너무 뻔하면 지루, 너무 어긋나면 혼란.'),
sa('지연된 해결이 왜 더 짜릿한지 다섯 단계로 설명한 이론(ITPRA)의 학자는?','후런(Huron)','Sweet Anticipation(2006).'),
mc('정점(긴장 최고점)이 오기 좋은 위치는?',['맨 앞','정중앙','후반 2/3 부근','맨 끝'],2,'너무 이르면 김 빠짐.')],
task:'좋아하는 곡에서 "해결을 미뤄 짜릿한" 지점을 하나 찾아 왜 그런지 메모.',hand:''},

{d:41,wk:7,ph:'의미·해석',t:'게슈탈트·기억·시간',lead:'우리가 어떻게 악구로 묶어 듣고 기억하는가.',concept:'<p>우리가 어떻게 <b>악구로 묶어 듣고 기억하는가</b>예요.</p><table class="ctbl"><tr><th>개념</th><th>내용</th></tr><tr><td>게슈탈트 묶기</td><td>근접·유사·연속으로 악구 자동 분절 (GTTM)</td></tr><tr><td>기억 층</td><td>메아리 → 작업 → 장기 (재현부가 의미 있는 이유)</td></tr><tr><td>크로노스 vs 카이로스</td><td>시계 시간 vs 질적·주관적 순간</td></tr><tr><td>시간 지각</td><td>rit이 시간을 늘려 느끼게 함 (사건 밀도↓)</td></tr></table><p><b>해석 · </b>우리는 마디를 자동으로 악구로 <b>묶어</b> 듣고, 재현부에서 앞의 것을 <b>기억</b>해 의미를 느껴요. 페르마타·정점에서 늘어나는 <b>카이로스</b>(질적 시간)는 rit이 사건 밀도를 낮춰 "한 순간에 오래 머물게" 하기 때문입니다.</p>',think:['페르마타의 카이로스 체험 — 명상의 지금 이 순간과 같은 것일까, 다른 것일까?','재현부가 의미를 갖는 건 기억 덕분이에요. 기억이 짧은 청중을 위한 작곡 전략은 무엇일까?'],listen:['아르보 패르트 「Für Alina」','시간이 멈춘 곳에서 듣기 — 카이로스. 명상의 지금과 음악의 지금이 만나는 자리.'],read:[
'게슈탈트 묶기: 근접·유사·연속으로 악구 자동 분절(GTTM)','기억 층: 메아리·작업·장기 — 재현부가 의미 있는 이유','크로노스(시계 시간) vs 카이로스(질적 순간)','rit이 "더 많은 시간"으로 느껴지는 이유: 사건 밀도↓'],
q:[mc('마디들을 악구로 자동으로 묶는 원리는?',['집합론','게슈탈트(근접·유사·연속)','아이소리듬','톤네츠'],1,'레르달-잭켄도프 GTTM.'),
sa('페르마타·정점에서 늘어나는 주관적·질적 시간을 뭐라 하나?','카이로스','크로노스=시계 시간.'),
mc('rit(늦춤)이 시간을 늘려 느끼게 하는 이유는?',['음량 증가','사건 밀도가 낮아져 주의가 길어짐','조성 변화','악기 증가'],1,'한 순간에 머무는 시간이 길어짐.')],
task:'페르마타가 있는 악구에서 "시간이 늘어나는" 체감을 연주 동작으로 상상.',hand:''},

{d:42,wk:7,ph:'의미·해석',t:'복습 — 의미·해석',lead:'문제로 다지기.',concept:'<p><b>7주차 정리.</b> 음악의 <b>의미</b>를 읽고 그것을 연주로 번역하는 도구들이에요.</p><table class="ctbl"><tr><th>개념</th><th>핵심</th></tr><tr><td>음형론</td><td>음형 = 정서 (상승·하강·반음하행·한숨)</td></tr><tr><td>토포스</td><td>관습적 장면(사냥·전원·행진·탄식)의 단서</td></tr><tr><td>음악심리</td><td>기대의 생성·지연·충족이 정서</td></tr><tr><td>게슈탈트·시간</td><td>악구로 묶어 듣기 · 카이로스</td></tr></table><div class="cnote"><b>복습법 · </b>한 악구에서 <b>음형 1 + 토포스 1</b>을 찾아 "이래서 이렇게 연주한다"를 한 줄로 적어보세요. 표면 너머의 의미가 곧 연주 근거예요.</div>',think:['음형·토포스·기대·시간 중 실제 연주 해석에 가장 힘이 센 도구는? 근거와 함께.','의미를 읽는 분석이 지나치면 무엇이 위험해질까 — 해석과 과잉 해석의 경계는?'],listen:['모리코네 「시네마 천국」 러브 테마','음형·토포스·기대가 3분 안에 다 있는 이유 — 그리고 그걸 다 잊게 만드는 이유.'],read:['음형론·토포스·음악심리 점검','핵심: 표면 너머의 의미를 읽어 주법·무게로 번역'],
q:[mc('exclamatio(외침) 음형의 형상은?',['반음 하행','6도↑ 솟구침','총휴지','원 그리기'],1,'솟는 음에 무게·열기.'),
sa('사냥 토포스의 대표 단서 2가지.','6/8 · 뿔피리 5도(팡파르)','야외·귀족·활력.'),
mc('나무어의 이론(I-R)이 다루는 것은?',['음 집합','한 음형이 다음을 어떻게 암시하는가','톤네츠','판본'],1,'함의-실현.'),
sa('음형론이 "어떻게"라면 무엇의 "왜 그렇게"를 주나?','셈여림·아고긱(표현)의 역사적 근거','13·14장과 짝.')],
task:'한 악구에서 음형 1 + 토포스 1을 찾아 "이래서 이렇게 연주"를 한 줄로.',hand:''},

{d:43,wk:8,ph:'확장',t:'해석사·연주 전통',lead:'같은 악보를 시대마다 다르게. "정답은 하나가 아니다".',concept:'<p>같은 악보를 <b>시대마다 다르게</b> 연주해 왔어요. "정답은 하나가 아니다"라는 것, 그리고 내 선택의 근거를 역사에서 찾는 것이 핵심입니다.</p><table class="ctbl"><tr><th>경향</th><th>특징</th></tr><tr><td>주관·유기적</td><td>템포 자유·큰 호흡 (푸르트벵글러 계열)</td></tr><tr><td>즉물·정확</td><td>악보에 충실 (토스카니니 계열)</td></tr><tr><td>HIP 원전연주</td><td>시대악기·빠른 템포·비브라토 절제·작은 편성</td></tr><tr><td>판본</td><td>Urtext vs 연주판 — 판본 선택도 이미 해석</td></tr></table><p><b>해석 · </b>리디아 괴어는 "작품에 충실=객관"이라는 생각조차 <b>1800년경의 관념</b>임을 보였고, 타루스킨은 HIP의 "진정성"이 사실 <b>20세기의 취향</b>이라 지적했어요. 즉 모든 연주는 해석이며, 중요한 건 <b>왜 그렇게 하는지</b>의 근거예요.</p>',think:['모든 연주가 해석이라면 원전연주의 가치는 어디에 있을까 — 진정성이 아니라면 무엇?','내 연주 취향이 어느 전통에 가까운지, 그렇게 된 이유를 추적해보기.'],listen:['베토벤 5번 1악장 — 푸르트벵글러와 카를로스 클라이버 연속 듣기','같은 악보, 다른 세계. 어느 쪽이 내 심장에 가까운가.'],read:[
'양극: 주관·유기적(푸르트벵글러 경향) vs 즉물·정확(토스카니니 경향)','HIP 원전연주: 시대악기·빠른 템포·비브라토 절제·작은 편성','괴어: "작품" 개념은 1800년경 관념 / 타루스킨: HIP 진정성=20세기 취향','판본(Urtext vs 연주판)도 이미 해석'],
q:[mc('원전연주(HIP)가 가져온 변화가 아닌 것은?',['빠른 템포','비브라토 절제','작은 편성','느린 템포·큰 편성'],3,'가볍고 빠르고 또렷하게.'),
sa('"작품에 충실=객관"조차 1800년경 관념임을 보인 철학자는?','리디아 괴어','The Imaginary Museum of Musical Works.'),
mc('해석사 공부의 실전 방법은?',['한 녹음만 반복','역사적 녹음 3종을 같은 악구로 비교','악보만 보기','템포만 재기'],1,'차이를 역추적해 내 선택의 근거로.')],

{d:44,wk:8,ph:'확장',t:'신리만 변형이론 I',lead:'화음을 "다른 화음으로 가는 동작"으로 봐요. 기능으로 안 풀리는 진행.',concept:'<p>화음을 "무엇이다"가 아니라 <b>다른 화음으로 가는 동작</b>으로 보는 관점이에요. 기능화성으로 안 풀리는 반음계 진행을 설명합니다.</p><table class="ctbl"><tr><th>변형</th><th>이동</th><th>예</th></tr><tr><td>P (Parallel)</td><td>같은 으뜸 장↔단 · 3음만 반음</td><td>C장 ↔ c단</td></tr><tr><td>L (Leading-tone)</td><td>장 밑음 반음↓ → 위 단화음</td><td>C장 → e단</td></tr><tr><td>R (Relative)</td><td>나란한조 · 5음 온음</td><td>C장 ↔ a단</td></tr></table><svg class="cdia" viewBox="0 0 320 138"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">PLR — 한 음만 반음 움직여 옮겨가기(아낌)</text><circle cx="160" cy="70" r="24" fill="rgba(111,233,205,.2)" stroke="#6fe9cd" stroke-width="1.8"/><text x="160" y="75" text-anchor="middle" font-size="13" font-weight="800" fill="#6fe9cd">C장</text><circle cx="60" cy="112" r="21" fill="rgba(162,179,222,.18)" stroke="#a2b3de"/><text x="60" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#a2b3de">c단</text><circle cx="160" cy="120" r="21" fill="rgba(162,179,222,.18)" stroke="#a2b3de"/><text x="160" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#a2b3de">e단</text><circle cx="260" cy="112" r="21" fill="rgba(162,179,222,.18)" stroke="#a2b3de"/><text x="260" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#a2b3de">a단</text><line x1="145" y1="88" x2="75" y2="98" stroke="#75818b" stroke-width="1.5"/><line x1="160" y1="94" x2="160" y2="100" stroke="#75818b" stroke-width="1.5"/><line x1="175" y1="88" x2="245" y2="98" stroke="#75818b" stroke-width="1.5"/><text x="98" y="92" font-size="10" font-weight="700" fill="#6fe9cd">P</text><text x="167" y="99" font-size="10" font-weight="700" fill="#6fe9cd">L</text><text x="212" y="92" font-size="10" font-weight="700" fill="#6fe9cd">R</text></svg><p><b>해석 · </b>핵심 원리는 <b>아낌(parsimony)</b> — 공통음을 최대한 붙들고 <b>한 음만 반음</b> 움직여 옮겨가요. 최소의 손놀림으로 색이 확 바뀌는 것이 이 이론의 매력입니다.</p><div class="cex"><div class="cex-t">🎧 예시 — PLR 변형 (from C장조)</div><div clas {d:45,wk:8,ph:'확장',t:'신리만 II — 톤네츠',lead:'음 공간과 육각순환. 바그너·영화음악의 색.',concept:'<p>음을 격자에 배치한 <b>음 공간</b>과, P·L을 번갈아 도는 <b>육각순환</b>이에요. 바그너·영화음악의 3도 색을 설명합니다.</p><table class="ctbl"><tr><th>개념</th><th>내용</th></tr><tr><td>톤네츠</td><td>음을 3·5도 격자에 배치 — PLR은 이웃 이동</td></tr><tr><td>육각순환(PL-cycle)</td><td>P·L 번갈아 → 6삼화음 폐곡선</td></tr><tr><td>적용</td><td>바그너 트리스탄·슈베르트 3도 전조·영화음악</td></tr></table><svg class="cdia" viewBox="0 0 320 158"><text x="160" y="14" text-anchor="middle" font-size="10" fill="#a7b4bc">육각순환 — P·L 번갈아 = 6삼화음 폐곡선</text><line x1="160" y1="20" x2="205" y2="46" stroke="#6fe9cd" stroke-width="1.8" opacity=".7"/><text x="183" y="36" text-anchor="middle" font-size="9" font-weight="800" fill="#6fe9cd">P</text><line x1="205" y1="46" x2="205" y2="98" stroke="#f5d18f" stroke-width="1.8" opacity=".7"/><text x="205" y="75" text-anchor="middle" font-size="9" font-weight="800" fill="#f5d18f">L</text><line x1="205" y1="98" x2="160" y2="124" stroke="#6fe9cd" stroke-width="1.8" opacity=".7"/><text x="183" y="114" text-anchor="middle" font-size="9" font-weight="800" fill="#6fe9cd">P</text><line x1="160" y1="124" x2="115" y2="98" stroke="#f5d18f" stroke-width="1.8" opacity=".7"/><text x="137" y="114" text-anchor="middle" font-size="9" font-weight="800" fill="#f5d18f">L</text><line x1="115" y1="98" x2="115" y2="46" stroke="#6fe9cd" stroke-width="1.8" opacity=".7"/><text x="115" y="75" text-anchor="middle" font-size="9" font-weight="800" fill="#6fe9cd">P</text><line x1="115" y1="46" x2="160" y2="20" stroke="#f5d18f" stroke-width="1.8" opacity=".7"/><text x="137" y="36" text-anchor="middle" font-size="9" font-weight="800" fill="#f5d18f">L</text><circle cx="160" cy="20" r="17" fill="rgba(111,233,205,.2)" stroke="#6fe9cd" stroke-width="1.5"/><text x="160" y="23" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6fe9cd">C장</text><circle cx="205" cy="46" r="17" fill="rgba(162,179,222,.2)" stroke="#a2b3de" stroke-width="1.5"/><text x="205" y="49" text-anchor="middle" font-si {d:46,wk:8,ph:'확장',t:'20세기 이후 분석',lead:'조성이 해체된 뒤의 도구들. 종지 대신 통일성·질감·음향.',concept:'<p>조성이 해체된 뒤의 도구들이에요. 종지 대신 <b>통일성·질감·음향</b>을 묻습니다.</p><table class="ctbl"><tr><th>도구</th><th>내용</th></tr><tr><td>집합론(포트)</td><td>음 묶음이 분석 단위 · 음정군 벡터로 색을 수치화</td></tr><tr><td>12음·음렬주의</td><td>P·R·I·RI + 12이항 = 48 행렬</td></tr><tr><td>음계</td><td>옥타토닉·온음·메시앙 이조제한선법</td></tr><tr><td>음색·질감</td><td>음향덩어리·미소다성(리게티)·스펙트럴</td></tr></table><p><b>해석 · </b>분석의 질문이 "종지가 어디냐"에서 "<b>무엇이 이 곡을 하나로 묶나</b>(통일성·질감·음향적 정점)"로 바뀌어요. 스펙트럴 음악에선 음색 자체가 화성이 되기도 합니다.</p><div class="cex"><div class="cex-t">🎧 예시 — 온음음계 (whole-tone)</div><div class="cex-btns"><button class="cex-b" onclick="ac();playMel([60,62,64,66,68,70,72],0.34)">온음음계</button></div><div class="cex-d">반음이 없어 방향감이 흐려지는 부유하는 색(드뷔시). 조성의 중력이 사라진 소리예요.</div></div>',think:['종지가 사라진 음악에서 끝났다는 느낌은 무엇이 만들까 — 20세기 곡의 마침을 세 유형으로 분류해보기.','음색이 화성이 되는 스펙트럴 발상 — 소리 자체를 듣는 것과 명상적 듣기의 접점은?'],listen:['리게티 「Lux Aeterna」','음향 덩어리 속에 잠기기 — 소리 그 자체를 듣는 일. 명상적 듣기의 극단이에요.'],read:[
'집합론(포트): 음 묶음이 분석 단위, 음정군 벡터로 색 수치화','12음·음렬주의: P·R·I·RI + 12이항 = 48 행렬(총렬주의)','음계: 옥타토닉·온음·메시앙 이조제한선법','음색·질감: 음향덩어리·미소다성(리게티)·스펙트럴(음색이 곧 화성)'],
q:[mc('조성 없는 음악을 "음 묶음(집합)"으로 분석한 학자는?',['쉥커','앨런 포트','캐플린','래트너'],1,'정규형·음정군 벡터.'),

mc('20세기 레퍼토리에서 묻는 것으로 바뀐 것은?',['종지가 어디냐','통일성·질감·음향적 정점','조가 무엇이냐','박자표'],1,'분석 단위가 음집합·질감·음색으로.')],

{d:47,wk:8,ph:'확장',t:'예술 횡단 + 구조 종합',lead:'여러 예술이 공유하는 구조 원리로 발견을 하나로 묶어요.',concept:'<p>여러 예술이 공유하는 <b>구조 원리</b>로 지금까지의 발견을 하나로 묶어요.</p><table class="ctbl"><tr><th>메타 원리</th><th>음악에서</th></tr><tr><td>중심·위계</td><td>토닉·주선율</td></tr><tr><td>긴장-해소</td><td>불협→협화, 도미넌트→토닉</td></tr><tr><td>반복·변화</td><td>동기 전개·변주</td></tr><tr><td>대칭·가역</td><td>역행·전위·회문</td></tr><tr><td>전경·배경</td><td>주선율·반주 / 쉥커 층</td></tr></table><p><b>해석 · </b>화성의 협화↔불협은 리듬의 격자↔이탈(메트릭 디소넌스)과 같은 원리예요. 분석의 마지막은 <b>모든 발견을 하나의 긴장 곡선</b>으로 통합하는 것 — 국지마다 무게 주면 부서집니다.</p>',think:['긴장–해소·반복–변화·전경–배경이 통하지 않는 예술이 있을까? 반례를 찾아보기.','내 전공 분야의 언어로 이번 주 개념 하나를 번역해보기.'],listen:['스크랴빈 「프로메테우스」 (칸딘스키 그림 한 점과 함께)','색을 들으려 한 음악과 소리를 그리려 한 그림 — 번역의 순간을 목격하세요.'],read:[
'예술 횡단: 콜라주·몽타주·내러티브 아크·라이트모티프·회문·여백(間)','메타 원리: 중심·위계 / 긴장-해소 / 운동·방향 / 반복·변화 / 대칭·가역 / 전경·배경','구조적 운율: 화성 협화↔불협 ≈ 리듬 격자↔이탈(메트릭 디소넌스)','종합 = 1부 "긴장 곡선 통합"'],

sa('화성의 불협을 빌려 박의 어긋남을 부르는 말은?','메트릭 디소넌스','구조적 운율의 증거.'),

function btFixed(m){return m<=4;}                  /* 3·4박은 배분이 하나뿐 */
function btSplit(m){
  var mid=Math.max(0,m-2);
  if(m<=2)return {L:0,R:0};
  if(m===3)return {L:0,R:1};                       /* 2번은 항상 오른쪽 */
  if(m===4)return {L:1,R:1};                       /* 2번 왼쪽 · 3번 오른쪽 */
  var lo=1,hi=mid-1;                               /* 5박 이상은 양쪽에 최소 1 */
  if(BTSHAPE.L!=null){var L2=Math.max(lo,Math.min(hi,BTSHAPE.L));return {L:L2,R:mid-L2};}
  var pat=BTPAT[m];
  if(pat)return {L:Math.max(lo,Math.min(hi,pat.L)),R:mid-Math.max(lo,Math.min(hi,pat.L))};
  var L=Math.max(lo,Math.min(hi,Math.floor(mid/2)));

function btPoints(m){
  var sp=btSplit(m), L=sp.L, R=sp.R;
  var CX=150, TOP=74, BOT=168, LX=54, RX=246;
  var pts=[[CX,BOT]];                          /* 1박 = 최저점(다운) */
  for(var i=0;i<L;i++){
    var s=(L===1)?1:(i/(L-1)), t=(L===1)?1:(0.38+0.62*s);   /* 안쪽 → 바깥쪽 */
    pts.push([CX-(CX-LX)*t, BOT-(BOT-TOP)*(0.18+0.30*s)]);
  }
  for(var j=0;j<R;j++){
    var s2=(R===1)?1:(j/(R-1)), u=(R===1)?1:(0.38+0.62*s2); /* 안쪽 → 바깥쪽 */
    pts.push([CX+(RX-CX)*u, BOT-(BOT-TOP)*(0.20+0.42*s2)]);
  }
  pts.push([CX,TOP]);                          /* 마지막 박 = 최고점(업) */

function sizeOf(t,e,m){
  if(e===0)return (t===2)?1:2;
  if(e===1)return (m===2)?4:3;

}

  var r=sizeOf(t,e,m);
  return {
    n:n, g:g, gl:gl, b:b, t:t, e:e, m:m, c:c, a:a, sc:sc, r:r,
    cl:(a==="무르게")?"파시브":"악티브",

    ar:{"무르게":"레가토","곧게":"눌러 끌기","찌르게":"마르카토 · 스타카토"}[a],

});

var LEXSEL={fam:GROUPS[0].name, cur:EMO[0]};
function lexByFam(f){var g=GROUPS.filter(function(x){return x.name===f;})[0];return EMO.filter(function(w){return g&&w.g===g.id;});}
function lexFamName(id){var g=GROUPS.filter(function(x){return x.id===id;})[0];return g?g.name:id;}
function lexStyle(w){
  w=w||LEXSEL.cur;
  var act=(w.a==='찌르게'), soft=(w.a==='무르게');
  return {te:act?1.60:(soft?1.12:1.36), arc:act?0.72:(soft?1.28:1.00),
    hold:(w.t===2)?0.68:(w.t===1?0.85:1.0), size:SZV[w.r]||1,
    squash:act?1:(soft?0.35:0.7), label:w.a+' · '+SZL[w.r]};
}
function lexLevel(w,p){
  w=w||LEXSEL.cur;
  var BASE=[0,0.14,0.24,0.38,0.52,0.66], AMP=[0,0.10,0.13,0.17,0.21,0.25];
  var base=BASE[w.r]||0.4, amp=AMP[w.r]||0.15, v;
  if(w.c==='앞무겁')      v=base+amp*(1-p);
  else if(w.c==='뒤무겁') v=base+amp*p;
  else if(w.c==='산모양') v=base+amp*Math.sin(Math.PI*p)*1.2;
  else                    v=base+amp*0.35;
  return Math.max(0.06,Math.min(0.96,v));
}
function lexCueBeat(w,n){
  w=w||LEXSEL.cur;
  if(w.c==='앞무겁')return 0;
  if(w.c==='뒤무겁')return n-1;
  if(w.c==='산모양')return Math.max(0,Math.round(n/2)-1);
  return -1;
}
function lexShapeText(w){
  w=w||LEXSEL.cur;
  return CRV[w.c]+' '+ATK[w.a]+'. 왼손은 '+LHC[w.c]+'. 예비박은 '+AUF[w.a]+AUM[w.m]+'.';
}
function lexDesc(w){
  w=w||LEXSEL.cur;
  return w.n+' — '+lexFamName(w.g)+' 계열, '+w.gl+'. 밝기 '+AXN.b.st[w.b]+' · 긴장 '+AXN.t.st[w.t]
   +' · 에너지 '+AXN.e.st[w.e]+' · 밀당 '+MDN[w.m]+' · 크기 '+SZL[w.r]+'. '+w.sc+'.';
}

function lhUpdate(){if(!LH.on)return;var a=ac();var el=a.currentTime-BT.t0;if(el<0)el=0;var bd=60/BT.bpm;var tb=el/bd;var bi=Math.floor(tb)%BT.meter;var fr=tb-Math.floor(tb);var v=0.08,flash=false;
if(LH.ex==='hold'){v=0.08;}
else if(LH.ex==='cresc'){v=0.10+0.85*((tb/(BT.meter*LH.cBars))%1);}
else if(LH.ex==='dim'){v=0.95-0.85*((tb/(BT.meter*LH.cBars))%1);}
else if(LH.ex==='cue'){var _t=(LH.cue<0?BT.meter-1:Math.min(LH.cue,BT.meter-1));var on=(bi===_t)&&fr<0.5;v=on?0.92:0.14;flash=on;}
else if(LH.ex==='whole'){var dn=(bi===0)&&fr<0.3;v=0.78;flash=dn;}
  else if(LH.ex==='emo'){var pp=(tb%BT.meter)/BT.meter;v=lexLevel(LEXSEL.cur,pp);var tg=document.getElementById('lhTagName');if(tg)tg.textContent=LEXSEL.cur.n+' · '+LEXSEL.cur.c;}
var goal=v,cueQ=null,susP=null,cutN=false,nb=BT.meter,pb=tb%nb;

  else if(LH.ex==='emo'){var cb=lexCueBeat(LEXSEL.cur,nb);if(cb>=0)cueQ=cb;goal=lexLevel(LEXSEL.cur,1);}
  var sd=document.getElementById('lhSig'),sn=document.getElementById('lhSigN'),sc=document.getElementById('lhSigT');

    if(sc)sc.textContent='큐까지';}
  else{if(sn)sn.textContent='–';if(sd)sd.className='sigdot';if(sc)sc.textContent='큐 없음';}
  var f=document.getElementById('lhFill');if(f){f.style.height=Math.max(4,Math.round(v*100))+'%';f.classList.toggle('flash',flash);}

function tone(midi,time,dur,gain){var a=ac();var o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(midi-69)/12);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(0.0001,time);g.gain.exponentialRampToValueAtTime(gain,time+0.02);g.gain.exponentialRampToValueAtTime(0.0001,time+dur);o.start(time);o.stop(time+dur+0.05);}
function playChord(m,d){var t=ac().currentTime+0.05;m.forEach(function(x){tone(x,t,d,0.15);});}
function playMel(m,d){var t=ac().currentTime+0.05;m.forEach(function(x,i){tone(x,t+i*d,d*0.9,0.22);});}
function playSeq(chs,d){var t=ac().currentTime+0.05;chs.forEach(function(ch,i){ch.forEach(function(x){tone(x,t+i*d,d*0.9,0.14);});});}
function pick4(list,ansLabel){var others=list.filter(function(x){return x[0]!==ansLabel;});var ch=shuffle(others).slice(0,3).map(function(x){return x[0];});ch.push(ansLabel);return shuffle(ch);}

/* 오선 악보 — MIDI 음높이 배열을 받아 SVG로 그린다 */
function _stf(chords, opt){
  opt = opt || {};
  var W = opt.w || 300, gap = opt.gap || 56, x0 = 52;
  var top = 26, sp = 7;                      /* 줄 간격의 절반 */
  var labels = opt.labels || [];
  var n = chords.length;
  var W2 = Math.max(W, x0 + gap * n + 16);
  var H = opt.h || 108;
  var s = '<svg class="stf" viewBox="0 0 ' + W2 + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  /* 오선 5줄 */
  for (var i = 0; i < 5; i++) {
    var y = top + i * sp * 2;
    s += '<line x1="10" y1="' + y + '" x2="' + (W2 - 10) + '" y2="' + y + '" stroke="#5a6570" stroke-width="1"/>';
  }
  /* 높은음자리표 */
  s += '<text x="16" y="' + (top + sp * 6.2) + '" font-size="34" fill="#c8d2da">\ud834\udd1e</text>';
  /* 음이름 → 오선 위치 (C4=0부터 계단 수) */
  var STEP = {0:0, 2:1, 4:2, 5:3, 7:4, 9:5, 11:6};
  var ACC = {1:'\u266f', 3:'\u266f', 6:'\u266f', 8:'\u266f', 10:'\u266f'};
  var BASE = {1:0, 3:2, 6:5, 8:7, 10:9};
  function ypos(m){
    var pc = ((m % 12) + 12) % 12, oct = Math.floor(m / 12) - 5;   /* C5 기준 */
    var base = (STEP[pc] !== undefined) ? pc : BASE[pc];
    var st = STEP[base] + oct * 7;
    return top + sp * 8 - st * sp;                                  /* E4(맨 아래 줄) 기준 */
  }
  chords.forEach(function(ch, ci){
    var cx = x0 + gap * ci;
    ch.forEach(function(m){
      var y = ypos(m), pc = ((m % 12) + 12) % 12;
      /* 덧줄 */
      var low = top + sp * 8, high = top;
      for (var ly = low + sp * 2; ly <= y + 0.5; ly += sp * 2)
        s += '<line x1="' + (cx - 9) + '" y1="' + ly + '" x2="' + (cx + 9) + '" y2="' + ly + '" stroke="#5a6570" stroke-width="1"/>';
      for (var hy = high - sp * 2; hy >= y - 0.5; hy -= sp * 2)
        s += '<line x1="' + (cx - 9) + '" y1="' + hy + '" x2="' + (cx + 9) + '" y2="' + hy + '" stroke="#5a6570" stroke-width="1"/>';
      if (ACC[pc]) s += '<text x="' + (cx - 20) + '" y="' + (y + 4) + '" font-size="13" fill="#c8d2da">' + ACC[pc] + '</text>';
      s += '<ellipse cx="' + cx + '" cy="' + y + '" rx="5.6" ry="4.2" fill="#e6edf3" transform="rotate(-16 ' + cx + ' ' + y + ')"/>';
    });
    if (labels[ci]) s += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8fa3b0">' + labels[ci] + '</text>';
  });
  s += '</svg>';
  return s;
}
function stfBlock(title, chords, labels, note){
  return '<div class="stfbox"><div class="stft">' + title + '</div>'
    + _stf(chords, {labels: labels})
    + (note ? '<div class="stfd">' + note + '</div>' : '') + '</div>';
}

function openRef(key){btStop();var h='<button class="back" onclick="goHome()">← 학습 지도로</button><div class="l-head"><div class="l-day">참고 사전 · REFERENCE</div><div class="l-t">기호 · 인물 · 구조</div><div class="l-lead">공부 중 언제든 찾아보는 상설 참고. 순서·번호와 무관하게 항상 같은 내용이에요.</div></div><div class="ref-search"><input type="text" placeholder="기호·인물·구조 검색 — 예: sfz, 쉥커, 소나타" oninput="refSearch(this.value)"></div><div class="ref-nav">'+REFTABS.map(function(t){return '<button class="'+(t[0]===key?'on':'')+'" onclick="refSwitch(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div><div id="refBody"></div>';document.getElementById('lessonBody').innerHTML=h;document.getElementById('home').style.display='none';document.getElementById('lesson').style.display='block';window.scrollTo(0,0);refSwitch(key);}
function refSwitch(key){document.querySelectorAll('.ref-nav button').forEach(function(b,i){b.classList.toggle('on',REFTABS[i][0]===key);});var bd=document.getElementById('refBody');var html='';if(key==='sym'){REF.sym.forEach(function(cat){html+='<div class="ref-cat">'+cat[0]+'</div><ul class="ref-list">'+cat[1].map(function(x){return '<li><span class="term">'+x[0]+'</span><span class="desc">'+x[1]+'</span></li>';}).join('')+'</ul>';});}else{var arr=key==='people'?REF.people:key==='struct'?REF.struct:REF.conduct;html='<ul class="ref-list">'+arr.map(function(x){return '<li><span class="term">'+x[0]+'</span><span class="desc">'+x[1]+'</span></li>';}).join('')+'</ul>';}bd.innerHTML=html;}

function refSearch(q){q=(q||'').trim().toLowerCase();var bd=document.getElementById('refBody');if(!bd)return;if(!q){document.querySelectorAll('.ref-nav button').forEach(function(b,i){if(i===0)b.classList.add('on');else b.classList.remove('on');});refSwitch('sym');return;}
var idx=[];REF.sym.forEach(function(cat){cat[1].forEach(function(x){idx.push(['음악 기호',x[0],x[1]]);});});REF.people.forEach(function(x){idx.push(['인물',x[0],x[1]]);});REF.struct.forEach(function(x){idx.push(['구조',x[0],x[1]]);});REF.conduct.forEach(function(x){idx.push(['악보 읽기',x[0],x[1]]);});
var res=idx.filter(function(it){return (it[1]+' '+it[2]).toLowerCase().indexOf(q)>=0;});
document.querySelectorAll('.ref-nav button').forEach(function(b){b.classList.remove('on');});
bd.innerHTML=res.length?'<ul class="ref-list">'+res.map(function(it){return '<li><span class="term">'+it[1]+'</span><span class="desc"><span style="color:var(--slate);font-size:.72rem;font-weight:700">['+it[0]+'] </span>'+it[2]+'</span></li>';}).join('')+'</ul>':'<div style="padding:20px;text-align:center;color:var(--muted)">검색 결과 없음</div>';}


/* ── 화성 건반 실기 (2옥타브·근음·전위 진행) ── */
var QUAL={triad:[['장3화음',[0,4,7]],['단3화음',[0,3,7]],['증3화음',[0,4,8]],['감3화음',[0,3,6]]],seventh:[['maj7',[0,4,7,11]],['딸림7(7)',[0,4,7,10]],['m7',[0,3,7,10]],['m7♭5',[0,3,6,10]],['dim7',[0,3,6,9]]]};
var NOTENAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
var HARMPLAN={1:'c-tri',2:'c-7th',3:'root-tri',4:'root-7th',5:'inv-tri',6:'inv-7th',7:'roman',8:'roman7',9:['roman','inv-7th'],10:['roman7','roman-min'],11:['roman7','roman-min','inv-7th']};
var HARMDESC={'c-tri':'C 위 3화음 쌓기 (기본기)','c-7th':'C 위 7화음 쌓기','root-tri':'여러 근음의 3화음 (이조)','root-7th':'여러 근음의 7화음','inv-tri':'3화음 전위 — 지정된 자리로','inv-7th':'7화음 전위','roman':'조성 안 로마숫자 화음 (I·IV·V…를 C장조에서 직접)','roman7':'로마숫자 7화음 (V7·ii7…)','roman-min':'단조 로마숫자 (a·e·d단조)'};
var HARM={mode:'c-tri',cur:null,sel:[]};
function noteName(m){return NOTENAMES[m%12];}
function pianoSVG(){var W=336,whitePCs=[0,2,4,5,7,9,11],whiteMidis=[];for(var oct=0;oct<2;oct++)whitePCs.forEach(function(pc){whiteMidis.push(60+oct*12+pc);});var ww=W/whiteMidis.length;var s='<svg viewBox="0 0 '+W+' 132" class="piano">';whiteMidis.forEach(function(m,i){s+='<rect id="pk'+m+'" class="pk pkw" x="'+(i*ww)+'" y="0" width="'+(ww-1)+'" height="130" rx="3" onclick="harmKey('+m+')"/><text x="'+(i*ww+ww/2)+'" y="123" text-anchor="middle" font-size="7.5" fill="#5c6670" pointer-events="none">'+noteName(m)+'</text>';});var lw={1:0,3:2,6:5,8:7,10:9};for(var oct=0;oct<2;oct++){[1,3,6,8,10].forEach(function(pc){var m=60+oct*12+pc;var li=whiteMidis.indexOf(60+oct*12+lw[pc]);var x=(li+1)*ww-ww*0.32;s+='<rect id="pk'+m+'" class="pk pkb" x="'+x+'" y="0" width="'+(ww*0.64)+'" height="82" rx="2" onclick="harmKey('+m+')"/>';});}return s+'</svg>';}
function genHarm(mode){if(mode==='roman'||mode==='roman7'||mode==='roman-min'){var D3={I:[0,4,7],ii:[2,5,9],iii:[4,7,11],IV:[5,9,12],V:[7,11,14],vi:[9,12,16]};var D7={I:[0,4,7,11],ii:[2,5,9,12],IV:[5,9,12,16],V:[7,11,14,17],vi:[9,12,16,19]};var MIN={i:[0,3,7],iv:[5,8,12],V:[7,11,14],V7:[7,11,14,17],VI:[8,12,15],'ii\u00b0':[2,5,8]};var label,notes;if(mode==='roman-min'){var mp=['i','iv','V','V7','VI','ii\u00b0'];var mr=mp[rnd(mp.length)];var MKEYS=[['a',69],['e',64],['d',62]];var mk=MKEYS[rnd(3)];notes=MIN[mr].map(function(x){return x+mk[1];});label=mk[0]+'단조에서 <b>'+mr+'</b>';}else{var KEYS=[['C',60],['G',67],['D',62],['F',65],['B♭',70]];var kk=KEYS[rnd(KEYS.length)];var isR7=mode==='roman7';var pool=isR7?['I','ii','IV','V','vi']:['I','ii','iii','IV','V','vi'];var r=pool[rnd(pool.length)];var ivl=(isR7?D7:D3)[r];notes=ivl.map(function(x){return x+kk[1];});label=kk[0]+'장조에서 <b>'+r+(isR7?'7':'')+'</b>';}while(Math.max.apply(null,notes)>83){notes=notes.map(function(n){return n-12;});}while(Math.min.apply(null,notes)<60){notes=notes.map(function(n){return n+12;});}notes.sort(function(a,b){return a-b;});return{label:label,notes:notes};}var isSev=mode.indexOf('7')>=0;var pool=isSev?QUAL.seventh:QUAL.triad;var q=pool[rnd(pool.length)];var root=60;if(mode.indexOf('root')>=0||mode.indexOf('inv')>=0)root=[60,62,64,65,67][rnd(5)];var notes=q[1].map(function(x){return x+root;});var label=noteName(root)+'음 위 <b>'+q[0]+'</b>';if(mode.indexOf('inv')>=0){var inv=1+rnd(q[1].length-1);for(var k=0;k<inv;k++){var mn=Math.min.apply(null,notes);notes[notes.indexOf(mn)]=mn+12;}label+=' · <b>'+inv+'전위</b>';}notes.sort(function(a,b){return a-b;});while(Math.max.apply(null,notes)>83){notes=notes.map(function(n){return n-12;});}while(Math.min.apply(null,notes)<60){notes=notes.map(function(n){return n+12;});}notes.sort(function(a,b){return a-b;});return{label:label,notes:notes};}
function harmNew(){var _md=Array.isArray(HARM.mode)?HARM.mode[rnd(HARM.mode.length)]:HARM.mode;HARM.cur=genHarm(_md);HARM.sel=[];for(var m=60;m<=83;m++){var k=document.getElementById('pk'+m);if(k)k.classList.remove('sel','ok','no');}var pr=document.getElementById('harmPrompt');if(pr)pr.innerHTML=HARM.cur.label+' 쌓기';var r=document.getElementById('harmR');if(r){r.textContent='';r.className='harm-r';}}
function harmKey(m){var i=HARM.sel.indexOf(m);var k=document.getElementById('pk'+m);if(i>=0){HARM.sel.splice(i,1);if(k)k.classList.remove('sel');}else{HARM.sel.push(m);if(k)k.classList.add('sel');}}
function harmCheck(){if(!HARM.cur)return;var ans=HARM.cur.notes.slice().sort(function(a,b){return a-b;});var sel=HARM.sel.slice().sort(function(a,b){return a-b;});var ok=ans.length===sel.length&&ans.every(function(v,i){return v===sel[i];});for(var m=60;m<=83;m++){var k=document.getElementById('pk'+m);if(!k)continue;k.classList.remove('sel');if(ans.indexOf(m)>=0)k.classList.add('ok');else if(HARM.sel.indexOf(m)>=0)k.classList.add('no');}playChord(ans,1.5);var r=document.getElementById('harmR');if(r){r.textContent=ok?'정답! ('+ans.map(noteName).join(' ')+')':'다시 — 정답은 초록 건반 ('+ans.map(noteName).join(' ')+')';r.className='harm-r '+(ok?'ok':'no');}}renderHome();
</script>
